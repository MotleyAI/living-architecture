# Every finding, verdict and hint a command prints, by stable id. `{name}` inserts the value as text (a
# non-string value as its canonical repr); `{name!r}` inserts the canonical repr; `{{` and `}}` are literal
# braces. Callers pre-format numbers that need padding or fixed decimals. See README.md.

# The ids an arc42 `[enforced: arch_check:<id>]` tag may name.
check_ids:
  - claims-exist
  - claims-exactly-once
  - arc42-exists
  - spec-mapping
  - baseline-ratchet
  - model-truth
  - enforced-tags
  - diagrams-fresh

findings:
  # ---- la-arch-check
  arch-check.ok: 'arch_check: OK'
  arch-check.summary: 'arch_check: {count} finding(s)'
  arch-check.setup-error: 'arch_check: {error}'
  arch-check.root-package-missing: architecture/index.yaml must set root_package to the top-level package name
  arch-check.index-not-mapping: 'architecture/index.yaml: top level must be a mapping'
  arch-check.layout-not-relative: 'architecture/index.yaml: {key} {value!r} must be a relative path'
  arch-check.layout-parent-segment: 'architecture/index.yaml: {key} {value!r} must not contain ''..'''
  arch-check.source-root-escapes: 'architecture/index.yaml: source_root {value!r} resolves outside the repo'
  arch-check.source-root-not-a-directory: 'architecture/index.yaml: source_root {value!r} is not a directory'
  arch-check.root-package-not-canonical: 'architecture/index.yaml: root_package {value!r} must not have empty or ''.'' segments'
  arch-check.root-package-escapes: 'architecture/index.yaml: root_package {value!r} resolves outside source_root {source_root!r}'
  arch-check.root-package-not-a-directory: 'architecture/index.yaml: root_package {value!r} is not a directory under source_root {source_root!r}'
  arch-check.root-packages-not-canonical: 'architecture/index.yaml: root_packages {value!r} must not have empty or ''.'' segments'
  arch-check.root-packages-escapes: 'architecture/index.yaml: root_packages entry {value!r} resolves outside source_root {source_root!r}'
  arch-check.root-packages-not-a-directory: 'architecture/index.yaml: root_packages entry {value!r} is not a directory under source_root {source_root!r}'
  arch-check.root-packages-overlap: 'architecture/index.yaml: root_packages entries {first!r} and {second!r} overlap'
  arch-check.root-packages-invalid: 'architecture/index.yaml: root_packages must be a non-empty list of non-empty strings'
  arch-check.root-config-required: 'architecture/index.yaml: set exactly one of root_package or root_packages'
  arch-check.source-roots-both: 'architecture/index.yaml: source_root and source_roots cannot both be set'
  arch-check.source-roots-invalid: 'architecture/index.yaml: source_roots must be a non-empty list of non-empty strings'
  arch-check.source-roots-not-canonical: 'architecture/index.yaml: source_roots entry {value!r} must not have empty or ''.'' segments'
  arch-check.source-roots-escapes: 'architecture/index.yaml: source_roots entry {value!r} resolves outside the repo'
  arch-check.source-roots-not-a-directory: 'architecture/index.yaml: source_roots entry {value!r} is not a directory'
  arch-check.source-roots-overlap: 'architecture/index.yaml: source_roots entries {first!r} and {second!r} overlap'
  arch-check.source-roots-unused: 'architecture/index.yaml: source_roots entry {value!r} holds no configured root package'
  arch-check.source-roots-none: 'architecture/index.yaml: root package {value!r} is under no source_roots entry'
  arch-check.source-roots-several: 'architecture/index.yaml: root package {value!r} is under more than one source_roots entry: {roots!r}'
  arch-check.tsconfig-escapes: 'architecture/index.yaml: tsconfig {value!r} resolves outside the repo'
  arch-check.metadata-invalid: 'model element {element}: {error}'
  arch-check.no-language-section: 'architecture/index.yaml: a language section is required (one of python, typescript)'
  arch-check.root-undeclared: 'model element {element}: top-level elements must be declared language roots'
  arch-check.root-missing: model has no root element for declared language {language}
  arch-check.arc42-key-retired: 'model element {element}: the arc42 key is retired; its doc is architecture/{element}.arc42.md'
  claims-exist.unit-missing: 'claims-exist: {node} claims {unit}, which does not exist on disk'
  claims-exist.child-missing: 'claims-exist: element {element} maps to {unit}, which does not exist on disk'
  claims-exist.unit-ambiguous: 'claims-exist: {node} claims {unit}, which is ambiguous: {candidates}'
  claims-exist.child-ambiguous: 'claims-exist: element {element} maps to {unit}, which is ambiguous: {candidates}'
  claims-exist.virtual-children: 'claims-exist: virtual node {node} may not contain elements'
  claims-exactly-once.claimed-twice: 'claims-exactly-once: {unit} claimed by both {first} and {second}'
  claims-exactly-once.unclaimed: 'claims-exactly-once: top-level {unit} is claimed by no node'
  claims-exactly-once.child-collides: 'claims-exactly-once: element {element} ({unit}) collides with declared unit {clash}'
  arc42-exists.system-missing: 'arc42-exists: {doc} is missing'
  arc42-exists.cross-cutting-not-flat: 'arc42-exists: cross_cutting_arc42 names {doc}, which must sit directly in architecture/'
  arc42-exists.cross-cutting-missing: 'arc42-exists: cross_cutting_arc42 names {doc}, which does not exist'
  arc42-exists.cross-cutting-is-element: 'arc42-exists: cross_cutting_arc42 names {doc}, the doc of model element {element}'
  arc42-exists.nested-doc: 'arc42-exists: {doc} must sit directly in architecture/'
  arc42-exists.orphan: 'arc42-exists: {doc} is orphaned — not {system}, the doc of a model element, or in cross_cutting_arc42'
  spec-mapping.mapped-twice: 'spec-mapping: {group} mapped by both {first} and {second}'
  spec-mapping.unknown-element: 'spec-mapping: {group} touches unknown element {element}'
  spec-mapping.unmapped: 'spec-mapping: spec group {group} is mapped by no element and not cross-cutting'
  spec-mapping.dir-missing: 'spec-mapping: {group} is mapped but has no spec dir in openspec/specs or a live change'
  spec-mapping.no-spec-md: 'spec-mapping: spec group {group} contains no spec.md'
  baseline-ratchet.missing: 'baseline-ratchet: legacy_arrows.baseline is missing from index.yaml'
  baseline-ratchet.invalid: 'baseline-ratchet: legacy_arrows.baseline must be a non-negative integer, got {value!r}'
  baseline-ratchet.mismatch: 'baseline-ratchet: model has {count} legacy arrow(s), baseline is {baseline}'
  model-truth.internal-arrow: 'model-truth: modeled relation {src} -> {dst} connects an element to its own ancestor or descendant; such edges are internal and never declared'
  model-truth.missing-edge: 'model-truth: measured runtime edge {src} -> {dst} is missing from the model (import {src_module} -> {dst_module})'
  model-truth.shadowed: 'model-truth: modeled relation {src} -> {dst} is fully shadowed'
  model-truth.dead: 'model-truth: modeled relation {src} -> {dst} has no measured runtime edge'
  enforced-tags.malformed: 'enforced-tags: malformed [{kind}: …] tag in {doc}'
  enforced-tags.malformed-review: 'enforced-tags: malformed [review] tag in {doc}'
  enforced-tags.target-mismatch: 'enforced-tags: {doc} target tag id {tag_id!r} does not match issue_key_pattern {pattern!r}'
  enforced-tags.unknown-id: 'enforced-tags: {doc} tags unknown enforcement id {tag_id!r}'
  enforced-tags.unknown-language: 'enforced-tags: {doc} tags undeclared language {language!r}'
  enforced-tags.untagged-item: 'enforced-tags: {doc} principle item {number} has no status tag'

  # ---- the LikeC4 model and views (parse findings; la-arch-check prefixes them with diagrams-fresh)
  c4.undeclared-kind: element {element} has undeclared kind {kind}
  c4.unknown-endpoint: relation {src} -> {dst} has unknown endpoint {endpoint}
  c4.unrecognized-spec-line: 'unrecognized specification line: {line}'
  c4.duplicate-element: duplicate element {element}
  c4.relation-in-body: relation {src} -> {dst} inside element body {parent}
  c4.relation-outside-root: relation {src} -> {dst} outside every language root
  c4.duplicate-relation: duplicate relation {src} -> {dst}
  c4.unrecognized-model-line: 'unrecognized model line: {line}'
  c4.malformed-metadata: 'element {element} has malformed metadata: {line}'
  c4.include-unknown: view include {form} references unknown id {name}
  c4.star-to-star: 'view {view}: ''* -> *'' is not supported'
  c4.malformed-predicate: 'view {view}: malformed predicate'
  c4.unsupported-predicate: 'view {view}: unsupported predicate {src} -> {dst}'
  c4.view-includes-unknown: view {view} includes unknown id {name}
  c4.unexpected-include-token: 'view {view}: unexpected include token {token!r}'
  c4.title-not-string: view {view} title is not a string
  c4.unrecognized-directive: view {view} has unrecognized directive {token!r}
  c4.expected-view: expected `view` in views block
  c4.malformed-view: malformed view declaration
  c4.duplicate-view: duplicate view id {view}
  c4.view-unscoped: view {view} is not scoped to a language root
  c4.view-scope-unknown: view {view} is scoped to {root}, which is not a language root
  c4.view-depth-not-mapping: view_depth must map view ids to positive integers
  c4.view-depth-unknown-view: view_depth references unknown view id {view}
  c4.view-depth-invalid: view_depth[{view}] must be a positive integer, got {value!r}
  c4.legacy-legend: '*Dashed arrows: legacy edges slated to die.*'

  # ---- diagrams: why the index.yaml diagrams block is unusable
  c4.index-missing: index.yaml is missing
  c4.index-not-mapping: index.yaml is not a mapping
  c4.no-diagrams-block: index.yaml has no diagrams block
  c4.diagrams-not-mapping: diagrams block in index.yaml must be a mapping of doc -> view-id list
  diagrams-fresh.parse: 'diagrams-fresh: {finding}'
  diagrams-fresh.unusable: 'diagrams-fresh: {reason}; run la-arch-diagrams'
  diagrams-fresh.bad-key: 'diagrams-fresh: diagrams key {key} must be an architecture/*.arc42.md path'
  diagrams-fresh.not-a-list: 'diagrams-fresh: diagrams[{key}] must be a list of view ids; run la-arch-diagrams'
  diagrams-fresh.empty: 'diagrams-fresh: diagrams[{key}] is empty'
  diagrams-fresh.invalid-view-id: 'diagrams-fresh: diagrams[{key}] has an invalid view id {view!r}'
  diagrams-fresh.duplicate-view-id: 'diagrams-fresh: diagrams[{key}] lists {view} more than once'
  diagrams-fresh.doc-missing: 'diagrams-fresh: mapped doc {doc} does not exist; run la-arch-diagrams'
  diagrams-fresh.view-unknown: 'diagrams-fresh: view {view} mapped to {doc} does not exist in views.c4; run la-arch-diagrams'
  diagrams-fresh.marker-missing: 'diagrams-fresh: {doc} is missing the <!-- likec4:{view} --> marker pair; run la-arch-diagrams'
  diagrams-fresh.marker-duplicate: 'diagrams-fresh: {doc} has duplicate <!-- likec4:{view} --> markers; run la-arch-diagrams'
  diagrams-fresh.marker-order: 'diagrams-fresh: {doc} has the closing {view} marker before the opening one; run la-arch-diagrams'
  diagrams-fresh.stale: 'diagrams-fresh: {doc} diagram {view} is stale; run la-arch-diagrams'
  diagrams-fresh.orphan-marker: 'diagrams-fresh: {doc} has an orphan {kind} likec4:{view} marker; run la-arch-diagrams'

  # ---- la-arch-diagrams
  arch-diagrams.error: 'la-arch-diagrams: {error}'
  arch-diagrams.parse-findings: "cannot regenerate diagrams — resolve model/views findings first:\n{findings}"
  arch-diagrams.bad-key: diagrams key {key!r} must be an architecture/*.arc42.md path
  arch-diagrams.view-undefined: view {view} mapped to {doc} is not defined in views.c4
  arch-diagrams.marker: '{doc}: {problem} marker(s) for view {view}'

  # ---- the LikeC4 layout: one message of the header, every violation in path then file order, and one tail
  c4-layout.header: 'the LikeC4 model must be exactly architecture/model.c4 and the views exactly architecture/views.c4:'
  c4-layout.missing: '  {path}: missing'
  c4-layout.not-a-file: '  {path}: not a file'
  c4-layout.not-utf8: '  {path}: not valid UTF-8'
  c4-layout.stray: '  {path}: stray LikeC4 file holding {blocks}'
  c4-layout.no-blocks: no blocks
  c4-layout.block-missing: '  {path}: no `{block}` block'
  c4-layout.block-duplicate: '  {path}:{line}: second `{block}` block'
  c4-layout.block-not-allowed: '  {path}:{line}: `{block}` block does not belong in this file'
  c4-layout.top-level-text: '  {path}:{line}: unexpected top-level text: {text}'
  c4-layout.unbalanced-braces: '  {path}:{line}: unbalanced braces'
  c4-layout.merge-by-hand: 'merge by hand: one specification and one model block into architecture/model.c4, one views block into architecture/views.c4'

  # ---- la-arch-migrate
  arch-migrate.error: 'la-arch-migrate: {error}'
  arch-migrate.nothing: 'nothing to migrate: this la reads format {current}, which living-architecture.yaml already declares'
  arch-migrate.written: 'wrote {path}'
  arch-migrate.moved: 'moved {source} to {target}'
  arch-migrate.deleted: 'deleted {path}'
  arch-migrate.mismatch: the merged files would not parse to the same model and views; nothing written
  arch-migrate.source-missing: '{source} does not exist; nothing written'
  arch-migrate.source-moved-twice: '{source} would move to both {first} and {second}; nothing written'
  arch-migrate.shared-target: '{first} and {second} would both move to {target}; nothing written'
  arch-migrate.target-taken: '{source} cannot move to {target}, which already exists; nothing written'
  arch-migrate.diagrams-key-taken: '{source} cannot move to {target}: architecture/index.yaml already has the diagrams key {target}; nothing written'
  arch-migrate.no-config: no living-architecture.yaml at the repo root, so there is no format to migrate; run /la:init to onboard this repo
  arch-migrate.unknown-format: cannot migrate from format {declared}, which no la release used; this la reads format {current}
  arch-migrate.stamp-mismatch: 'cannot write the format into living-architecture.yaml; set format: {current} by hand'
  arch-migrate.exempt-by-hand: 'cannot move conventions.exempt in living-architecture.yaml to a top-level exempt key; move it by hand, then run la-arch-migrate again'
  # A failed rollback: `paths` lists, repo-relative in code-point order, every path the restore could not put back.
  arch-migrate.rollback-failed: '{error}; restoring failed, so these paths are left changed: {paths}'

  # ---- la-arch-scaffold
  arch-scaffold.error: 'la-arch-scaffold: {error}'
  arch-scaffold.exists: '{path} already exists'
  arch-scaffold.id-collision: '{language} units {first} and {second} both yield node id {id}'
  arch-scaffold.unquotable-unit: "{language} unit {unit} contains ', which a model string cannot hold"
  arch-scaffold.written: '{path}'
  # The written system.arc42.md: the head, then one generated diagram block per view, then the tail.
  arch-scaffold.arc42-head: |
    # System

    ## Purpose and context

    TODO: what the system is for, who uses it, and what lies outside it.

    ## Building blocks
  arch-scaffold.arc42-tail: |
    ## Principles

    TODO: one numbered item per principle, each with a status tag.

    ## Rationale

    TODO: why the boundaries sit where they do.

  # ---- la-doctor
  doctor.local-source: '{source} + {local}'
  doctor.config-missing: no living-architecture.yaml at the repo root; run /la:init to onboard this repo
  doctor.trmv-missing: 'no trmv-doctor on PATH, so the trmv commands la runs are missing; install la with them: {install}'
  doctor.trmv-mismatch: 'the trmv-doctor on PATH reports {reported}, but la {version} needs {expected}; install la with its trmv: {install}'
  doctor.openspec-absent: 'openspec is true but the repo has no openspec/ directory; run /la:openspec-init or set openspec: false'
  doctor.openspec-present: 'openspec is false but the repo has an openspec/ directory; set openspec: true or remove the directory'
  doctor.architecture-absent: 'architecture is true but the repo has no architecture/index.yaml; run /la:arch-init or set architecture: false'
  doctor.architecture-present: 'architecture is false but the repo has architecture/index.yaml; set architecture: true or remove the file'
  doctor.no-plan-store: 'tracker is none and openspec is false, so no plan survives a session reset; set a tracker or openspec: true'
  doctor.local-tracked: '{file} is tracked by git, but it holds one contributor''s overrides; run git rm --cached {file} and add it to .gitignore'
  doctor.local-not-ignored: '{file} is not git-ignored; add it to .gitignore'
  doctor.local-git-failed: 'git failed, so whether {file} is git-ignored cannot be checked'
  doctor.private-store-missing: 'openspec is true and the repo tracks no openspec/, but the private OpenSpec store {id} is not set up; run /la:openspec-init'
  # ---- stealth configs
  config.local-in-stealth: '{file} is refused in stealth mode, since the stealth config is already per person; delete it'
  config.leaks-not-stealth: '{path}: leaks is accepted only in the stealth config'
  config.leak-not-waivable: '{path}: leaks.allow holds {token!r}, which is not a waivable leak token'

  # ---- la-check-conventions
  conventions.import-after-code: module-level import after non-import code; move it to the top of the file
  conventions.import-in-function: import inside function {function!r}; move it to the top of the file
  conventions.composite-assert: composite `assert ... and ...`; split into separate assert statements
  conventions.raises-single-throw: '`pytest.raises` block makes {calls} calls that can throw; move all but the call under test outside the block'
  conventions.ts-import-after-code: static import after other module-level statements; move it to the top of the file
  conventions.ts-require-not-top: require() call outside module scope; use a top-level import or require
  conventions.ts-composite-assert: composite `expect(... && ...)` or `assert(... && ...)`; split into separate assertions
  conventions.ts-raises-single-throw: '`toThrow`/`rejects` assertion makes {calls} calls that can throw; move all but the call under test outside it'
  conventions.not-utf8: not valid UTF-8
  conventions.violation: '{path}:{line}: [{rule}] {message}'
  conventions.unknown-extension: 'check-conventions: unknown extension, skipped: {path}'
  conventions.facts-stdin-invalid: stdin must be a JSON array of paths
  conventions.exempt: 'check-conventions: exempt, skipped: {paths}'
  conventions.ratio: 'check-conventions: {group} text-only ratio {pct}% ({text}/{total}, cap {cap}%)'
  conventions.ratio-over: '[text-ratio] {group}: text-only lines are {pct}% of the changed {group} files ({text}/{total}), cap {cap}%'
  conventions.ratio-file: '    {path}: {pct}% ({text}/{total})'
  conventions.summary: 'check-conventions: {count} violation(s) across {files} changed {label} file(s)'
  # The files label: each checked language's files_label joined with the separator, or the empty label.
  conventions.label-separator: ' and '
  conventions.empty-label: source
  conventions.error: 'la-check-conventions: {error}'
  conventions.clear: 'gate: CLEAR — conventions hold on the PR''s modified {label} files.'
  conventions.red: |-

    gate: RED —
      [import-not-top] hoist each flagged import to module top. Only a genuine
        circular import may be waived with {waivers} —
        confirm with the user before landing such a waiver.
      [text-ratio] trim comments/docstrings in the flagged file group until
        text-only lines fit under the cap (no per-line waiver).
  # The RED verdict's {waivers}: one example per checked language's comment prefix, joined with the separator.
  conventions.waiver-example: '''{prefix} ALLOW(import-not-top): <reason>'''
  conventions.waiver-separator: ' or '
  # In stealth mode the RED verdict's {waivers} names the waiver ledger instead.
  conventions.waiver-ledger: 'an entry in {path}'
  conventions.ledger-invalid: '{path}: not a valid waiver ledger: {error}'
  conventions.ledger-rule: 'entry {index}: rule {rule!r} is not waivable'

  # ---- la-leak-check and the reply commands
  leaks.error: 'la-leak-check: {error}'
  leaks.not-stealth: 'la-leak-check: not in stealth mode; nothing to check'
  leaks.branch: 'branch: {token}'
  leaks.commit: '{commit}: {token}'
  leaks.path: '{path}: {token}'
  leaks.line: '{path}:{line}: {token}'
  leaks.stdin: 'stdin:{line}: {token}'

  # ---- la-affected-tests
  affected.error: 'la-affected-tests: {error}'
  affected.unrepresentable-path: 'a path that is not UTF-8 or holds a line break cannot be printed one per line: {path!r}'
  affected.request-invalid: 'stdin must be a JSON change list (affected-request schema)'

  # ---- la-count-comments
  count-comments.file: '{total}  comment={comment} doc={doc}  {path}'
  count-comments.total: "==================================================\nTOTAL={total} (comment {comment}, docstring {doc})"
  count-comments.net-added: "==================================================\nNET ADDED total={total} (comment {comment}, docstring {doc})"
  count-comments.unknown-extension: 'count-comments: unknown extension, skipped: {path}'

  # ---- la-typecheck, the deprecated alias of trmv-typecheck
  typecheck-alias.deprecated: 'la-typecheck is deprecated and will be removed in 0.15.0; run trmv-typecheck instead'

  # ---- the twin's documents (la's facts requests)
  twin.facts-invalid: 'the {language} twin ({package} {version}) returned invalid facts; reinstall it with: {install}'
  twin.not-native: '{language} facts are served only by the {language} twin'

  # ---- the PR base (la-check-conventions --pr)
  changes.pr-base-unresolved: could not resolve the base branch of PR {pr}
