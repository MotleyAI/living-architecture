# Per-language facts. `markers` are the repo-root files that, with a file of the language, make it a repo language;
# `executables` are what la-doctor requires on PATH when it is one; `compliance_checks` are its dr-compliance check
# ids; `declaration_globs` and `excluded_dirs` (directory names) are never expanded or checked by dr-*; `local_bin`
# is where the repo installs its checker; `baseline_file` is the checker's committed baseline. `runner` runs a command through the language's twin at `{version}` (the command is
# appended); `install` is the hint shown when that twin is unreachable; `unit_separator` joins a unit's
# segments (`pkg.api`, `src/api`); `imports_non_source` means its imports can reach files of no language (JSON
# modules), so la-affected-tests computes it for a change to such a file. `checker_patch_versions` (python) lists
# the basedpyright versions la-typecheck's pyright#11919 patch is verified for; any other installed version is
# refused. `any_type` and `top_type` spell the language's any type and its safe top type in explicit-any findings.
# Test globs use the contract glob dialect (contract README: matched against the POSIX repo-relative path;
# case-sensitive; `*` stays within one segment; `**` is zero or more whole segments).

python:
  markers: [pyproject.toml, setup.py]
  source_extensions: [.py]
  files_label: .py
  imports_non_source: false
  unit_separator: .
  test_globs:
    - '**/tests/**/*'
    - '**/test/**/*'
    - '**/test_*'
    - '**/*_test.py'
    - '**/conftest.py'
  declaration_globs: []
  excluded_dirs: []
  compliance_checks: [untyped-def, unannotated-attr, explicit-any, mock, rope-walk]
  any_type: Any
  top_type: object
  executables: []
  comment_prefix: '#'
  suppression: '# pyright: ignore[<rule>]'
  local_bin: .venv/bin
  baseline_file: .basedpyright/baseline.json
  checker_patch_versions: ['1.40.2']
  runner: uvx --from living-architecture=={version}
  install: uv tool install living-architecture=={version}

typescript:
  markers: [tsconfig.json]
  source_extensions: [.ts, .tsx, .mts, .cts, .js, .jsx, .mjs, .cjs]
  files_label: TS/JS
  imports_non_source: true
  unit_separator: /
  test_globs:
    - '**/*.test.*'
    - '**/*.spec.*'
    - '**/__tests__/**/*'
    - '**/__mocks__/**/*'
    - '**/tests/**/*'
    - '**/test/**/*'
  declaration_globs: ['**/*.d.ts', '**/*.d.mts', '**/*.d.cts']
  excluded_dirs: [node_modules]
  compliance_checks: [tsconfig, explicit-any, untyped-def, mock]
  any_type: any
  top_type: unknown
  executables: [node, npx]
  comment_prefix: '//'
  suppression: '// @ts-expect-error — <reason>'
  local_bin: node_modules/.bin
  baseline_file: .tsc-baseline.json
  runner: npx -y -p living-architecture@{version}
  install: npm install -g living-architecture@{version}
