      exempt: []
      rules:
      - import-not-top
      - text-ratio
      - composite-assert
      - raises-single-throw
- name: empty mapping
  config: |
    {}
  resolved:
    tracker: linear
    openspec: true
    architecture: false
    reviewers:
      codex: true
      sonar:
        project_key: null
    issue_key_pattern: '[A-Z][A-Z0-9]+-\d+'
    commands:
      test: null
      lint: null
      typecheck:
