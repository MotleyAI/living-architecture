# Default materialization: `config` is the living-architecture.yaml text (null = no file);
# `resolved` is the configuration after schema defaults are filled in.
cases:
- name: missing file
  config: null
  resolved:
    tracker: linear
    openspec: true
    architecture: false
    reviewers:
      codex: true
      sonar:
        project_key: null
    issue_key_pattern: '[A-Z][A-Z0-9]+-\d+'
    commands:
      test: null
      lint: null
      typecheck:
        python: basedpyright
        typescript: tsc --noEmit
    conventions:
      text_ratio_max: 0.15
      exempt: []
      rules:
      - import-not-top
      - text-ratio
      - composite-assert
      - raises-single-throw
- name: empty file
  config: ''
  resolved:
    tracker: linear
    openspec: true
    architecture: false
    reviewers:
      codex: true
      sonar:
        project_key: null
    issue_key_pattern: '[A-Z][A-Z0-9]+-\d+'
    commands:
      test: null
      lint: null
      typecheck:
        python: basedpyright
        typescript: tsc --noEmit
    conventions:
      text_ratio_max: 0.15
      exempt: []
      rules:
      - import-not-top
      - text-ratio
      - composite-assert
      - raises-single-throw
- name: comments only
  config: |
    # nothing yet
  resolved:
    tracker: linear
    openspec: true
    architecture: false
    reviewers:
      codex: true
      sonar:
        project_key: null
    issue_key_pattern: '[A-Z][A-Z0-9]+-\d+'
    commands:
