    conventions:
      text_ratio_max: 0.15
      exempt: []
      rules:
      - import-not-top
      - text-ratio
      - composite-assert
      - raises-single-throw
- name: explicit falsy values are kept
  config: |
    conventions: {exempt: [], rules: []}
    reviewers: {codex: false}
    openspec: false
    commands: {test: ''}
  resolved:
    tracker: linear
    openspec: false
    architecture: false
    reviewers:
      codex: false
      sonar:
        project_key: null
    issue_key_pattern: '[A-Z][A-Z0-9]+-\d+'
    commands:
      test: ''
      lint: null
      typecheck:
        python: basedpyright
        typescript: tsc --noEmit
    conventions:
      text_ratio_max: 0.15
      exempt: []
      rules: []
- name: explicit values are never replaced
  config: |
    tracker: github
    openspec: false
    architecture: true
    reviewers: {codex: false, sonar: {project_key: k}}
    issue_key_pattern: 'X-\d+'
    commands: {test: t, lint: l}
    conventions: {text_ratio_max: 0.5, exempt: ['a/*'], rules: [text-ratio]}
  resolved:
    tracker: github
    openspec: false
    architecture: true
    reviewers:
      codex: false
      sonar:
        project_key: k
    issue_key_pattern: X-\d+
    commands:
      test: t
      lint: l
      typecheck:
        python: basedpyright
        typescript: tsc --noEmit
    conventions:
      text_ratio_max: 0.5
      exempt:
      - a/*
      rules:
      - text-ratio
- name: sibling defaults filled
  config: |
    conventions: {exempt: ['gen/*']}
  resolved:
    tracker: linear
    openspec: true
    architecture: false
    reviewers:
      codex: true
      sonar:
        project_key: null
    issue_key_pattern: '[A-Z][A-Z0-9]+-\d+'
