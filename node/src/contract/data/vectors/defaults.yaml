      - composite-assert
      - raises-single-throw
- name: absent parents are created
  config: |
    reviewers: {sonar: {project_key: k}}
  resolved:
    tracker: linear
    openspec: true
    architecture: false
    reviewers:
      codex: true
      sonar:
        project_key: k
    issue_key_pattern: '[A-Z][A-Z0-9]+-\d+'
    commands:
      test: null
      lint: null
      typecheck:
