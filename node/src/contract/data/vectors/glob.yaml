# The contract glob dialect, matched against a POSIX repo-relative path:
# case-sensitive; `*` matches within one segment (dots are not special);
# `**` as a whole segment matches zero or more segments; every other character is literal.
cases:
- pattern: '*.py'
  path: a.py
  match: true
- pattern: '*.py'
  path: dir/a.py
  match: false
- pattern: '*.py'
  path: .hidden.py
  match: true
- pattern: '*.py'
  path: a.pyc
  match: false
- pattern: '*'
  path: a
  match: true
- pattern: '*'
  path: a/b
  match: false
- pattern: '*'
  path: ''
  match: false
- pattern: '**'
  path: a
  match: true
- pattern: '**'
  path: a/b/c
  match: true
- pattern: '**/*.py'
  path: a.py
  match: true
- pattern: '**/*.py'
  path: a/b/c.py
  match: true
- pattern: '**/*.py'
  path: a/b/c.txt
  match: false
- pattern: '**/tests/**'
  path: tests
  match: true
- pattern: '**/tests/**'
  path: tests/x.py
  match: true
- pattern: '**/tests/**'
  path: a/tests/b/c.py
  match: true
- pattern: '**/tests/**'
  path: a/xtests/b.py
  match: false
- pattern: '**/tests/**'
  path: .venv/tests/x.py
  match: true
- pattern: '**/tests/**/*'
  path: tests
  match: false
- pattern: '**/tests/**/*'
  path: tests/x.py
  match: true
- pattern: '**/tests/**/*'
  path: src/tests
  match: false
- pattern: a/*/c
  path: a/b/c
  match: true
- pattern: a/*/c
  path: a/b/d/c
  match: false
- pattern: a/*/c
  path: a/c
  match: false
- pattern: a/**/c
  path: a/c
  match: true
- pattern: a/**/c
  path: a/b/d/c
  match: true
- pattern: a/**/c
  path: ab/c
  match: false
- pattern: gen/*
  path: gen/x.py
  match: true
- pattern: gen/*
  path: gen/sub/x.py
  match: false
- pattern: gen/**
  path: gen/sub/x.py
  match: true
- pattern: '*.PY'
  path: a.py
  match: false
- pattern: Tests/*
  path: tests/x
  match: false
- pattern: tests/*
  path: Tests/x
  match: false
- pattern: test_*
  path: test_x.py
  match: true
- pattern: test_*
  path: atest_x.py
  match: false
- pattern: test_*
  path: test_
  match: true
- pattern: '**/test_*'
  path: a/b/test_x.py
  match: true
- pattern: '**/test_*'
  path: test_dir/x.py
  match: false
- pattern: '**/*_test.py'
  path: pkg/x_test.py
  match: true
- pattern: '**/*_test.py'
  path: x_test.pyc
  match: false
- pattern: '**/conftest.py'
  path: conftest.py
  match: true
- pattern: '**/conftest.py'
  path: a/conftest.py
  match: true
- pattern: '**/conftest.py'
  path: a/myconftest.py
  match: false
- pattern: a?.py
  path: ab.py
  match: false
- pattern: a?.py
  path: a?.py
  match: true
- pattern: '[ab].py'
  path: a.py
  match: false
- pattern: '[ab].py'
  path: '[ab].py'
  match: true
- pattern: .*
  path: .git
  match: true
- pattern: '**/.cache/**'
  path: x/.cache/y
  match: true
