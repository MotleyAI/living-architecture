# Facts documents (`la-arch-check --language L --emit facts`) checked against schema/facts.schema.json.
# Ordering rules (sorted candidates, top-level units and edges) are the emitter's duty, not the schema's.
accept:
- name: typescript facts
  document:
    language: typescript
    version: 0.2.1
    contract_hash: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    units:
    - {unit: src/cli, status: present}
    - {unit: src/gone, status: missing}
    - {unit: src/util, status: ambiguous, candidates: [src/util.ts, src/util/]}
    top_level_units: [src/cli, src/util]
    edges:
    - {src: typescript.web, dst: typescript.shared, src_module: src/web/a, dst_module: src/shared/b}
- name: python facts
  document:
    language: python
    version: 1.0.0
    contract_hash: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
    units:
    - {unit: pkg.api, status: present}
    - {unit: pkg.api.handlers, status: missing}
    top_level_units: [pkg.api, pkg.core]
    edges:
    - {src: python.api, dst: python.core, src_module: pkg.api.x, dst_module: pkg.core}
    - {src: python.api.handlers, dst: python.core, src_module: pkg.api.handlers, dst_module: pkg.core.y}
- name: empty lists
  document:
    language: typescript
    version: 0.2.1
    contract_hash: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    units: []
    top_level_units: []
    edges: []
- name: three candidates
  document:
    language: typescript
    version: 0.2.1
    contract_hash: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    units:
    - {unit: src/a, status: ambiguous, candidates: [src/a.js, src/a.ts, src/a/]}
    top_level_units: [src/a]
    edges: []
reject:
- name: not an object
  document: []
- name: missing language
