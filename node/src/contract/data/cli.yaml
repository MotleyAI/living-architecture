# Every command's surface. Each twin builds its parser from this file: no abbreviated long options, `--`
# ends options, a usage error exits 2, and a `passthrough` command hands its raw argv to its handler.
#
# option:      name, type (string | int | float | path | flag), help; optional: dest, metavar, choices,
#              default, required, repeatable, store (a flag's stored value; default true), internal
#              (accepted but omitted from help: the twins' own protocol)
# positional:  name, help; optional: nargs ('?' | '*' | '+'; default exactly one)
# command:     help, exit (code -> meaning), options, positionals, subcommands, passthrough, usage,
#              require_one_of (dests; none given is a usage error), script (the bundled review script it
#              runs), native (the languages whose twin implements the command; absent: neutral, every twin runs it)
# la-config get: language_keys are the public `lang.<language>.<key>` keys; source_globs (one `**/*<ext>` glob per
#              source extension) and waiver (the language's waiver comment) are derived, the rest come from
#              languages.yaml.

commands:
  la-config:
    help: Print resolved config values for skills and scripts.
    exit: {0: ok, 1: invalid config, 2: usage error or unknown key}
    options:
      - {name: --root, type: path, help: 'repo root (default: nearest git root of cwd)'}
    subcommands:
      get:
        help: >-
          print one value by dotted key, e.g. reviewers.codex; `languages` prints the repo languages and
          lang.<language>.<key> a language fact
        positionals:
          - {name: key, help: dotted config key}
        language_keys: [source_extensions, source_globs, test_globs, declaration_globs, comment_prefix, suppression,
          waiver, baseline_file, markers]
      show:
        help: print the whole resolved config as JSON

  la-doctor:
    help: Check the installed tools match the plugin and the repo config is valid.
    exit: {0: healthy, 1: problems found, 2: usage error}
    options:
      - {name: --expect, type: string, help: plugin version the calling skill was written for}
      - {name: --plugin, type: path, metavar: DIR,
         help: "directory inside the calling plugin (e.g. a skill's base directory); expect its plugin.json version"}
      - {name: --root, type: path, help: 'repo root (default: nearest git root of cwd)'}
      - {name: --contract-hash, type: flag, help: print the bundled contract hash and exit}
      - {name: --require-config, type: flag, help: 'report a missing living-architecture.yaml (the repo is not onboarded)'}
      - {name: --twin, type: flag, internal: true, help: 'print this twin''s language, version and contract hash'}

  la-arch-check:
    help: 'Living-architecture cross-walk checker: code, LikeC4 model, arc42 docs and specs agree.'
    exit: {0: clean, 1: findings, 2: setup error}
    options:
      - {name: --root, type: path, help: 'repo root (default: nearest git root of cwd)'}
      - {name: --language, type: string, choices: [python, typescript], internal: true,
         help: the language whose facts to emit}
      - {name: --emit, type: string, choices: [facts], internal: true, help: print the language's facts as JSON}
      - {name: --top-level, type: flag, internal: true,
         help: attribute the facts' edges to top-level units; reads no model}

  la-arch-scaffold:
    help: >-
      Write a starter architecture (model, views, system.arc42.md, index additions) from the measured top-level
      units and import edges of every language declared in architecture/index.yaml. Writes everything or
      nothing; prints each written path.
    exit: {0: written, 2: setup error, nothing written}
    options:
      - {name: --root, type: path, help: 'repo root (default: nearest git root of cwd)'}

  la-arch-diagrams:
    help: Generate mermaid diagrams in arc42 docs from the LikeC4 model; prints each rewritten doc.
    exit: {0: ok, 1: cannot regenerate, 2: usage error}
    options:
      - {name: --root, type: path, help: 'repo root (default: nearest git root of cwd)'}

  la-arch-migrate:
    help: >-
      Merge a legacy architecture/model/*.c4 model into architecture/model.c4 (creating an empty
      architecture/views.c4 when absent), verified to parse identically; writes everything or nothing and
      prints each written and deleted path.
    exit: {0: migrated or nothing to migrate, 2: not migratable, verification mismatch or filesystem error}
    options:
      - {name: --root, type: path, help: 'repo root (default: nearest git root of cwd)'}

  la-check-conventions:
    help: >-
      Deterministic convention gate over a PR's changed source files: import-not-top, text-ratio, and (tests)
      composite-assert and raises-single-throw. Waive a flagged line with a trailing ALLOW(<rule>): <reason>
      comment (not for text-ratio).
    exit: {0: clear, 1: violations, 2: usage, config or git error}
    positionals:
      - {name: pr, nargs: '?', help: PR number (resolves the base branch)}
    options:
      - {name: --repo, type: string, help: 'OWNER/REPO for the PR lookup (default: current repo)'}
      - {name: --base, type: string, help: base branch; skips the PR lookup}
      - {name: --file, type: string, dest: files, repeatable: true,
         help: check this repo-relative file instead of the PR diff (repeatable)}
      - {name: --exclude, type: string, metavar: GLOB, repeatable: true,
         help: extra repo-relative glob exempt from all checks (repeatable)}
      - {name: --text-ratio-cap, type: float, help: 'percent cap (default: from config)'}
      - {name: --language, type: string, choices: [python, typescript], internal: true,
         help: the language whose conventions facts to emit}
      - {name: --emit, type: string, choices: [facts], internal: true,
         help: print the facts of the stdin JSON path list as JSON}
    require_one_of: [pr, base, files, emit]

  la-count-comments:
    help: Count comment and doc lines (docstrings, JSDoc) in source files.
    exit: {0: ok, 2: usage error}
    passthrough: true
    usage: |
      la-count-comments FILE...                  per-file + total counts
      la-count-comments --range REF PATH...      net added vs a git ref (working tree)

  la-typecheck:
    help: >-
      Run each applicable language's type checker against its committed baseline, which only ever shrinks.
      A language applies when commands.typecheck sets it, or when the repo has its files and a root marker.
    exit: {0: no errors outside the baseline, 1: new errors, 2: 'usage, config or checker error'}
    options:
      - {name: --write-baseline, type: flag,
         help: write the baseline of each applicable language that has none (once, when adopting the gate)}
      - {name: --language, type: string, choices: [python, typescript], internal: true,
         help: check only this language}

  la-fetch-coderabbit-threads:
    help: Fetch unresolved CodeRabbit review threads on a PR (bundled script).
    exit: {0: ok, 2: usage error}
    passthrough: true
    script: fetch-coderabbit-threads.sh

  la-reply-invalid-coderabbit:
    help: Reply to a CodeRabbit thread, mentioning @coderabbitai (bundled script).
    exit: {0: ok, 2: usage error}
    passthrough: true
    script: reply-invalid-coderabbit.sh

  la-reply-to-pr-thread:
    help: Reply to a PR review thread (bundled script).
    exit: {0: ok, 2: usage error}
    passthrough: true
    script: reply-to-pr-thread.sh

  la-fetch-failed-pr-checks:
    help: Fetch failed CI checks on a PR with their failed-step logs (bundled script).
    exit: {0: ok, 2: usage error}
    passthrough: true
    script: fetch-failed-pr-checks.sh

  la-wait-for-reviews:
    help: Wait until CodeRabbit, Sonar and CI on a PR are terminal (bundled script).
    exit: {0: ok, 1: gate timed out, 2: repo lookup failed, 3: rate limited, 64: usage error}
    passthrough: true
    script: wait-for-reviews.sh

  la-pr-reviewers:
    help: 'Report which review bots ran on a PR, as JSON: CodeRabbit, and Sonar with its project key (bundled script).'
    exit: {0: ok, 2: usage or gh error}
    passthrough: true
    script: pr-reviewers.sh

  dr-refactor:
    native: [python, typescript]
    help: >-
      IDE-grade refactors (Python via rope, TypeScript via its language service): rename, move-symbol,
      move-module. Rewrites every import and reference across the project. Dry-run by default; pass --apply to
      write. Symbol location comes from --offset, --line/--col (1-based, as an editor/LSP reports), or --name
      (first declaration, else first use).
    exit: {0: ok, 1: refactor error, 2: usage error}
    options:
      - {name: --project, type: path, default: ., help: 'project root (default: cwd)'}
      - {name: --apply, type: flag, help: 'write changes (default: dry-run)'}
    subcommands:
      rename:
        help: rename the symbol at a location
        options:
          - {name: --file, type: path, required: true, help: file holding the symbol}
          - {name: --offset, type: int, help: 0-based character offset}
          - {name: --line, type: int, help: 1-based line}
          - {name: --col, type: int, help: 1-based column}
          - {name: --name, type: string, help: first declaration (else use) of this name}
          - {name: --new-name, type: string, required: true, help: the new name}
          - {name: --no-in-hierarchy, type: flag, dest: in_hierarchy, store: false,
             help: 'disable hierarchy rename (on by default: also renames overrides in sub/superclasses; Python only)'}
          - {name: --unsure, type: string, choices: [skip, include], default: skip,
             help: 'occurrences rope cannot resolve: skip (default) or include (risky; Python only)'}
      move-symbol:
        help: move a top-level declaration to another module
        options:
          - {name: --file, type: path, required: true, help: file holding the symbol}
          - {name: --offset, type: int, help: 0-based character offset}
          - {name: --line, type: int, help: 1-based line}
          - {name: --col, type: int, help: 1-based column}
          - {name: --name, type: string, help: first declaration (else use) of this name}
          - {name: --dest, type: path, required: true, help: destination module of the same language (must exist)}
      move-module:
        help: move a module file or directory into a package/dir
        options:
          - {name: --module, type: path, required: true, help: source module file or directory}
          - {name: --dest, type: path, required: true, help: destination package directory (must exist)}

  dr-compliance:
    native: [python, typescript]
    help: >-
      Report constructs that make a rename un-verifiable, with each file's language's checks (Python:
      untyped-def, unannotated-attr, mock; TypeScript: tsconfig, explicit-any, untyped-def, mock). With --attr
      NAME it also reports x.NAME accesses whose receiver is untyped.
    exit: {0: clean, 1: violations, 2: usage error}
    positionals:
      - {name: paths, nargs: '+', help: files or directories}
    options:
      - {name: --select, type: string, help: 'comma-separated checks (default: every check of each file''s language)'}
      - {name: --attr, type: string, help: also report x.ATTR accesses on untyped receivers}

  dr-mock-lint:
    native: [python, typescript]
    help: >-
      Every test double must be bound to the real type: a unittest.mock double to a spec; a Vitest/Jest fn() or
      module factory to a type.
    exit: {0: clean, 1: violations, 2: usage error}
    passthrough: true
    usage: 'dr-mock-lint <path> [<path> ...]'
