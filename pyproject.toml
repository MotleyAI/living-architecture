[project]
name = "deterministic-refactor"
version = "0.1.0"
description = "Rename/move Python code with a deterministically verifiable completeness gate."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "MotleyAI" }]
dependencies = ["rope>=1.13"]

# The verifier. Point it at the target project's interpreter (see README).
[project.optional-dependencies]
verify = ["basedpyright>=1.20"]

[project.scripts]
dr-refactor = "deterministic_refactor.refactor:main"
dr-mock-lint = "deterministic_refactor.mock_spec_lint:main"
dr-compliance = "deterministic_refactor.compliance:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

# This repo dogfoods its own compliance conditions: the verifier runs against
# the project's own venv so imports (rope) resolve.
[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportImplicitOverride = "error"
