[workspace]
resolver = "3"
members = ["binding", "fidelity", "hello"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
ruff_python_parser = "=0.0.22"
ruff_python_ast = "=0.0.22"
ruff_text_size = "=0.0.22"
ruff_source_file = "=0.0.22"
ruff_python_trivia = "=0.0.22"
serde_json = "1"
unicode-ident = "1"
unicode-normalization = "0.1"
rustc-hash = "2"
memchr = "2"
rayon = "1"

[profile.release]
debug = "line-tables-only"
