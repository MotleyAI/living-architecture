[package]
name = "hello"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "dr_hello"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dr-hello-plain"
path = "src/bin/plain.rs"

[dependencies]
pyo3 = { version = "=0.30.1", features = ["abi3-py311"] }

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
