format: 0.13.0
exempt: ['conformance/*']   # fixtures and goldens that break the rules on purpose
tracker: linear
openspec: true
architecture: true
reviewers:
  codex: true
commands:
  test: (cd python/dr && uv run pytest -q) && (cd python/la && uv run pytest -q) && npm --prefix node test
  lint: uv run --project python ruff check python && npm --prefix node run lint
  typecheck:
    python: uv run --project python basedpyright -p python
    typescript: node/node_modules/.bin/tsc -p node --noEmit
