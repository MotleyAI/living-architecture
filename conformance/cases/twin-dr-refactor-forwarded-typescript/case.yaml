kind: neutral
languages:
- python
- typescript
fixture: dr-mixed
golden: manual
twin: python
other_twin: absent
command: dr-refactor
args:
- --project
- ..
- rename
- --file
- src/a.ts
- --name
- foo
- --new-name
- bar
cwd: web
bins:
- dir: npm-twin
  files:
    la-doctor: |
      #!/bin/sh
      [ "$*" = "--twin" ] || { echo "fake la-doctor: unexpected $*" >&2; exit 99; }
      echo "typescript <VERSION> <CONTRACT_HASH>"
    dr-refactor: |
      #!/bin/sh
      echo "npm-twin: dr-refactor pwd=$(pwd) forwarded=$LA_FORWARDED args=$*" >> <ROOT>/repo/probe.log
      echo "fake npm twin: renamed"
expect:
  exit: 0
  files:
  - probe.log
note: 'a TS --file: the PyPI twin hands the raw arguments to the npm twin from the same working directory (LA_FORWARDED=1);
  streams and exit relayed'
