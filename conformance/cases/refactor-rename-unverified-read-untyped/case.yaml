kind: paired
languages:
- python
- typescript
command: dr-refactor
args:
  python: [rename, --file, pkg/m.py, --symbol, Ds.columns, --new-name, fields]
  typescript: [rename, --file, src/m.ts, --symbol, Ds.columns, --new-name, fields]
fixture: refactor-pair
git:
- commit: init
expect:
  exit: 0
golden: manual
note: 'a rewritten source also read through a name on an untyped object: that read is an unverified-read, not a blind spot, and the rename proceeds'
