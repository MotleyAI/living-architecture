kind: neutral
twin: typescript
other_twin: absent
command: la-typecheck
args:
- --language
- python
bins:
- dir: pypi-twin
  files:
    la-doctor: |
      #!/bin/sh
      echo "pypi-twin: la-doctor $*" >> <ROOT>/repo/probe.log
      [ "$*" = "--twin" ] || { echo "fake la-doctor: unexpected $*" >&2; exit 99; }
      echo "python <VERSION> <CONTRACT_HASH>"
    la-typecheck: |
      #!/bin/sh
      echo "pypi-twin: la-typecheck $*" >> <ROOT>/repo/probe.log
      echo "pypi-twin la-typecheck must not run" >&2
      exit 99
- dir: runner
  files:
    uvx: |
      #!/bin/sh
      echo "runner: uvx $*" >> <ROOT>/repo/probe.log
      echo "runner uvx must not run" >&2
      exit 99
expect:
  exit: 2
  files:
  - probe.log
golden: manual
note: the npm twin refuses a Python language request without starting any process
