kind: adapter
languages:
- typescript
command: dr-refactor
args:
- --apply
- rename-map
- renames.yaml
- --keep
- src/use.ts:7
git:
- commit: init
expect:
  exit: 2
  files:
  - src/a.ts
  - src/b.ts
  - src/use.ts
  git_status: true
golden: manual
note: 'an --apply map of a module and a function refused at site resolution: the module is not moved and nothing is written'
