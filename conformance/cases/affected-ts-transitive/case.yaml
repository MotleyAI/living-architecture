kind: adapter
languages:
- typescript
command: la-affected-tests
args:
- --base
- main
git:
- write:
    src/a.ts: |
      import { b } from './b';
      export const a = b;
    src/b.ts: |
      export const b = 1;
    test/a.test.ts: |
      import { a } from '../src/a';
      export const t = a;
    test/c.test.ts: |
      export const c = 1;
- commit: init
- origin:
  - main
- branch: feat
- write:
    src/b.ts: |
      export const b = 2;
- commit: work
expect:
  exit: 0
note: a changed module reaches a test through another module; an unrelated test is absent
golden: manual
