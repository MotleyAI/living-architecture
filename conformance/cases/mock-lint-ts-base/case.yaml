kind: adapter
languages:
- typescript
command: dr-mock-lint
args:
- --base
- main
- tests/a.test.ts
fixture: mock-lint-ts
git:
- write:
    tests/a.test.ts: 'import { vi } from ''vitest'';


      export const f = vi.fn();

      '
- commit: base
- origin:
  - main
- branch: feat
- write:
    tests/a.test.ts: '// a comment

      import { vi } from ''vitest'';


      export const f = vi.fn();

      '
expect:
  exit: 0
golden: manual
note: 'TypeScript --base main: a vi.fn() double untyped at the base and still untyped (moved a line) is not printed'
