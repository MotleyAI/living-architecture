kind: adapter
languages:
- typescript
command: dr-refactor
args:
- rename
- --file
- src/m.ts
- --symbol
- old
- --new-name
- next
git:
- commit: init
expect:
  exit: 0
golden: manual
note: 'a constant renamed onto the name of a type alias the module uses only as a type: separate meanings, no conflict'
