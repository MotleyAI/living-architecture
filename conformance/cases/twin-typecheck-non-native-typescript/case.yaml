kind: neutral
twin: python
other_twin: absent
command: la-typecheck
args:
- --language
- typescript
bins:
- dir: npm-twin
  files:
    la-doctor: |
      #!/bin/sh
      echo "npm-twin: la-doctor $*" >> <ROOT>/repo/probe.log
      [ "$*" = "--twin" ] || { echo "fake la-doctor: unexpected $*" >&2; exit 99; }
      echo "typescript <VERSION> <CONTRACT_HASH>"
    la-typecheck: |
      #!/bin/sh
      echo "npm-twin: la-typecheck $*" >> <ROOT>/repo/probe.log
      echo "npm-twin la-typecheck must not run" >&2
      exit 99
- dir: runner
  files:
    npx: |
      #!/bin/sh
      echo "runner: npx $*" >> <ROOT>/repo/probe.log
      echo "runner npx must not run" >&2
      exit 99
expect:
  exit: 2
  files:
  - probe.log
golden: manual
note: the PyPI twin refuses a TypeScript language request without starting any process
