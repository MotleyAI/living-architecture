kind: adapter
languages:
- python
command: dr-refactor
args: [rename, --file, pkg/use.py, --line, '1', --col, '15', --new-name, server, --keep, pkg/other.py]
git:
- commit: init
expect:
  exit: 0
golden: manual
note: 'a module rename with a whole-file keep where none of its edits or moves lands: a warning before [conflicts], the
  rename goes on'
