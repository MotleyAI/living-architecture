kind: adapter
languages:
- typescript
command: la-count-comments
args:
- src/a.ts
- src/b.ts
- src/c.ts
- gone.ts
expect:
  exit: 0
golden: manual
note: 'TS counts: JSDoc lines are doc, `/**/`, block, line and trailing comments are comment lines (distinct), shebang neither; BOM+CRLF; a missing file counts zero'
