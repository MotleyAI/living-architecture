kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- rename
- --file
- pkg/build.py
- --symbol
- build.<locals>.inner
- --new-name
- helper
git:
- commit: init
expect:
  exit: 0
  files:
  - pkg/__init__.py
  - pkg/build.py
golden: manual
note: '--symbol func.<locals>.inner: the nested function and its call; the module-level inner unchanged'
