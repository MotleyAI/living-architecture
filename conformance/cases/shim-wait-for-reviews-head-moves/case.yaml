kind: neutral
command: la-wait-for-reviews
args:
- '7'
- --repo
- o/r
env:
  LA_WAIT_POLL_SECONDS: '0'
gh:
- match:
  - pr
  - view
  - headRefOid,statusCheckRollup
  responses:
  - stdout:
      headRefOid: abc
      statusCheckRollup:
      - __typename: CheckRun
        name: tests
        status: COMPLETED
        conclusion: SUCCESS
        detailsUrl: https://github.com/o/r/actions/runs/1/job/2
      - __typename: StatusContext
        context: CodeRabbit
        state: SUCCESS
  - stdout:
      headRefOid: def
      statusCheckRollup:
      - __typename: CheckRun
        name: tests
        status: COMPLETED
        conclusion: SUCCESS
        detailsUrl: https://github.com/o/r/actions/runs/1/job/2
      - __typename: StatusContext
        context: CodeRabbit
        state: SUCCESS
- match:
  - repos/o/r/commits/abc/check-suites
  stdout:
    check_suites: []
- match:
  - repos/o/r/commits/def/check-suites
  stdout:
    check_suites: []
- match:
  - repos/o/r/commits/abc/statuses
  stdout: []
- match:
  - repos/o/r/commits/def/statuses
  stdout:
  - context: CodeRabbit
    state: success
    description: Review completed
- match:
  - repos/o/r/issues/7/comments
  stdout:
  - user:
      login: coderabbitai[bot]
    updated_at: '2026-01-02T00:00:00Z'
    body: |-
      <!-- This is an auto-generated comment: summarize by coderabbit.ai -->
      ## Summary
- match:
  - repos/o/r/pulls/7/reviews
  stdout: []
- match:
  - repos/o/r/pulls/7/comments
  stdout: []
expect:
  exit: 0
golden: manual
note: 'HEAD moves after its checks cleared without CodeRabbit evidence: the wait restarts and settles only on evidence for the new HEAD'
