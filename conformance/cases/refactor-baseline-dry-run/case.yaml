kind: adapter
languages:
- python
command: dr-refactor
args:
- rename
- --file
- pkg/store.py
- --symbol
- StorageBackend.get_model
- --new-name
- load
git:
- commit: init
expect:
  exit: 0
  files:
  - .basedpyright/baseline.json
  - pkg/store.py
golden: manual
note: 'dry-run: the baseline''s diff is printed with the source diffs and nothing is written'
