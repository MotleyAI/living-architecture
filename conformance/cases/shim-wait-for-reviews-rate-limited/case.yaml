kind: neutral
command: la-wait-for-reviews
args:
- '7'
- --repo
- o/r
gh:
- match:
  - pr
  - view
  - statusCheckRollup
  stdout:
    statusCheckRollup:
    - __typename: CheckRun
      name: tests
      status: COMPLETED
    - __typename: StatusContext
      context: CodeRabbit
      state: SUCCESS
- match:
  - pr
  - view
  - headRefOid
  stdout:
    headRefOid: abc
- match:
  - repos/o/r/commits/abc
  stdout:
    commit:
      committer:
        date: '2026-01-01T00:00:00Z'
- match:
  - repos/o/r/issues/7/comments
  stdout:
  - user:
      login: coderabbitai[bot]
    updated_at: '2026-01-02T00:00:00Z'
    body: Review limit reached for this PR
expect:
  exit: 3
