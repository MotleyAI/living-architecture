kind: neutral
command: la-arch-migrate
normalize:
- pattern: '(format"?: "?)[0-9]+\.[0-9]+\.[0-9]+'
  replace: \1<FORMAT>
expect:
  exit: 0
  files:
  - living-architecture.yaml
  - architecture/model.c4
  - architecture/views.c4
golden: manual
note: 'architecture/ without index.yaml or any LikeC4 source: no layout to convert,
  the format is stamped'
