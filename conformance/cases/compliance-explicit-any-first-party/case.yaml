kind: adapter
languages:
- python
command: dr-compliance
args:
- --select
- explicit-any
- src/pkg/__init__.py
- src/pkg/compat.py
- src/pkg/a.py
expect:
  exit: 1
golden: manual
note: '`Any` re-exported by first-party modules (named, star through __init__.py, module alias) is reported where used, not in the re-exporting modules'
