kind: neutral
command: la-affected-tests
args:
- --base
- nope
git:
- write:
    src/pkg/__init__.py: ''
    src/pkg/a.py: |
      from pkg import b
    src/pkg/b.py: |
      X = 1
    tests/test_a.py: |
      import pkg.a
    tests/test_c.py: |
      import os
- commit: init
- origin:
  - main
- branch: feat
expect:
  exit: 2
note: 'origin/<BRANCH> cannot be resolved: the shared git error, empty stdout'
golden: manual
