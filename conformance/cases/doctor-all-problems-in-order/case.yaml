kind: neutral
command: la-doctor
args: [--plugin, plugin]
fixture: config-invalid
git:
- write:
    plugin/.claude-plugin/plugin.json: '{"version": "0.0.0"}'
hide:
- gh
normalize:
- version
expect:
  exit: 1
  stdout:
    contains:
    - 'FAIL: installed la tools are'
    - bogus
    - 'FAIL: `gh` not found on PATH'
note: config validation wording is not part of the contract; exit code and offending key are
