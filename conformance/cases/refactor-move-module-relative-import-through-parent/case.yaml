kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- move-module
- --module
- pkg/sub
- --dest
- .
git:
- commit: init
expect:
  exit: 0
  stdout: ignore
  files:
  - sub/__init__.py
  - sub/use.py
golden: manual
note: a moved file's relative import of its own package through the parent is recomputed for the new location
