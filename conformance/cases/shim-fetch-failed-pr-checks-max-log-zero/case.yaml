kind: neutral
command: la-fetch-failed-pr-checks
args:
- '7'
- --repo
- o/r
- --max-log-lines
- '0'
gh:
- match: [pr, view, statusCheckRollup]
  stdout:
    statusCheckRollup:
    - __typename: CheckRun
      name: tests
      workflowName: CI
      conclusion: FAILURE
      status: COMPLETED
      detailsUrl: https://github.com/o/r/actions/runs/11/job/22
normalize:
- pattern: -[0-9]{8}-[0-9]{6}\.json
  replace: -<TS>.json
expect:
  exit: 0
golden: manual
note: with log fetching off, a failed Actions job says so instead of guessing an external CI
