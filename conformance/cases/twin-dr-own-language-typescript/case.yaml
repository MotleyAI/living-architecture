kind: neutral
languages:
- python
- typescript
fixture: dr-mixed
golden: manual
twin: typescript
other_twin: absent
command: dr-mock-lint
args:
- web/a.test.ts
bins:
- dir: pypi-twin
  files:
    la-doctor: |
      #!/bin/sh
      [ "$*" = "--twin" ] || { echo "fake la-doctor: unexpected $*" >&2; exit 99; }
      echo "python <VERSION> <CONTRACT_HASH>"
    dr-mock-lint: |
      #!/bin/sh
      echo "pypi-twin: dr-mock-lint pwd=$(pwd) forwarded=$LA_FORWARDED args=$*" >> <ROOT>/repo/probe.log
      exit 99
expect:
  exit: 1
  files:
  - probe.log
note: 'only TS inputs through the npm twin: the PyPI twin is never probed or run'
