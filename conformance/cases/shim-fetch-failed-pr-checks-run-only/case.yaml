kind: neutral
command: la-fetch-failed-pr-checks
args:
- '7'
- --repo
- o/r
gh:
- match: [pr, view, statusCheckRollup]
  stdout:
    statusCheckRollup:
    - __typename: CheckRun
      name: tests
      workflowName: CI
      conclusion: FAILURE
      status: COMPLETED
      detailsUrl: https://github.com/o/r/actions/runs/11
- match: [run, view, '11', --log-failed]
  stdout: ''
- match: [run, view, '11', --log]
  stdout: ''
normalize:
- pattern: -[0-9]{8}-[0-9]{6}\.json
  replace: -<TS>.json
expect:
  exit: 0
golden: manual
note: a Details URL with a run and no job gets no job-log API attempt
