kind: neutral
command: la-pr-reviewers
args:
- '7'
- --repo
- o/r
gh:
- match:
  - pr
  - view
  - statusCheckRollup
  stdout:
    statusCheckRollup:
    - __typename: CheckRun
      name: tests
      status: COMPLETED
      conclusion: SUCCESS
      detailsUrl: https://github.com/o/r/actions/runs/1/job/2
    - __typename: StatusContext
      context: sonarqube
      state: SUCCESS
      targetUrl: https://sonar.example/dashboard?pullRequest=7&id=ctx_key
- match:
  - repos/o/r/issues/7/comments
  stdout: []
expect:
  exit: 0
  stdout: json
golden: manual
note: a Sonar status context, matched case-insensitively; key from its target URL
