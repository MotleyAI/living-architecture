kind: neutral
command: la-wait-for-reviews
args:
- '7'
- --repo
- o/r
env:
  LA_WAIT_CR_SETTLE: '0'
gh:
- match:
  - pr
  - view
  - headRefOid,statusCheckRollup
  stdout:
    headRefOid: abc
    statusCheckRollup:
    - __typename: CheckRun
      name: tests
      status: COMPLETED
      conclusion: SUCCESS
      detailsUrl: https://github.com/o/r/actions/runs/1/job/2
    - __typename: StatusContext
      context: CodeRabbit
      state: SUCCESS
- match:
  - repos/o/r/commits/abc/check-suites
  stdout:
    check_suites: []
- match:
  - repos/o/r/issues/7/comments
  stdout:
  - user:
      login: coderabbitai[bot]
    updated_at: '2026-01-02T00:00:00Z'
    body: |-
      <!-- This is an auto-generated comment: summarize by coderabbit.ai -->
      Review limit reached
      <!-- final_review_risk_coverage:{"sourceCommitId":"prev","coveredCommitId":"prev","kind":"reviewed"} -->
  - user:
      login: coderabbitai[bot]
    updated_at: '2026-01-03T00:00:00Z'
    body: Sure!
- match:
  - repos/o/r/commits/abc/statuses
  stdout: []
- match:
  - repos/o/r/pulls/7/reviews
  stdout: []
expect:
  exit: 0
golden: manual
note: 'rate-limit text left from an earlier HEAD, a newer reply, no status on HEAD: no exit 3'
