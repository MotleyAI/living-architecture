kind: paired
languages:
- python
- typescript
command: dr-refactor
args:
  python:
  - rename-map
  - renames.yaml
  - --keep
  - pkg/f.py:2
  typescript:
  - rename-map
  - renames.yaml
  - --keep
  - src/f.ts:2
git:
- commit: init
expect:
  exit: 0
  stdout: ignore
golden: manual
note: 'a member renamed onto a name its class declares, with --keep on the renamed declaration''s line: the checks refuse
  nothing for the pair, which is left to the conflicts phase'
