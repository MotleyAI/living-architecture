kind: adapter
languages:
- python
fixture: typecheck-python
command: dr-typecheck
normalize:
- pattern: (?m)^(?=[^\n]*living-architecture\.yaml)(?=[^\n]*\b0\.4\.0\b)(?=[^\n]*\b0\.13\.0\b)(?=[^\n]*la-arch-migrate)[^\n]*$
  replace: <OLDER living-architecture.yaml 0.4.0 0.13.0 la-arch-migrate>
expect:
