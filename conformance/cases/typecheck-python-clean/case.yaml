kind: adapter
languages:
- python
command: la-typecheck
bins:
- dir: path-basedpyright
  position: before
  files:
    basedpyright: |
      #!/bin/sh
      echo "PATH basedpyright must not run" >&2
      exit 99
expect:
  exit: 0
golden: manual
note: repo-local .venv/bin/basedpyright runs (not the PATH one); output passed through
