kind: adapter
languages:
- python
twin: python
fixture: twin-conventions-facts
other_twin: absent
command: la-check-conventions
args:
- --file
- src/a.py
- --file
- web/b.ts
- --file
- web/c.test.ts
bins:
- dir: npm-twin
  files:
    la-doctor: |
      #!/bin/sh
      [ "$*" = "--twin" ] || { echo "fake la-doctor: unexpected $*" >&2; exit 99; }
      echo "typescript <VERSION> <CONTRACT_HASH>"
    la-check-conventions: |
      #!/bin/sh
      case " $* " in *" --language typescript "*) ;; *) echo "fake la-check-conventions: not a typescript facts request: $*" >&2; exit 99 ;; esac
      case " $* " in *" --emit facts "*) ;; *) echo "fake la-check-conventions: not a facts request: $*" >&2; exit 99 ;; esac
      [ "$LA_FORWARDED" = 1 ] || { echo "fake la-check-conventions: LA_FORWARDED is not 1" >&2; exit 99; }
      echo "this is not JSON"
normalize:
- version
expect:
  exit: 2
note: 'conventions facts run exits 0 with invalid JSON: protocol failure, exit 2'
golden: manual
