kind: adapter
languages:
- typescript
twin: typescript
other_twin: absent
bins:
- dir: pypi-twin
  files:
    la-doctor: |
      #!/bin/sh
      echo "pypi-twin: la-doctor $*" >> <ROOT>/repo/probe.log
      [ "$*" = "--twin" ] || { echo "fake la-doctor: unexpected $*" >&2; exit 99; }
      echo "python <VERSION> <CONTRACT_HASH>"
    la-affected-tests: |
      #!/bin/sh
      echo "pypi-twin: la-affected-tests $*" >> <ROOT>/repo/probe.log
      echo "pypi-twin la-affected-tests must not run" >&2
      exit 99
- dir: runner
  files:
    uvx: |
      #!/bin/sh
      echo "runner: uvx $*" >> <ROOT>/repo/probe.log
      exit 99
command: la-affected-tests
args:
- --base
- main
git:
- write:
    src/a.ts: |
      import { b } from './b';
      export const a = b;
    src/b.ts: |
      export const b = 1;
    test/a.test.ts: |
      import { a } from '../src/a';
      export const t = a;
    test/c.test.ts: |
      export const c = 1;
- commit: init
- origin:
  - main
- branch: feat
- write:
    src/b.ts: |
      export const b = 2;
expect:
  exit: 0
  files:
  - probe.log
note: 'only typescript files changed: the typescript twin completes natively and never probes or runs the other twin or its runner'
golden: manual
