kind: adapter
languages:
- python
command: dr-refactor
args:
- rename
- --file
- pkg/m.py
- --symbol
- Ds.columns
- --new-name
- fields
- --docs
- --keep-literal
- version
git:
- commit: init
expect:
  exit: 0
golden: manual
note: '--docs with --keep-literal: a listed mention inside a kept literal is not listed; one in a literal without
  the key is'
