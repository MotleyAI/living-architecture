kind: neutral
command: la-affected-tests
args:
- --base
- main
git:
- write:
    src/pkg/__init__.py: ''
    src/pkg/a.py: |
      from pkg import b
    src/pkg/b.py: |
      X = 1
    tests/test_a.py: |
      import pkg.a
    tests/test_c.py: |
      import os
    src/a.ts: |
      import { b } from './b';
      export const a = b;
    src/b.ts: |
      export const b = 1;
    test/a.test.ts: |
      import { a } from '../src/a';
      export const t = a;
    test/c.test.ts: |
      export const c = 1;
- commit: init
- origin:
  - main
- branch: feat
expect:
  exit: 0
note: 'a branch identical to origin/main with a clean tree: empty stdout, exit 0'
golden: manual
