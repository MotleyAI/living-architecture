kind: adapter
languages:
- python
command: la-affected-tests
args:
- --base
- main
git:
- write:
    src/pkg/__init__.py: ''
    src/pkg/a.py: |
      from pkg import b
    src/pkg/b.py: |
      X = 1
    tests/test_a.py: |
      import pkg.a
    tests/test_c.py: |
      import os
- commit: init
- origin:
  - main
- branch: feat
- write:
    tests/test_new.py: ''
    tests/test_ignored.py: ''
    .gitignore: |
      tests/test_ignored.py
expect:
  exit: 0
note: an untracked test is printed, one matching .gitignore is not
golden: manual
