kind: neutral
command: la-doctor
args: [--plugin, plugin]
git:
- write:
    plugin/.claude-plugin/plugin.json: '{"version": "0.0.1"}'
normalize:
- {pattern: '(reinstall them with: ).*', replace: '\1<INSTALL>'}
- pattern: (this la reads format )[0-9]+\.[0-9]+\.[0-9]+
  replace: \1<FORMAT>
- version
expect:
  exit: 1
golden: manual
note: the plugin version check still runs beside a format refusal
