kind: adapter
languages:
- python
command: la-affected-tests
args:
- --base
- main
git:
- write:
    pkg/__init__.py: ''
    pkg/y.py: ''
    pkg/sub/__init__.py: |
      from . import x
      from .. import y
    pkg/sub/x.py: ''
    tests/test_x.py: |
      import pkg.sub
    tests/test_z.py: |
      import os
- commit: init
- origin:
  - main
- branch: feat
- write:
    pkg/y.py: |
      Y = 1
expect:
  exit: 0
note: '`from .. import y` in a package initializer reaches pkg/y.py'
golden: manual
