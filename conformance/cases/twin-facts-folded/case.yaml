kind: adapter
languages:
- python
twin: python
other_twin: absent
command: la-arch-check
fixture: twin-mixed
bins:
- dir: npm-twin
  files:
    la-doctor: |
      #!/bin/sh
      [ "$*" = "--twin" ] || { echo "fake la-doctor: unexpected $*" >&2; exit 99; }
      echo "typescript <VERSION> <CONTRACT_HASH>"
    la-arch-check: |
      #!/bin/sh
      case " $* " in *" --language typescript "*) ;; *) echo "fake la-arch-check: not a typescript facts request: $*" >&2; exit 99 ;; esac
      case " $* " in *" --emit facts "*) ;; *) echo "fake la-arch-check: not a facts request: $*" >&2; exit 99 ;; esac
      [ "$LA_FORWARDED" = 1 ] || { echo "fake la-arch-check: LA_FORWARDED is not 1" >&2; exit 99; }
      cat <<'EOF'
      {
        "language": "typescript",
        "version": "<VERSION>",
        "contract_hash": "<CONTRACT_HASH>",
        "units": [
          {"unit": "src/web", "status": "present"},
          {"unit": "src/shared", "status": "ambiguous", "candidates": ["src/shared.ts", "src/shared/"]}
        ],
        "top_level_units": ["src/extra", "src/shared", "src/web"],
        "edges": [
          {"src": "typescript.shared", "dst": "typescript.web", "src_module": "src/shared/b", "dst_module": "src/web/a"}
        ]
      }
      EOF
expect:
  exit: 1
golden: manual
note: 'TypeScript facts from the npm twin fold into one report: per-language claims, then the union model-truth'
