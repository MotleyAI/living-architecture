kind: neutral
languages:
- python
- typescript
fixture: dr-mixed
golden: manual
twin: python
other_twin: absent
command: dr-compliance
args:
- src/a.py
- src/b.ts
bins:
- dir: npm-twin
  files:
    la-doctor: |
      #!/bin/sh
      [ "$*" = "--twin" ] || { echo "fake la-doctor: unexpected $*" >&2; exit 99; }
      echo "typescript <VERSION> <CONTRACT_HASH>"
    dr-compliance: |
      #!/bin/sh
      echo "npm-twin: dr-compliance pwd=$(pwd) forwarded=$LA_FORWARDED args=$*" >> <ROOT>/repo/probe.log
      echo "partial"
      echo "fake npm twin: crashed" >&2
      exit 2
expect:
  exit: 2
  files:
  - probe.log
note: 'the other twin fails with exit 2: nothing on stdout (not even the Python block), its stderr relayed, exit 2'
