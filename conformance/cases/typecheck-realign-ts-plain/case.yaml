kind: adapter
languages:
- typescript
command: la-typecheck
args:
- --realign-from
- HEAD
fixture: typecheck-ts-src
git:
- commit: init
expect:
  exit: 0
  files:
  - .tsc-baseline.json
golden: manual
note: 'the flag in a TypeScript-only repo: the plain check, tsc run without it, baseline untouched'
