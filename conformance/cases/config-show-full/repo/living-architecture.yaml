format: <FORMAT>
tracker: github
openspec: false
architecture: true
reviewers:
  codex: false
  sonar: {project_key: acme_widgets}
issue_key_pattern: '#\d+'
commands: {test: 'uv run pytest -q', lint: 'uv run ruff check .'}
exempt: ['gen/*', '*_pb2.py']
conventions: {text_ratio_max: 0.3, rules: [import-not-top, text-ratio]}
