kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- rename
- --file
- pkg/models.py
- --offset
- '80'
- --new-name
- fields
- --without
- pkg/models.py:10
- --without
- pkg/models.py:14
fixture: refactor-typed
git:
- commit: init
expect:
  exit: 0
  files:
  - pkg/models.py
  - pkg/use.py
  - .ropeproject/history.json
golden: manual
note: keys of a field with an alias are unchanged
