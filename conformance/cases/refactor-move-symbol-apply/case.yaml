kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- move-symbol
- --file
- pkg/a.py
- --name
- foo
- --dest
- pkg/sub/__init__.py
git:
- commit: init
expect:
  exit: 0
  files:
  - pkg/a.py
  - pkg/b.py
  - pkg/sub/__init__.py
golden: manual
note: 'new behaviour: rope''s changes print sorted by path (today the order follows the hash seed)'
