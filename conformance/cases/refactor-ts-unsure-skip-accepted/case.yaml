kind: adapter
languages:
- typescript
command: dr-refactor
args:
- rename
- --file
- src/a.ts
- --name
- foo
- --new-name
- bar
- --unsure
- skip
remove:
- src/c.ts
fixture: refactor-ts
git:
- commit: init
expect:
  exit: 0
  files:
  - src/a.ts
golden: manual
note: the default --unsure skip is accepted when given explicitly
