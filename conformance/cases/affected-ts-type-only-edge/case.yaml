kind: adapter
languages:
- typescript
command: la-affected-tests
args:
- --base
- main
git:
- write:
    src/a.ts: |
      import { b } from './b';
      export const a = b;
    src/b.ts: |
      export const b = 1;
    test/a.test.ts: |
      import { a } from '../src/a';
      export const t = a;
    test/c.test.ts: |
      export const c = 1;
    src/types.ts: |
      export type B = 1;
    test/t.test.ts: |
      import type { B } from '../src/types';
      export type T = B;
- commit: init
- origin:
  - main
- branch: feat
- write:
    src/types.ts: |
      export type B = 2;
expect:
  exit: 0
note: an import type counts
golden: manual
