kind: neutral
command: la-fetch-failed-pr-checks
args:
- '7'
- --repo
- o/r
- --check
- https://github.com/o/r/actions/runs/3/job/4
gh:
- match:
  - pr
  - view
  - statusCheckRollup
  stdout:
    statusCheckRollup:
    - __typename: CheckRun
      name: tests
      workflowName: CI
      conclusion: FAILURE
      status: COMPLETED
      detailsUrl: https://github.com/o/r/actions/runs/1/job/2
    - __typename: CheckRun
      name: tests
      workflowName: CI
      conclusion: FAILURE
      status: COMPLETED
      detailsUrl: https://github.com/o/r/actions/runs/3/job/4
- match:
  - run
  - view
  - --job
  - '4'
  - --log-failed
  stdout: 'step: boom

    '
normalize:
- pattern: -[0-9]{8}-[0-9]{6}\.json
  replace: -<TS>.json
expect:
  exit: 0
golden: manual
note: '--check matches the Details URL, so only one of two same-named failed checks is kept and fetched'
