kind: paired
languages:
- python
- typescript
command: dr-refactor
args:
  python: [rename, --file, pkg/a.py, --symbol, foo, --new-name, bar]
  typescript: [rename, --file, src/a.ts, --symbol, foo, --new-name, bar]
git:
- commit: init
chmod:
  living-architecture.yaml: '0000'
expect:
  exit: 2
  stdout: ''
golden: manual
note: 'an unreadable config refuses in checks as one that is not valid YAML does, never a crash'
