kind: adapter
languages:
- python
command: la-affected-tests
args:
- --base
- main
git:
- write:
    src/pkg/__init__.py: ''
    src/pkg/a.py: |
      from pkg import b
    src/pkg/b.py: |
      X = 1
    tests/test_a.py: |
      import pkg.a
    tests/test_c.py: |
      import os
    architecture/index.yaml: |
      python:
        root_package: pkg
        source_root: src
- commit: init
- origin:
  - main
- branch: feat
- write:
    src/pkg/b.py: |
      X = 2
- commit: work
expect:
  exit: 0
note: an architecture index changes nothing (affected-py-transitive has none)
golden: manual
