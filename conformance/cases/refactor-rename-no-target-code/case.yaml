kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- rename
- --file
- pkg/rec.py
- --name
- Rec
- --new-name
- Recommendation
fixture: refactor-typed
git:
- commit: init
expect:
  exit: 0
  files:
  - pkg/models.py
  - pkg/rec.py
  - sitecustomize.py
  - MARKER
  - .ropeproject/history.json
golden: manual
note: a repo-root sitecustomize.py is never imported by the language server's interpreter probe
