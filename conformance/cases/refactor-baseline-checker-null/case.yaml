kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- rename
- --file
- pkg/store.py
- --symbol
- StorageBackend.get_model
- --new-name
- load
git:
- commit: init
expect:
  exit: 0
  files:
  - .basedpyright/baseline.json
  - pkg/store.py
golden: manual
note: 'commands.typecheck.python null: no checker runs, the baseline is untouched and the output equals the rename without
  alignment'
