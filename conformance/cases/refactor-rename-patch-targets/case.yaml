kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- rename
- --file
- pkg/engine.py
- --name
- save_model
- --new-name
- persist_model
fixture: refactor-typed
git:
- commit: init
expect:
  exit: 0
  files:
  - pkg/__init__.py
  - pkg/engine.py
  - tests/test_patch.py
golden: manual
note: dotted patch / mocker.patch / monkeypatch targets resolved statically through modules and an __init__ re-export
