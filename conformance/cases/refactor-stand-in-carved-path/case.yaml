kind: paired
languages:
- python
- typescript
command: dr-refactor
args:
  python:
  - rename
  - --file
  - pkg/c.py
  - --symbol
  - Ds.columns
  - --new-name
  - fields
  - --words
  - words.yaml
  typescript:
  - rename
  - --file
  - pkg/c.ts
  - --symbol
  - Ds.columns
  - --new-name
  - fields
  - --words
  - words.yaml
fixture: refactor-words
git:
- commit: init
expect:
  exit: 1
golden: manual
note: with --words, a stand-in whose declaration a paths carve-out matches is left by default; the one outside the glob is
  reported
