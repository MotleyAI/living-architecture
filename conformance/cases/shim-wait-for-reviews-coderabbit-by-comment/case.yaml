kind: neutral
command: la-wait-for-reviews
args:
- '7'
- --repo
- o/r
gh:
- match:
  - pr
  - view
  - statusCheckRollup
  stdout:
    statusCheckRollup:
    - __typename: CheckRun
      name: tests
      status: COMPLETED
      conclusion: SUCCESS
      detailsUrl: https://github.com/o/r/actions/runs/1/job/2
- match:
  - pr
  - view
  - headRefOid
  stdout:
    headRefOid: abc
- match:
  - repos/o/r/commits/abc
  stdout:
    commit:
      committer:
        date: '2026-01-01T00:00:00Z'
- match:
  - repos/o/r/issues/7/comments
  stdout:
  - user:
      login: coderabbitai[bot]
    updated_at: '2026-01-02T00:00:00Z'
    body: '## Summary'
expect:
  exit: 0
golden: manual
note: a CodeRabbit comment without its status check still runs the settle
