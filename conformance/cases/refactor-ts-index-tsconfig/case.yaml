kind: adapter
languages:
- typescript
command: dr-refactor
args:
- rename
- --file
- src/a.ts
- --name
- foo
- --new-name
- bar
remove:
- tsconfig.json
- src/c.ts
fixture: refactor-ts
git:
- commit: init
expect:
  exit: 0
  files:
  - src/a.ts
  - src/b.ts
golden: manual
note: the project is the tsconfig index.yaml names (there is no tsconfig.json); output equals refactor-ts-rename-dry-run
