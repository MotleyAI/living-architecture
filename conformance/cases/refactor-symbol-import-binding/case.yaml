kind: adapter
languages:
- python
command: dr-refactor
args:
- rename
- --file
- pkg/run.py
- --symbol
- Engine
- --new-name
- Motor
git:
- commit: init
expect:
  exit: 0
  files:
  - pkg/__init__.py
  - pkg/engine.py
  - pkg/run.py
golden: manual
note: '--symbol on an import binding in an importing file: the dry-run equals the one located at the class declaration'
