kind: neutral
command: la-affected-tests
args:
- --base
- main
git:
- write:
    src/pkg/__init__.py: ''
    src/pkg/a.py: |
      from pkg import b
    src/pkg/b.py: |
      X = 1
    tests/test_a.py: |
      import pkg.a
    tests/test_c.py: |
      import os
    config.yaml: |
      a: 1
- commit: init
- origin:
  - main
- branch: feat
- write:
    config.yaml: |
      a: 2
- commit: work
expect:
  exit: 0
note: 'only a YAML file changed in a repo without TypeScript files: no language is computed, empty stdout'
golden: manual
