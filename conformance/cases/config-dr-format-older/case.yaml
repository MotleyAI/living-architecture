kind: neutral
command: dr-config
args:
- show
normalize:
- pattern: (?m)^(?=[^\n]*deterministic-refactor\.yaml)(?=[^\n]*0\.11\.0)(?=[^\n]*0\.13\.0)[^\n]*$
  replace: <FORMAT REFUSED deterministic-refactor.yaml 0.11.0 0.13.0>
expect:
  exit: 2
note: an older dr file format names both formats
golden: manual
