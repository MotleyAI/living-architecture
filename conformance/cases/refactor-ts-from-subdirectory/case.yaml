kind: adapter
languages:
- typescript
command: dr-refactor
args:
- --project
- ..
- rename
- --file
- src/a.ts
- --name
- foo
- --new-name
- bar
cwd: web
git:
- commit: init
expect:
  exit: 0
  files:
  - web/src/a.ts
  - web/src/b.ts
golden: manual
note: paths resolve against the working directory (web) and print relative to --project; through the PyPI twin the forwarded
  run keeps that working directory
