kind: neutral
other_twin: absent
command: la-config
args:
- show
fixture: twin-mixed
bins:
- dir: watch
  files:
    la-doctor: |
      #!/bin/sh
      echo "watch: la-doctor $*" >> <ROOT>/repo/probe.log
      echo "watch la-doctor must not run" >&2
      exit 99
    npx: |
      #!/bin/sh
      echo "watch: npx $*" >> <ROOT>/repo/probe.log
      echo "watch npx must not run" >&2
      exit 99
    uvx: |
      #!/bin/sh
      echo "watch: uvx $*" >> <ROOT>/repo/probe.log
      echo "watch uvx must not run" >&2
      exit 99
expect:
  exit: 0
  files:
  - probe.log
golden: manual
note: la-config show on a mixed repo completes natively in either twin with the other twin unreachable
