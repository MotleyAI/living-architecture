kind: neutral
command: la-fetch-failed-pr-checks
args:
- '7'
- --repo
- o/r
gh:
- match:
  - pr
  - view
  - statusCheckRollup
  stdout:
    statusCheckRollup: []
normalize:
- pattern: -[0-9]{8}-[0-9]{6}\.json
  replace: -<TS>.json
expect:
  exit: 0
golden: manual
note: the review shims are exempt from the format check
