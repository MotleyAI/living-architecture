kind: neutral
languages:
- python
- typescript
command: dr-mock-lint
args:
- --base
- main
- tests/test_a.py
- web/a.test.ts
fixture: dr-mixed
git:
- commit: base
- origin:
  - main
- branch: feat
- write:
    tests/test_a.py: 'from unittest.mock import MagicMock, Mock

      m = Mock()

      n = MagicMock()

      '
    web/a.test.ts: "import { vi } from 'vitest';\n\nexport const f = vi.fn();\n\ninterface Db {\n  q(): number;\n}\nexport\
      \ const db = {} as unknown as Db;\n"
expect:
  exit: 1
golden: manual
note: '--base main over both languages: each block holds only its new findings, the Python block first, identical for both
  invoking twins'
