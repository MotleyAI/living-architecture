kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- rename
- --file
- pkg/engine.py
- --name
- save_model
- --new-name
- persist_model
fixture: refactor-typed
git:
- commit: init
expect:
  exit: 0
  files:
  - pkg/engine.py
  - pkg/use.py
  - tests/test_engine.py
golden: manual
note: members named by string on typed objects (instance, subclass, class object, type()) are renamed, quotes kept; f-strings,
  other names and lookalike callees are not
