kind: neutral
command: la-pr-reviewers
args:
- '7'
- --repo
- o/r
gh:
- match:
  - pr
  - view
  - headRefOid,statusCheckRollup
  stdout:
    headRefOid: abc
    statusCheckRollup:
    - __typename: CheckRun
      name: tests
      status: COMPLETED
      conclusion: SUCCESS
      detailsUrl: https://github.com/o/r/actions/runs/1/job/2
    - __typename: CheckRun
      name: lint
      status: COMPLETED
      conclusion: SUCCESS
      detailsUrl: https://github.com/o/r/actions/runs/1/job/3
- match:
  - repos/o/r/commits/abc/check-suites
  stdout:
    check_suites:
    - app:
        slug: github-actions
      status: completed
- match:
  - repos/o/r/issues/7/comments
  stdout:
  - user:
      login: alice
    updated_at: '2026-01-02T00:00:00Z'
    body: LGTM
expect:
  exit: 0
  stdout: json
golden: manual
note: only GitHub Actions checks and human comments
