kind: adapter
languages:
- python
twin: python
other_twin: absent
command: la-check-conventions
args:
- --file
- src/a.py
- --file
- web/b.ts
- --file
- web/c.test.ts
bins:
- dir: npm-twin
  files:
    la-doctor: |
      #!/bin/sh
      [ "$*" = "--twin" ] || { echo "fake la-doctor: unexpected $*" >&2; exit 99; }
      echo "typescript <VERSION> <CONTRACT_HASH>"
    la-check-conventions: |
      #!/bin/sh
      case " $* " in *" --language typescript "*) ;; *) echo "fake la-check-conventions: not a typescript facts request: $*" >&2; exit 99 ;; esac
      case " $* " in *" --emit facts "*) ;; *) echo "fake la-check-conventions: not a facts request: $*" >&2; exit 99 ;; esac
      [ "$LA_FORWARDED" = 1 ] || { echo "fake la-check-conventions: LA_FORWARDED is not 1" >&2; exit 99; }
      tr -d ' \n' > <ROOT>/repo/stdin.log
      cat <<'EOF'
      {
        "language": "typescript",
        "version": "<VERSION>",
        "contract_hash": "<CONTRACT_HASH>",
        "files": [
          {"path": "web/b.ts", "status": "ok", "detections": [], "text_lines": 0, "total_lines": 4, "comment_lines": 1, "doc_lines": 0},
          {"path": "web/c.test.ts", "status": "ok", "detections": [], "text_lines": 0, "total_lines": 1, "comment_lines": 0, "doc_lines": 0}
        ]
      }
      EOF
      kill -KILL $$
normalize:
- version
expect:
  exit: 2
note: 'conventions facts run killed by a signal after a valid document: protocol failure, exit 2'
golden: manual
