kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- move-symbol
- --file
- pkg/a.py
- --symbol
- f
- --dest
- pkg/b.py
git:
- commit: init
expect:
  exit: 0
  files:
  - pkg/a.py
  - pkg/b.py
note: a source with a byte order mark keeps it; the destination gets none (rope crashed
  on the mark)
golden: manual
