kind: neutral
command: la-check-conventions
args:
- --base
- main
normalize:
- pattern: (?m)^(?=[^\n]*deterministic-refactor\.yaml)(?=[^\n]*living-architecture\.yaml)[^\n]*$
  replace: <BOTH FILES deterministic-refactor.yaml living-architecture.yaml>
expect:
  exit: 2
note: 'both config files: an la command refuses with the same message'
golden: manual
