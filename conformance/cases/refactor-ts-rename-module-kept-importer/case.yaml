kind: adapter
languages:
- typescript
command: dr-refactor
args:
- rename
- --file
- src/api.ts
- --new-name
- client
- --keep
- src/use.ts:1
git:
- commit: init
expect:
  exit: 0
golden: manual
note: 'a line keep on an importer''s specifier: the checks pass, the line stays, every other importer is rewritten'
