kind: neutral
languages:
- python
- typescript
twin: python
command: la-typecheck
fixture: typecheck-ts-src
normalize:
- pattern: \A(?=[^\n]*dr-typecheck)(?=[^\n]*0\.14\.0)[^\n]*
  replace: <DEPRECATED dr-typecheck 0.14.0>
expect:
  exit: 1
note: the forwarded typescript section repeats no deprecation line; it comes before the python header
golden: manual
