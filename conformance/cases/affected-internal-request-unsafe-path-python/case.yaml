kind: neutral
twin: python
stdin: '{"changes": [{"path": "../a.py", "deleted": false}]}'
command: la-affected-tests
args:
- --language
- python
git:
- write:
    src/pkg/__init__.py: ''
    src/pkg/a.py: |
      from pkg import b
    src/pkg/b.py: |
      X = 1
    tests/test_a.py: |
      import pkg.a
    tests/test_c.py: |
      import os
- commit: init
- origin:
  - main
- branch: feat
expect:
  exit: 2
  stderr:
    contains:
    - 'la-affected-tests: '
note: an internal request path that is not repo-relative POSIX is refused
golden: manual
