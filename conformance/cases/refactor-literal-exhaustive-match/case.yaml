kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- rename
- --file
- pkg/kinds.py
- --symbol
- DriftKind['edit_model']
- --new-name
- edit_master
git:
- commit: init
expect:
  exit: 0
  files:
  - pkg/handle.py
  - pkg/kinds.py
golden: manual
note: 'an exhaustive match ending in assert_never: its case is rewritten and no blind spot is reported'
