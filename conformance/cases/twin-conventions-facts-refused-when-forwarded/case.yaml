kind: adapter
languages:
- python
twin: python
other_twin: absent
command: la-check-conventions
args:
- --file
- src/a.py
- --file
- web/b.ts
- --file
- web/c.test.ts
env:
  LA_FORWARDED: '1'
bins:
- dir: npm-twin
  files:
    la-doctor: |
      #!/bin/sh
      echo "npm-twin: la-doctor $*" >> <ROOT>/repo/probe.log
      [ "$*" = "--twin" ] || { echo "fake la-doctor: unexpected $*" >&2; exit 99; }
      echo "typescript <VERSION> <CONTRACT_HASH>"
    la-check-conventions: |
      #!/bin/sh
      echo "npm-twin: la-check-conventions $*" >> <ROOT>/repo/probe.log
      echo "npm-twin la-check-conventions must not run" >&2
      exit 99
- dir: runner
  files:
    npx: |
      #!/bin/sh
      echo "runner: npx $*" >> <ROOT>/repo/probe.log
      echo "runner npx must not run" >&2
      exit 99
expect:
  exit: 2
  files:
  - probe.log
note: 'LA_FORWARDED=1: the PyPI twin refuses to request TS conventions facts and probes nothing'
golden: manual
