kind: neutral
command: la-doctor
args: [--plugin, plugin]
git:
- write:
    plugin/.claude-plugin/plugin.json: '{"version": "<MAJOR>..0"}'
normalize:
- {pattern: '(reinstall them with: ).*', replace: '\1<INSTALL>'}
- {pattern: '(plugin )[0-9]+(\.9+\.0 needs )[0-9]+(\.9+\.x)', replace: '\1<MAJOR>\2<MAJOR>\3'}
- version
expect:
  exit: 1
golden: manual
note: a 400-digit minor differs from the installed one in both twins
