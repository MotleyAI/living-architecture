kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- rename
- --file
- pkg/store.py
- --symbol
- StorageBackend.get_model
- --new-name
- load
bins:
- dir: checker
  position: before
  files:
    fake-checker: |
      #!/bin/sh
      printf '{"outcome": "patched", "version": "1.0.0", "count": 1}' > "$LA_PYRIGHT_PATCH_RESULT"
      calls="$TMPDIR/fake-checker-calls"
      echo x >> "$calls"
      if [ "$(wc -l < "$calls")" -gt 1 ]; then
        echo "fake checker: crashed while realigning" >&2
        exit 2
      fi
      echo '{"generalDiagnostics": [], "summary": {"errorCount": 0}}'
git:
- commit: init
expect:
  exit: 1
  files:
  - .basedpyright/baseline.json
  - pkg/store.py
golden: manual
note: 'the configured checker passes the probe and fails while realigning: baseline-failed naming python with its exit code
  and stderr, exit 1, nothing written'
