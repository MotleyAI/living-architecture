kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- move-symbol
- --file
- pkg/a.py
- --symbol
- Child
- --dest
- pkg/b.py
git:
- commit: init
expect:
  exit: 0
  stdout: ignore
  files:
  - pkg/a.py
  - pkg/b.py
golden: manual
note: the same placement for an aliased import of the moved symbol, whose use becomes the symbol's name
