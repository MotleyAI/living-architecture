kind: neutral
languages:
- python
- typescript
fixture: dr-mixed
golden: manual
twin: typescript
other_twin: absent
command: dr-refactor
args:
- rename
- --file
- src/a.py
- --name
- f
- --new-name
- g
env:
  LA_FORWARDED: '1'
bins:
- dir: pypi-twin
  files:
    la-doctor: |
      #!/bin/sh
      [ "$*" = "--twin" ] || { echo "fake la-doctor: unexpected $*" >&2; exit 99; }
      echo "python <VERSION> <CONTRACT_HASH>"
    dr-refactor: |
      #!/bin/sh
      echo "pypi-twin: dr-refactor pwd=$(pwd) forwarded=$LA_FORWARDED args=$*" >> <ROOT>/repo/probe.log
      exit 99
expect:
  exit: 2
  files:
  - probe.log
note: 'LA_FORWARDED=1: a Python --file is refused by the npm twin without probing'
