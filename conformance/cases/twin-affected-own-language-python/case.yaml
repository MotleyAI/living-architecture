kind: adapter
languages:
- python
twin: python
other_twin: absent
bins:
- dir: npm-twin
  files:
    la-doctor: |
      #!/bin/sh
      echo "npm-twin: la-doctor $*" >> <ROOT>/repo/probe.log
      [ "$*" = "--twin" ] || { echo "fake la-doctor: unexpected $*" >&2; exit 99; }
      echo "typescript <VERSION> <CONTRACT_HASH>"
    la-affected-tests: |
      #!/bin/sh
      echo "npm-twin: la-affected-tests $*" >> <ROOT>/repo/probe.log
      echo "npm-twin la-affected-tests must not run" >&2
      exit 99
- dir: runner
  files:
    npx: |
      #!/bin/sh
      echo "runner: npx $*" >> <ROOT>/repo/probe.log
      exit 99
command: la-affected-tests
args:
- --base
- main
git:
- write:
    src/pkg/__init__.py: ''
    src/pkg/a.py: |
      from pkg import b
    src/pkg/b.py: |
      X = 1
    tests/test_a.py: |
      import pkg.a
    tests/test_c.py: |
      import os
- commit: init
- origin:
  - main
- branch: feat
- write:
    src/pkg/b.py: |
      X = 2
expect:
  exit: 0
  files:
  - probe.log
note: 'only python files changed: the python twin completes natively and never probes or runs the other twin or its runner'
golden: manual
