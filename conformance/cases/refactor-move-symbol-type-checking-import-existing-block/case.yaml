kind: adapter
languages:
- python
command: dr-refactor
args:
- move-symbol
- --file
- pkg/a.py
- --symbol
- f
- --dest
- pkg/b.py
git:
- commit: init
expect:
  exit: 0
note: a TYPE_CHECKING import the moved code needs is added as the last statement of
  the destination's block (rope emptied the source's block and imported T from the
  source)
golden: manual
