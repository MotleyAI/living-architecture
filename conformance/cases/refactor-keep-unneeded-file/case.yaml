kind: paired
languages:
- python
- typescript
command: dr-refactor
args:
  python: [--apply, rename-map, renames.yaml, --keep, lib/shim.py, --keep, lib/compat]
  typescript: [--apply, rename-map, renames.yaml, --keep, lib/shim.ts, --keep, lib/compat]
fixture: refactor-keep
git:
- commit: init
expect:
  exit: 0
golden: manual
note: 'a whole-file keep and a directory keep spelling the old name where no edit lands: one warning each in
  command-line order before [conflicts], the rename is written'
