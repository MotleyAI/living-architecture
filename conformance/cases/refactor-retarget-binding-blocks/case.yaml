kind: adapter
languages:
- python
command: dr-refactor
args:
- retarget
- --file
- pkg/models.py
- --symbol
- AcmeModel
- --target
- Model
git:
- commit: init
expect:
  exit: 0
golden: manual
note: 'the target is imported in the block of each alias import (TYPE_CHECKING with or without future annotations,
  try, a loop, a function after a module-level home import); an earlier enclosing binding counts, one in another block
  or under TYPE_CHECKING for a runtime import does not'
