kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- rename
- --file
- pkg/use.py
- --line
- '1'
- --col
- '17'
- --new-name
- b
git:
- commit: init
expect:
  exit: 1
  git_status: true
golden: manual
note: 'a module renamed onto an existing module of its package: name-conflict naming that module, nothing written'
