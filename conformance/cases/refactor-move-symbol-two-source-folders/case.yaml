kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- move-symbol
- --file
- ns/mod.py
- --symbol
- f
- --dest
- app.py
git:
- commit: init
expect:
  exit: 0
  stdout: ignore
  files:
  - app.py
  - ns/mod.py
  - use.py
golden: manual
note: a file two source folders hold (the root and the namespace directory `ns`) is moved from under both of its
  module names, so `ns.mod.f` is rewritten too
