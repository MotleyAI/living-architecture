kind: adapter
languages:
- python
command: dr-refactor
args:
- rename-map
- renames.yaml
git:
- commit: init
expect:
  exit: 1
  stderr:
    contains:
    - 'tests/test_a.py:2: attr-blindspot: storage.get_model — storage is Unknown, so a rename of .get_model is unverifiable

      tests/test_a.py:3: attr-blindspot: storage.save_model — storage is Unknown, so a rename of .save_model is unverifiable

      '
    - 2 untyped receiver(s) of .
  files:
  - pkg/__init__.py
  - pkg/storage.py
  - pkg/use.py
  - tests/test_a.py
golden: manual
note: 'two member entries each meet one untyped receiver: one refusal listing both blind spots in path, line and column order,
  then one closing line; nothing changes'
