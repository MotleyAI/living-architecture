kind: adapter
languages:
- python
twin: python
other_twin: absent
command: la-count-comments
args:
- a.py
- web/b.ts
bins:
- dir: npm-twin
  files:
    la-doctor: |
      #!/bin/sh
      [ "$*" = "--twin" ] || { echo "fake la-doctor: unexpected $*" >&2; exit 99; }
      echo "typescript <VERSION> <CONTRACT_HASH>"
    la-check-conventions: |
      #!/bin/sh
      case " $* " in *" --language typescript "*) ;; *) echo "fake la-check-conventions: not a typescript facts request: $*" >&2; exit 99 ;; esac
      case " $* " in *" --emit facts "*) ;; *) echo "fake la-check-conventions: not a facts request: $*" >&2; exit 99 ;; esac
      [ "$LA_FORWARDED" = 1 ] || { echo "fake la-check-conventions: LA_FORWARDED is not 1" >&2; exit 99; }
      tr -d ' \n' > <ROOT>/repo/stdin.log
      cat <<'EOF'
      {
        "language": "typescript",
        "version": "<VERSION>",
        "contract_hash": "<CONTRACT_HASH>",
        "files": [
          {"path": "web/b.ts", "status": "ok", "detections": [], "text_lines": 4, "total_lines": 5, "comment_lines": 2, "doc_lines": 3}
        ]
      }
      EOF
expect:
  exit: 0
  files:
  - stdin.log
note: la-count-comments takes TS comment and doc counts from the npm twin's facts
golden: manual
