kind: neutral
command: la-fetch-failed-pr-checks
args:
- '7'
- --repo
- o/r
gh:
- match: [pr, view, statusCheckRollup]
  stdout:
    statusCheckRollup:
    - __typename: CheckRun
      name: tests
      workflowName: CI
      conclusion: FAILURE
      status: COMPLETED
      detailsUrl: https://github.com/o/r/actions/runs/11/job/22
- match: [run, view, --job, '22', --log-failed]
  stdout: ''
- match: [run, view, --job, '22', --log]
  stdout: ''
- match: [api, repos/o/r/actions/jobs/22/logs]
  stdout: "﻿2026-01-01T00:00:01.0000000Z ##[group]Run make test\n\
    2026-01-01T00:00:02.0000000Z FAIL test_x\n\
    2026-01-01T00:00:03.0000000Z ##[error]Process completed with exit code 2.\n"
- match: [api, repos/o/r/actions/jobs/22]
  stdout: ''
  stderr: |
    gh: Server Error (HTTP 500)
  exit: 1
normalize:
- pattern: -[0-9]{8}-[0-9]{6}\.json
  replace: -<TS>.json
expect:
  exit: 0
golden: manual
note: the step metadata call fails; the excerpt comes from the whole job log, its byte order mark dropped
