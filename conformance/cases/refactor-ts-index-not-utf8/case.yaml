kind: adapter
languages:
- typescript
command: dr-refactor
args:
- --apply
- rename
- --file
- src/a.ts
- --name
- foo
- --new-name
- bar
fixture: refactor-ts
git:
- commit: init
expect:
  exit: 1
  files:
  - src/a.ts
golden: manual
note: an index.yaml that is not valid UTF-8 is an error, never a fallback to another tsconfig
