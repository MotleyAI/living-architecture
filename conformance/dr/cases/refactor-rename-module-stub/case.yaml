kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- rename
- --file
- pkg/a.py
- --new-name
- b
- --stub
- '2.0'
fixture: refactor-stub
git:
- commit: init
expect:
  exit: 0
