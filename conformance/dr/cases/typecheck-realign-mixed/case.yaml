kind: neutral
languages:
- python
- typescript
command: dr-typecheck
args:
- --realign-from
- HEAD
fixture: typecheck-realign
git:
- commit: init
- write:
    pkg/m.py: |
      def f(a: int, b: int) -> int:
          return a + b


      def use() -> int:
          return f(int(1), "x") + len(3)


      def other() -> int:
          return 1
expect:
  exit: 0
  files:
  - .basedpyright/baseline.json
  - .tsc-baseline.json
golden: manual
note: 'a mixed repo whose Python baseline needs realigning: identical through either twin (the npm twin passes the flag on with
  the Python section), TypeScript checked without it'
