kind: adapter
languages:
- typescript
command: dr-refactor
args:
- --timings
- rename
- --file
- src/a.ts
- --symbol
- foo
- --new-name
- bar
remove:
- src/c.ts
fixture: refactor-ts
git:
- commit: init
normalize:
- {pattern: '\d+\.\d\ds', replace: '<S>s'}
expect:
  exit: 0
  files:
  - src/a.ts
  - src/b.ts
golden: manual
note: '--timings on a TypeScript rename: its stdout and stderr unchanged, then the phases that ran in list order (no literal- phase) and total'
