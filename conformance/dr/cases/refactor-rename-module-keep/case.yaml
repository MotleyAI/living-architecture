kind: paired
languages:
- python
- typescript
command: dr-refactor
args:
  python:
  - rename
  - --file
  - tests/test_multi_name.py
  - --symbol
  - client
  - --new-name
  - cli2
  - --keep
  - pkg/api/handler.py
  - --keep
  - tests/test_chain.py:1
  typescript:
  - rename
  - --file
  - src/sql/client.ts
  - --new-name
  - cli2
  - --keep
  - src/api/handler.ts
  - --keep
  - test/chain.ts:1
fixture: refactor-references
git:
- commit: init
expect:
  exit: 0
golden: manual
note: '--keep on a module rename: a kept file and a kept line keep the old name, other lines of the file change'
