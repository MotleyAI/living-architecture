kind: adapter
languages:
- python
command: trmv-refactor
args: [--apply, rename, --file, pkg/use.py, --line, '1', --col, '17', --new-name, fresh, --keep, pkg/old]
git:
- commit: init
expect:
  exit: 0
  files:
  - pkg/old/__init__.py
  - pkg/fresh/__init__.py
golden: manual
note: 'a package rename with a directory keep covering the package: not moved, no keep-unneeded warning'
