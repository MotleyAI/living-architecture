kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- move-module
- --module
- ns/mod.py
- --dest
- dst
git:
- commit: init
expect:
  exit: 0
  stdout: ignore
  files:
  - dst/mod.py
  - use.py
golden: manual
note: a use through a namespace parent of a moved module whose import is rewritten adds no second import
