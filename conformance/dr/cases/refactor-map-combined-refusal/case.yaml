kind: adapter
languages:
- python
command: dr-refactor
args:
- rename-map
- renames.yaml
git:
- commit: init
expect:
  exit: 1
  files:
  - pkg/__init__.py
  - pkg/storage.py
  - pkg/use.py
  - tests/test_a.py
golden: manual
note: 'two member entries each meet one untyped receiver: each blind spot once, under its group''s rules line, and a final
  report of the one closing line; nothing changes'
