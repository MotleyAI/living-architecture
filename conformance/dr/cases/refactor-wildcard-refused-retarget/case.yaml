kind: paired
languages:
- python
- typescript
command: dr-refactor
args:
  python:
  - --apply
  - retarget
  - --file
  - pkg/l.py
  - --symbol
  - '*.<locals>.model'
  - --target
  - f
  typescript:
  - --apply
  - retarget
  - --file
  - pkg/l.ts
  - --symbol
  - '*.<locals>.model'
  - --target
  - f
fixture: refactor-words
git:
- commit: init
expect:
  exit: 2
  git_status: true
golden: manual
note: 'retarget --symbol refuses a wildcard path: symbol-wildcard, nothing written'
