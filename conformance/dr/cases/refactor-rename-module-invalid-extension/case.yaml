kind: paired
languages:
- python
- typescript
command: dr-refactor
args:
  python:
  - rename
  - --file
  - pkg/a.py
  - --new-name
  - b.py
  typescript:
  - rename
  - --file
  - src/a.ts
  - --new-name
  - b.ts
fixture: refactor-map-module
git:
- commit: init
expect:
  exit: 1
golden: manual
note: 'a module new name ending in a source extension: cannot-rename at resolution'
