kind: adapter
languages:
- python
command: dr-refactor
args:
- rename-map
- renames.yaml
git:
- commit: init
expect:
  exit: 0
  files:
  - pkg/__init__.py
  - pkg/engine.py
  - pkg/use.py
golden: manual
note: 'a rename entry then a retarget entry: the rename header line, then the retarget header line, then one diff per file;
  dry-run writes nothing'
