kind: neutral
languages:
- python
- typescript
fixture: trmv-mixed
golden: manual
twin: python
other_twin: absent
command: trmv-compliance
args:
- src/a.py
- src/b.ts
bins:
- dir: other-twin
  files:
    trmv-doctor: |
      #!/bin/sh
      echo "typescript <VERSION> <CONTRACT_HASH>"
    trmv-compliance: |
      #!/bin/sh
      exit 0
  nonexec:
  - trmv-compliance
expect:
  exit: 2
note: 'the other twin qualifies but cannot run trmv-compliance: a twin error, exit 2, nothing on stdout'
