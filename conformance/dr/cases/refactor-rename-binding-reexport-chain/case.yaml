kind: adapter
languages:
- typescript
command: dr-refactor
args:
- rename
- --file
- src/a.ts
- --symbol
- old
- --new-name
- next
git:
- commit: init
expect:
  exit: 1
golden: manual
note: 'the renamed name reaches an importer through two `export *` hops; the importer binds next: name-conflict naming its
  binding'
