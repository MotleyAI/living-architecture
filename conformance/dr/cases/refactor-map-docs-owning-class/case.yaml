kind: paired
languages:
- python
- typescript
command: dr-refactor
args:
- --apply
- rename-map
- renames.yaml
- --docs
git:
- commit: init
expect:
  exit: 0
golden: manual
note: 'two entries rename one old name on two classes: every code-marked mention inside a class (its docstring or
  JSDoc, a method''s, a comment in its body, a nested class without the member) takes that class''s new name;
  nothing listed, no map-conflict'
