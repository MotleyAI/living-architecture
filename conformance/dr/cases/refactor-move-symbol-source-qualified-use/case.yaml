kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- move-symbol
- --file
- pkg/a.py
- --symbol
- f
- --dest
- pkg/b.py
git:
- commit: init
expect:
  exit: 0
  stdout: ignore
  files:
  - pkg/a.py
  - pkg/b.py
golden: manual
note: a dotted use of the moved symbol left in the source, through its own module, keeps resolving, the source
  imports the symbol from the destination
