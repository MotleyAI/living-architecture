kind: paired
languages:
- python
- typescript
command: trmv-refactor
args:
  python:
  - rename-map
  - --keep
  - pkg/use.py:6
  - --keep
  - pkg/only_kept.py:6
  - renames.yaml
  typescript:
  - rename-map
  - --keep
  - src/use.ts:5
  - --keep
  - src/only_kept.ts:5
  - renames.yaml
git:
- commit: init
expect:
  exit: 0
golden: manual
note: '--keep on a shadowed use releases its refusal: the line and the alias import it needs stay, the target is
  imported for the other uses, and a file whose only use is kept gains no import, in both languages'
