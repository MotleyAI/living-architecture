kind: adapter
languages:
- python
command: trmv-refactor
args:
- --apply
- move-symbol
- --file
- pkg/a.py
- --symbol
- Child
- --dest
- pkg/b.py
git:
- commit: init
expect:
  exit: 0
  stdout: ignore
  files:
  - pkg/a.py
  - pkg/b.py
golden: manual
note: a destination that imports the moved symbol and uses it while it runs before the default point gets the moved
  code where that import was
