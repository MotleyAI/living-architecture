kind: adapter
languages:
- python
command: trmv-refactor
args:
- --apply
- rename-map
- renames.yaml
- --keep
- pkg/sql
fixture: refactor-map-module-nested
git:
- commit: init
expect:
  exit: 0
  files:
  - main.py
  - pkg/db/__init__.py
  - pkg/sql/__init__.py
  - pkg/sql/client.py
  git_status: true
golden: manual
note: a kept package keeps its own move and the move of a module inside it; no keep-unneeded
