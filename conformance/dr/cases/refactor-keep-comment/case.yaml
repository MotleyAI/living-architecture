kind: paired
languages:
- python
- typescript
command: dr-refactor
args:
  python: [rename-map, renames.yaml, --keep, lib/commented.py:2, --keep, lib/commented.py:3]
  typescript: [rename-map, renames.yaml, --keep, lib/commented.ts:2, --keep, lib/commented.ts:3]
fixture: refactor-keep
git:
- commit: init
expect:
  exit: 2
golden: manual
note: 'without --docs a comment spelling does not count: a line of a multi-line comment and a trailing comment on code
  that spells no old name are refused in checks'
