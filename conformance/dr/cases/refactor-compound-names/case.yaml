kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- rename
- --file
- pkg/model.py
- --symbol
- Model
- --new-name
- Dataset
- --docs
git:
- commit: init
expect:
  exit: 0
  files:
  - pkg/model.py
golden: manual
note: --docs lists declarations whose name holds Model as a word sequence (CamelCase, a plural, snake case, any case); Modelling
  is not listed and nothing is renamed
