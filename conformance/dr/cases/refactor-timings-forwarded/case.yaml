kind: adapter
languages:
- python
twin: typescript
command: trmv-refactor
args:
- --timings
- rename
- --file
- pkg/a.py
- --symbol
- foo
- --new-name
- bar
fixture: refactor-pkg
git:
- commit: init
normalize:
- {pattern: '\d+\.\d\ds', replace: '<S>s'}
expect:
  exit: 0
  files:
  - pkg/a.py
  - pkg/b.py
  - .ropeproject/history.json
golden: manual
note: '--timings through the npm twin on a Python input: only the PyPI twin''s timing lines, once'
