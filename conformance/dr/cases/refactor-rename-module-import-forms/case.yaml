kind: adapter
languages:
- python
command: dr-refactor
args:
- rename
- --file
- pkg/use_from.py
- --symbol
- client
- --new-name
- cli2
git:
- commit: init
expect:
  exit: 0
note: 'module rename over more import forms: relative from-imports, several modules in one import, a non-self alias, multi-line
  parenthesised names, a parenthesised module name'
golden: manual
