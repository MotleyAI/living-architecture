kind: paired
languages:
- python
- typescript
command: dr-refactor
args:
  python: [rename, --file, pkg/m.py, --symbol, Ds.columns, --new-name, fields, --keep, 'pkg/m.py:6']
  typescript: [rename, --file, src/m.ts, --symbol, Ds.columns, --new-name, fields, --keep, 'src/m.ts:5']
fixture: refactor-pair
git:
- commit: init
expect:
  exit: 0
golden: manual
note: 'a source literal on a --keep line is not rewritten, so no read of it is listed'
