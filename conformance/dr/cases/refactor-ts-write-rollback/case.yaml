kind: adapter
languages:
- typescript
command: trmv-refactor
args:
- --apply
- rename
- --file
- src/a.ts
- --symbol
- foo
- --new-name
- bar
chmod:
  src/z: '0555'
git:
- commit: init
expect:
  exit: 1
  stdout: ignore
  files:
  - src/a.ts
  - src/b.ts
  - src/z/c.ts
golden: manual
note: 'TypeScript: the third file''s write fails: the files already written are restored, write-failed, exit 1'
