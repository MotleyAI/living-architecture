kind: neutral
command: dr-doctor
args: [--plugin, <ROOT>/repo/plugin/skills/init]
git:
- write:
    plugin/.claude-plugin/plugin.json: '{"name": "dr", "version": "<VERSION>"}'
    plugin/skills/init/SKILL.md: skill
normalize: [version]
expect:
  exit: 0
golden: manual
note: a healthy dr-only repo with a matching dr plugin; the ok line names dr and deterministic-refactor.yaml
