kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- move-symbol
- --file
- pkg/a.py
- --symbol
- f
- --dest
- pkg/b.py
git:
- commit: init
expect:
  exit: 0
  files:
  - pkg/a.py
  - pkg/b.py
note: moved code and an added import from a CRLF source take the LF destination's
  line endings
