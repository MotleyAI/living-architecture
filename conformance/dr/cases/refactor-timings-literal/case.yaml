kind: adapter
languages:
- python
command: trmv-refactor
args:
- --timings
- --apply
- rename
- --file
- pkg/kinds.py
- --symbol
- DriftKind['edit_model']
- --new-name
- edit_master
git:
- commit: init
normalize:
- {pattern: '\d+\.\d\ds', replace: '<S>s'}
expect:
  exit: 0
  files:
  - pkg/kinds.py
  - pkg/use.py
golden: manual
note: '--timings on a Python Literal member rename with --apply: literal-scan and literal-probe timed, write last, then total'
