kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- move-symbol
- --file
- src1/pkg/a.py
- --symbol
- X
- --dest
- src1/pkg/b.py
git:
- commit: init
expect:
  exit: 1
  files:
  - src1/pkg/a.py
golden: manual
note: a module name two source folders hold is refused before any edit, since an importer may reach either file
