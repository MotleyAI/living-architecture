kind: paired
languages:
- python
- typescript
command: trmv-refactor
args:
  python: [rename-map, renames.yaml, --fail-fast, --keep, lib/shim.py]
  typescript: [rename-map, renames.yaml, --fail-fast, --keep, lib/shim.ts]
fixture: refactor-keep
git:
- commit: init
expect:
  exit: 1
golden: manual
note: 'after a --fail-fast stop there is no site resolution: an unneeded keep prints no warning, and there is no
  [conflicts]'
