kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- rename
- --file
- pkg/kinds.py
- --symbol
- DriftKind['edit_model']
- --new-name
- edit_master
git:
- commit: init
expect:
  exit: 0
  files:
  - pkg/ext.py
  - pkg/kinds.py
golden: manual
note: 'a Literal alias built from DriftKind types an argument: that string is rewritten'
