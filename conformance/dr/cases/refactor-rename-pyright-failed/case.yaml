kind: adapter
languages:
- python
twin: python
command: dr-refactor
args:
- rename
- --file
- pkg/rec.py
- --symbol
- Rec
- --new-name
- Recommendation
fixture: refactor-typed
env:
  NODE_OPTIONS: --require /nonexistent.js
git:
- commit: init
expect:
  exit: 1
  files:
  - pkg/models.py
  - pkg/rec.py
  - .ropeproject/history.json
normalize:
- pattern: "(?s)(its stderr:\\n).*?\\n(  Error: Cannot find module '/nonexistent.js'\\n).*"
  replace: "\\1  <NODE STDERR>\\n\\2  <NODE STDERR>\\n"
golden: manual
note: 'the language server exits at start (dry-run): the finding in checks with its exit code and stderr, nothing written'
