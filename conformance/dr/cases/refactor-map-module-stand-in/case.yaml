kind: paired
languages:
- python
- typescript
command: dr-refactor
args:
  python:
  - rename-map
  - renames.yaml
  - --without
  - pkg/m.py:7
  typescript:
  - rename-map
  - renames.yaml
  - --without
  - src/m.ts:8
git:
- commit: init
expect:
  exit: 0
golden: manual
note: '--without on a map of a module and a method: the stand-in is classified by the method entry, both renamed'
