kind: paired
languages:
- python
- typescript
command: dr-refactor
args: [rename-map, renames.yaml, --docs]
git:
- commit: init
expect:
  exit: 0
golden: manual
note: 'a module-level import that binds the old name and that the run leaves unchanged is an unrenamed declaration:
  the code-marked mention of its file and the form sites of the project are listed, not rewritten'
