kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- move-symbol
- --file
- pkg/a.py
- --symbol
- label
- --dest
- pkg/b.py
git:
- commit: init
expect:
  exit: 1
  files:
  - pkg/a.py
  - pkg/b.py
golden: manual
note: a destination whose declared encoding cannot hold the moved code is refused, nothing written
