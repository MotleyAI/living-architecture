kind: adapter
languages:
- python
command: dr-refactor
args:
- rename
- --file
- pkg/m.py
- --line
- '2'
- --col
- '5'
- --new-name
- fresh
- --keep
- pkg/m.py:3
git:
- commit: init
expect:
  exit: 0
note: '--keep leaves a reference that resolves to nothing afterwards: allowed, the reference unchanged'
