kind: paired
languages:
- python
- typescript
command: dr-refactor
args:
  python: [--apply, rename, --file, pkg/kinds.py, --symbol, "DriftKind['edit_model']", --new-name, edit_master]
  typescript: [--apply, rename, --file, src/kinds.ts, --symbol, "Kind['edit_model']", --new-name, edit_master]
fixture: refactor-pair
git:
- commit: init
expect:
  exit: 1
  git_status: true
golden: manual
note: 'a constant passed to the member type and to another literal type holding the same string: rewriting it breaks the other use, which is the literal-unresolved blind spot; exit 1, nothing written'
