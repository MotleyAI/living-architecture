kind: paired
languages:
- python
- typescript
command: dr-refactor
args:
  python: [--apply, rename-map, renames.yaml, --docs-pick, 'pkg/a.py:1=1']
  typescript: [--apply, rename-map, renames.yaml, --docs-pick, 'src/a.ts:1=1']
fixture: refactor-docs-map
git:
- commit: init
expect:
  exit: 2
  git_status: true
golden: manual
note: 'a pick without --docs is refused in checks, before any reference search'
