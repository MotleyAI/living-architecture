kind: paired
languages:
- python
- typescript
command: dr-refactor
args:
  python: [--apply, rename-map, renames.yaml, --docs, --docs-pick, 'pkg/a.py:2', --docs-pick, 'pkg/a.py:5',
    --docs-pick, 'pkg/a.py:1=3']
  typescript: [--apply, rename-map, renames.yaml, --docs, --docs-pick, 'src/a.ts:2', --docs-pick, 'src/a.ts:3',
    --docs-pick, 'src/a.ts:1=3']
fixture: refactor-docs-map
git:
- commit: init
expect:
  exit: 2
  git_status: true
golden: manual
note: 'picks naming a line without a mention, a line whose mention the owning-class rule already rewrote, and an
  ENTRY the map does not have: pick-unmatched in pick order at site resolution, nothing written'
