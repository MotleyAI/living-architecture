kind: adapter
languages:
- python
command: dr-typecheck
args:
- --realign-from
- HEAD
fixture: typecheck-realign
git:
- commit: init
- write:
    pkg/m.py: |
      def f(a: int, b: int) -> int:
          return a + b


      def use() -> int:
          return f(int(1), "x") + len(3)


      def other() -> int:
          return 1
expect:
  exit: 2
  files:
  - .basedpyright/baseline.json
golden: manual
note: 'the pyright#11919 patch is unverified on the realignment run: the text a check gives, exit 2, no check, baseline untouched'
