kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- rename
- --file
- pkg/mod.py
- --symbol
- Model.columns
- --new-name
- fields
git:
- commit: init
expect:
  exit: 0
  files:
  - pkg/mod.py
  - pkg/use.py
golden: manual
note: every member occurrence kind after astral characters, in CRLF files with a lone
  CR and no final newline
