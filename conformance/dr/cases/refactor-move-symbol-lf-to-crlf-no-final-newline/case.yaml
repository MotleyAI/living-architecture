kind: adapter
languages:
- python
command: trmv-refactor
args:
- --apply
- move-symbol
- --file
- pkg/a.py
- --symbol
- f
- --dest
- pkg/b.py
git:
- commit: init
expect:
  exit: 0
  files:
  - pkg/a.py
  - pkg/b.py
note: moved code and an added import take a CRLF destination's line endings; it keeps
  having no final newline
