kind: adapter
languages:
- python
command: dr-refactor
args:
- rename
- --file
- pkg/m.py
- --symbol
- old
- --new-name
- fresh
- --keep
- pkg/m.py:1
git:
- commit: init
expect:
  exit: 1
golden: manual
note: '--keep leaves the declaration while its reference is rewritten: name-conflict naming the rewritten reference'
