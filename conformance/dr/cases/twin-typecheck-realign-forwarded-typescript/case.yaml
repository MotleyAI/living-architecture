kind: neutral
languages:
- python
- typescript
twin: python
fixture: typecheck-ts-src
other_twin: absent
command: dr-typecheck
args:
- --realign-from
- HEAD
git:
- commit: init
bins:
- dir: npm-twin
  files:
    dr-doctor: |
      #!/bin/sh
      [ "$*" = "--twin" ] || { echo "fake dr-doctor: unexpected $*" >&2; exit 99; }
      echo "typescript <VERSION> <CONTRACT_HASH>"
    dr-typecheck: |
      #!/bin/sh
      [ "$*" = "--language typescript" ] || { echo "fake dr-typecheck: unexpected args: $*" >&2; exit 99; }
      [ "$LA_FORWARDED" = 1 ] || { echo "fake dr-typecheck: LA_FORWARDED is not 1" >&2; exit 99; }
      cat <<'EOF'
      src/a.ts(1,14): error TS2322: Type 'string' is not assignable to type 'number'.
      EOF
      cat >&2 <<'EOF'
      dr-typecheck: typescript: 1 new error(s) not in .tsc-baseline.json (from the fake npm twin)
      EOF
      exit 1
expect:
  exit: 1
golden: manual
note: under --realign-from the PyPI twin runs the TypeScript section in the npm twin without the option
