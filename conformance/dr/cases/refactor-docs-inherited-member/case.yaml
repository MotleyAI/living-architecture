kind: paired
languages:
- python
- typescript
command: dr-refactor
args:
  python: [rename, --file, pkg/base.py, --symbol, Base.field, --new-name, column, --docs, --without, 'pkg/base.py:10']
  typescript: [rename, --file, src/base.ts, --symbol, Base.field, --new-name, column, --docs, --without, 'src/base.ts:9']
git:
- commit: init
expect:
  exit: 0
golden: manual
note: '--docs: a subclass that inherits the renamed member owns its code-marked mention, which is rewritten; a
  class whose lookup lands first on an unchanged declaration has its mention listed'
