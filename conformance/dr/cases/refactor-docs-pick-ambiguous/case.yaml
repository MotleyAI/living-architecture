kind: paired
languages:
- python
- typescript
command: trmv-refactor
args:
  python: [--apply, rename-map, renames.yaml, --docs, --docs-pick, 'pkg/a.py:1', --docs-pick, 'pkg/a.py:16=1',
    --docs-pick, 'pkg/a.py:16=2']
  typescript: [--apply, rename-map, renames.yaml, --docs, --docs-pick, 'src/a.ts:1', --docs-pick, 'src/a.ts:13=1',
    --docs-pick, 'src/a.ts:13=2']
fixture: refactor-docs-map
git:
- commit: init
expect:
  exit: 2
  git_status: true
golden: manual
note: 'a pick without ENTRY on a mention two entries rename differently, and two picks choosing different entries
  for one mention (named by the later pick): pick-ambiguous in pick order at site resolution, nothing written'
