kind: paired
languages:
- python
- typescript
command: trmv-refactor
args:
  python: [--apply, rename, --file, pkg/kinds.py, --symbol, "DriftKind['edit_model']", --new-name, edit_master]
  typescript: [--apply, rename, --file, src/kinds.ts, --symbol, "Kind['edit_model']", --new-name, edit_master]
fixture: literal-routes
git:
- commit: init
expect:
  exit: 1
  git_status: true
golden: manual
note: 'a module constant bound in both branches of an if has no sources: where it is passed to the member type (python: in a file without the string, through a re-export chain) is a literal-unresolved blind spot; exit 1, nothing written'
