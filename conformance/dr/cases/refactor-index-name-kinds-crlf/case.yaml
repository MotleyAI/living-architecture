kind: adapter
languages:
- python
command: dr-refactor
args:
- --apply
- rename
- --file
- pkg/mod.py
- --symbol
- Rec
- --new-name
- Record
git:
- commit: init
expect:
  exit: 0
  files:
  - pkg/__init__.py
  - pkg/mod.py
  - pkg/alias.py
  - pkg/use.py
golden: manual
note: every name occurrence kind after astral characters, in CRLF files with a lone
  CR and no final newline
