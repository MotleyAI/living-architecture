kind: paired
languages:
- python
- typescript
command: trmv-refactor
args:
  python:
  - rename
  - --file
  - pkg/sql/client.py
  - --new-name
  - cli2
  typescript:
  - rename
  - --file
  - src/sql/engine.ts
  - --new-name
  - engine2
fixture: refactor-references
git:
- commit: init
expect:
  exit: 0
golden: manual
note: a rename given the module itself and no locator renames the module, as one located on an import of it does
