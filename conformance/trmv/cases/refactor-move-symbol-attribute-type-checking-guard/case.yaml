kind: adapter
languages:
- python
command: trmv-refactor
args:
- --apply
- move-symbol
- --file
- pkg/a.py
- --symbol
- f
- --dest
- pkg/b.py
git:
- commit: init
expect:
  exit: 1
  files:
  - pkg/a.py
  - pkg/b.py
golden: manual
note: an `if X.TYPE_CHECKING:` guard on anything but `typing` is another guard, so the moved code's import under it is refused
