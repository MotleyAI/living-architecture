kind: adapter
languages:
- python
command: trmv-refactor
args:
- rename
- --file
- pkg/a.py
- --symbol
- old
- --new-name
- next
git:
- commit: init
expect:
  exit: 1
golden: manual
note: 'the renamed name reaches a module through two star imports; that module binds next and reads old: name-conflict naming
  its binding'
