kind: adapter
languages:
- python
command: trmv-refactor
args:
- move-symbol
- --file
- pkg/a.py
- --symbol
- f
- --dest
- pkg/b.py
git:
- commit: init
expect:
  exit: 0
note: a form-feed and a whitespace-only line after the moved body leave with it; the
  moved code follows the destination's docstring (rope put it above)
golden: manual
