kind: neutral
languages:
- python
- typescript
fixture: trmv-mixed
golden: manual
twin: python
other_twin: absent
command: trmv-refactor
args: [--project, .., rename, --file, src/a.ts, --symbol, foo, --new-name, bar]
cwd: web
bins:
- dir: runner
  files:
    npx: |
      #!/bin/sh
      case "$*" in
        "-y -p type-rename-move@<VERSION> trmv-doctor --twin")
          echo "npx $*" >> <ROOT>/repo/probe.log
          echo "typescript <VERSION> <TRMV_CONTRACT_HASH>"
          exit 0 ;;
        "-y -p type-rename-move@<VERSION> trmv-refactor "*)
          [ "$LA_FORWARDED" = 1 ] || { echo "fake npx: LA_FORWARDED is not 1" >&2; exit 99; }
          echo "npx -y -p type-rename-move@<VERSION> trmv-refactor (forwarded)" >> <ROOT>/repo/probe.log
          echo "served by npx"
          exit 0 ;;
      esac
      echo "npx $*" >> <ROOT>/repo/probe.log
      echo "fake npx: unexpected $*" >&2
      exit 99
normalize: [version]
expect:
  exit: 0
  files: [probe.log]
note: 'no npm twin on PATH: the PyPI twin probes and runs the trmv runner, which names the type-rename-move package
  and trmv-doctor'
