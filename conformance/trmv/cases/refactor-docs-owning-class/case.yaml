kind: paired
languages:
- python
- typescript
command: trmv-refactor
args:
  python: [rename, --file, pkg/errors.py, --symbol, A.field, --new-name, column, --docs, --without, 'pkg/errors.py:14']
  typescript: [rename, --file, src/a.ts, --symbol, Table.columns, --new-name, fields, --docs, --without, 'src/a.ts:13']
git:
- commit: init
expect:
  exit: 0
golden: manual
note: '--docs: a code-marked mention inside the renamed class (its docstring or JSDoc, a comment or JSDoc in its
  body) is rewritten; one in another class declaring its own member of that name, left out with --without, is
  listed; a plain word opening a message string is listed'
