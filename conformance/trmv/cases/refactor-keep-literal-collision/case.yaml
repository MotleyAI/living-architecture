kind: adapter
languages:
- python
command: trmv-refactor
args:
- --apply
- rename
- --file
- pkg/m.py
- --symbol
- Ds.columns
- --new-name
- fields
- --keep-literal
- version
git:
- commit: init
expect:
  exit: 0
  files:
  - pkg/n.py
golden: manual
note: 'a kept literal already holding the new name as a key: its edit is dropped before the conflict check, so no
  name-conflict, and the rename is written'
