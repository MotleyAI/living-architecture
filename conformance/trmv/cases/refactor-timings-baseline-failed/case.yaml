kind: adapter
languages:
- python
command: trmv-refactor
args:
- --timings
- --apply
- rename
- --file
- pkg/store.py
- --symbol
- StorageBackend.get_model
- --new-name
- load
git:
- commit: init
normalize:
- {pattern: '\d+\.\d\ds', replace: '<S>s'}
expect:
  exit: 1
  files:
  - .basedpyright/baseline.json
  - pkg/store.py
golden: manual
note: '--timings when the configured checker fails: baseline timed, baseline-failed, exit 1 as without --timings'
