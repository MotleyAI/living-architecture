kind: adapter
languages:
- python
command: trmv-refactor
args:
- move-symbol
- --file
- pkg/a.py
- --symbol
- f
- --dest
- pkg/b.py
git:
- commit: init
expect:
  exit: 0
note: imports inside the source's blocks stay; a TYPE_CHECKING import the moved code
  needs gets a new block after the destination's leading import block (rope emptied
  the source's block)
golden: manual
