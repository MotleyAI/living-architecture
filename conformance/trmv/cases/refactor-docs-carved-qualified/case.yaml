kind: paired
languages:
- python
- typescript
command: trmv-refactor
args:
  python:
  - rename
  - --file
  - pkg/c.py
  - --symbol
  - Ds.columns
  - --new-name
  - fields
  - --docs
  - --words
  - words.yaml
  typescript:
  - rename
  - --file
  - pkg/c.ts
  - --symbol
  - Ds.columns
  - --new-name
  - fields
  - --docs
  - --words
  - words.yaml
fixture: refactor-words
git:
- commit: init
expect:
  exit: 0
golden: manual
note: '--docs --words: a qualified mention under a carved path is rewritten as without --words'
