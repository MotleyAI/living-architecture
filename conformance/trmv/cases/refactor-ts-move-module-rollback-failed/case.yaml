kind: adapter
languages:
- typescript
command: trmv-refactor
args:
- --apply
- move-module
- --module
- src/solo.ts
- --dest
- src/lib
fixture: refactor-ts
bins:
- dir: flaky-git
  position: before
  files:
    git: |
      #!/bin/sh
      # The first `git mv` moves, then fails (its index write, say); every later one fails before moving.
      self=$(dirname "$0")
      real=$(PATH=$(printf '%s' "$PATH" | tr ':' '\n' | grep -vxF "$self" | paste -sd: -) command -v git)
      if [ "$1" = mv ]; then
        [ -e <ROOT>/tmp/moved ] && exit 1
        : > <ROOT>/tmp/moved
        "$real" "$@"
        exit 1
      fi
      exec "$real" "$@"
git:
- commit: init
expect:
  exit: 1
  stdout: ignore
  files:
  - src/solo.ts
  - src/lib/solo.ts
golden: manual
note: a move fails after moving and restoring it fails too; rollback-failed names the path left changed, exit 1
