kind: adapter
languages:
- python
command: trmv-typecheck
fixture: typecheck-stealth
args:
- --base
- main
bins:
- dir: probe
  position: before
  files:
    basedpyright: "#!/bin/sh\nif [ -d .git ]; then echo checkout > <ROOT>/repo/probe-checkout.log; else echo merge-base >\
      \ <ROOT>/repo/probe.log; fi\nself=$(cd \"$(dirname \"$0\")\" && pwd -P)\nIFS=:\nfor d in $PATH; do\n  [ \"$(cd \"$d\"\
      \ 2>/dev/null && pwd -P)\" = \"$self\" ] && continue\n  [ -x \"$d/basedpyright\" ] && exec \"$d/basedpyright\" \"$@\"\
      \ndone\necho \"probe: no basedpyright on PATH\" >&2\nexit 99\n"
git:
- exclude:
  - probe*.log
- common_dir:
    trmv/trmv.yaml: 'format: 0.14.0

      '
- commit: init
- origin:
  - main
- branch: feat
- write:
    pkg/m.py: "def f(a: int) -> int:\n    return a\n\n\ndef use() -> int:\n    return f(\"x\")\n\n\ndef more() -> int:\n \
      \   return f(\"y\")\n"
- commit: work
expect:
  exit: 1
note: 'stealth: an error the merge base lacks is listed, the merge base''s own is not; no realign hint, since --realign-from
  is refused in stealth'
golden: manual
