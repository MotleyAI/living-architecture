kind: adapter
languages:
- python
command: trmv-refactor
args:
- move-symbol
- --file
- pkg/a/m.py
- --symbol
- f
- --dest
- pkg/b/d.py
git:
- commit: init
expect:
  exit: 0
note: a relative import inside the moved code is recomputed for the destination; an
  absolute one is unchanged (rope left .x pointing at pkg.b); the moved code follows
  the destination's docstring (rope put it above)
golden: manual
