kind: paired
languages:
- python
- typescript
command: trmv-refactor
args:
  python:
  - rename
  - --file
  - pkg/a.py
  - --new-name
  - a
  typescript:
  - rename
  - --file
  - src/a.ts
  - --new-name
  - a
fixture: refactor-map-module
git:
- commit: init
expect:
  exit: 0
golden: manual
note: 'a module renamed to its own name: its own file does not take the name, and nothing changes'
