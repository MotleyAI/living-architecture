kind: adapter
languages:
- python
command: trmv-refactor
args:
- rename
- --file
- pkg/mod.py
- --symbol
- Model.columns
- --new-name
- fields
git:
- commit: init
expect:
  exit: 0
golden: manual
note: 'every member occurrence kind of a Pydantic field: a read, a keyword, a dict
  key, getattr, patch.object and a dotted patch target'
