kind: paired
languages:
- python
- typescript
command: trmv-refactor
args:
  python:
  - rename
  - --file
  - pkg/use.py
  - --line
  - 1
  - --col
  - 15
  - --new-name
  - b
  - --keep
  - pkg/a.py
  typescript:
  - rename
  - --file
  - src/a.ts
  - --new-name
  - b
  - --keep
  - src/a.ts
git:
- commit: init
expect:
  exit: 0
golden: manual
note: 'a module rename with --keep on the module file: the checks pass (the keep covers the moved file), the module is not
  moved and its references are'
