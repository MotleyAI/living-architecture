kind: adapter
languages:
- python
command: trmv-refactor
args:
- --apply
- rename
- --file
- pkg/store.py
- --symbol
- StorageBackend.get_model
- --new-name
- load
git:
- commit: init
expect:
  exit: 0
  files:
  - .basedpyright/baseline.json
  - pkg/store.py
golden: manual
note: '--apply: the baselined error after the renamed call shifts by the length difference; the one before it and the other
  line''s are unchanged (diff of the baseline with the sources)'
