kind: paired
languages:
- python
- typescript
command: trmv-refactor
args:
  python:
  - --apply
  - rename
  - --file
  - pkg/use.py
  - --line
  - '1'
  - --col
  - '17'
  - --new-name
  - b
  typescript:
  - --apply
  - rename
  - --file
  - src/a.ts
  - --new-name
  - b
git:
- commit: init
expect:
  exit: 1
  git_status: true
golden: manual
note: 'a module renamed onto an existing module of its package: name-conflict naming that module, nothing written'
