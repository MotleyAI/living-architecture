kind: adapter
languages:
- python
command: trmv-refactor
args:
- --apply
- rename
- --file
- pkg/box.py
- --symbol
- Box.size
- --new-name
- volume
git:
- commit: init
expect:
  exit: 0
  files:
  - pkg/__init__.py
  - pkg/box.py
golden: manual
note: 'a property and its setter are one symbol: both definitions, the setter decorator and the uses'
