kind: adapter
languages:
- typescript
command: trmv-refactor
args:
- --apply
- rename
- --file
- src/old.ts
- --symbol
- Old
- --new-name
- New
git:
- commit: init
expect:
  exit: 0
  files:
  - .tsc-baseline.json
  - src/c.ts
  - src/old.ts
golden: manual
note: 'an unedited file''s baselined TS2322 names the renamed type: the key''s count moves to the message naming New'
