kind: paired
languages:
- python
- typescript
command: trmv-refactor
args:
  python:
  - rename
  - --file
  - pkg/c.py
  - --symbol
  - Ds.columns
  - --new-name
  - fields
  - --docs
  typescript:
  - rename
  - --file
  - pkg/c.ts
  - --symbol
  - Ds.columns
  - --new-name
  - fields
  - --docs
fixture: refactor-words
git:
- commit: init
expect:
  exit: 0
golden: manual
note: 'the same rename with --docs only: every code-marked mention of the declaring file is rewritten'
