kind: adapter
languages:
- python
command: trmv-refactor
args:
- --apply
- move-symbol
- --file
- pkg/a.py
- --symbol
- f
- --dest
- pkg/b.py
git:
- commit: init
expect:
  exit: 1
  files:
  - pkg/a.py
  - pkg/b.py
golden: manual
note: a destination that does not parse is refused before any edit, so the source keeps the symbol
