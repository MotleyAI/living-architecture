kind: neutral
languages:
- python
- typescript
fixture: trmv-mixed
golden: manual
twin: python
other_twin: absent
command: trmv-refactor
args:
- --timings
- rename
- --file
- src/b.ts
- --symbol
- foo
- --new-name
- bar
bins:
- dir: other-twin
  files:
    trmv-doctor: |
      #!/bin/sh
      echo "typescript <VERSION> <CONTRACT_HASH>"
    trmv-refactor: |
      #!/bin/sh
      exit 0
  nonexec:
  - trmv-refactor
normalize:
- {pattern: '\d+\.\d\ds', replace: '<S>s'}
expect:
  exit: 2
note: '--timings when the other twin cannot run trmv-refactor: the twin error, then only total, exit 2'
