kind: paired
languages:
- python
- typescript
command: trmv-refactor
args:
  python:
  - rename
  - --file
  - pkg/a.py
  - --new-name
  - ..
  typescript:
  - rename
  - --file
  - src/a.ts
  - --new-name
  - ..
fixture: refactor-map-module
git:
- commit: init
expect:
  exit: 1
golden: manual
note: 'a module new name of .. : cannot-rename at resolution'
