kind: neutral
languages:
- python
- typescript
fixture: trmv-mixed
golden: manual
twin: typescript
other_twin: absent
command: trmv-mock-lint
args:
- web/a.test.ts
bins:
- dir: pypi-twin
  files:
    trmv-doctor: |
      #!/bin/sh
      [ "$*" = "--twin" ] || { echo "fake trmv-doctor: unexpected $*" >&2; exit 99; }
      echo "python <VERSION> <CONTRACT_HASH>"
    trmv-mock-lint: |
      #!/bin/sh
      echo "pypi-twin: trmv-mock-lint pwd=$(pwd) forwarded=$LA_FORWARDED args=$*" >> <ROOT>/repo/probe.log
      exit 99
expect:
  exit: 1
  files:
  - probe.log
note: 'only TS inputs through the npm twin: the PyPI twin is never probed or run'
