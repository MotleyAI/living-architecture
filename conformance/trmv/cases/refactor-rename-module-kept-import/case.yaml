kind: adapter
languages:
- python
command: trmv-refactor
args:
- rename
- --file
- pkg/use.py
- --line
- '1'
- --col
- '17'
- --new-name
- b
- --keep
- pkg/use.py:1
git:
- commit: init
expect:
  exit: 1
golden: manual
note: '--keep leaves an importer''s import of the renamed module while its use is rewritten: name-conflict naming the rewritten
  use'
