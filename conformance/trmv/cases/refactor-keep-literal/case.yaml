kind: adapter
languages:
- python
command: trmv-refactor
args:
- --apply
- rename-map
- renames.yaml
- --keep-literal
- version
git:
- commit: init
expect:
  exit: 0
  files:
  - pkg/m.py
  - pkg/n.py
golden: manual
note: '--keep-literal KEY: a dict display holding the plain string key is kept whole, literals nested in it
  included, also when bound to a name; a matching literal nested in one that does not match keeps only itself;
  another key, an implicitly concatenated key and a ** unpacking do not match'
