kind: adapter
languages:
- python
command: trmv-refactor
args:
- rename
- --file
- pkg/g.py
- --symbol
- Model
- --new-name
- Dataset
- --docs
- --docs-pick
- pkg/g.py:5
git:
- commit: init
expect:
  exit: 0
golden: manual
note: 'refactor.string_forms with another module-level Model the run leaves unchanged: the form sites are listed,
  not rewritten, and --docs-pick rewrites the one on its line'
