kind: adapter
languages:
- python
command: trmv-typecheck
args:
- --realign-from
- HEAD
fixture: typecheck-realign
git:
- commit: init
- write:
    pkg/m.py: |
      def f(a: int, b: int) -> int:
          return a + b


      def use() -> int:
          return f(int(1), "x") + len(3)


      def other() -> int:
          return 1
expect:
  exit: 0
  files:
  - .basedpyright/baseline.json
golden: manual
note: 'an uncommitted edit earlier on the line shifts two baselined errors by five columns: both entries follow, then the check passes'
