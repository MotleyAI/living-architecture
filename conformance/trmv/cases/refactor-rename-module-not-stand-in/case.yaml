kind: paired
languages:
- python
- typescript
command: trmv-refactor
args:
  python:
  - rename
  - --file
  - tests/test_multi_name.py
  - --symbol
  - client
  - --new-name
  - cli2
  - --with
  - tests/test_chain.py:1
  typescript:
  - rename
  - --file
  - src/sql/client.ts
  - --new-name
  - cli2
  - --with
  - test/chain.ts:1
fixture: refactor-references
git:
- commit: init
expect:
  exit: 2
golden: manual
note: a module rename has no stand-ins, so each --with or --without is refused in checks
