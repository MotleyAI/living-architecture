kind: adapter
languages:
- python
command: trmv-typecheck
args:
- --realign-from
- HEAD
fixture: typecheck-realign
git:
- commit: init
- write:
    pkg/m.py: |
      def f(a: int, b: int) -> int:
          return a + b


      def use() -> int:
          return f(int(1), "x") + len(3)


      def other() -> int:
          return len(1)
expect:
  exit: 1
  files:
  - .basedpyright/baseline.json
golden: manual
note: 'the shifted entries are realigned and written although another line gains a new error, which is reported; no hint under the flag'
