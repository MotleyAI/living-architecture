kind: adapter
languages:
- python
command: trmv-refactor
args:
- --apply
- rename
- --file
- pkg/store.py
- --symbol
- StorageBackend.get_model
- --new-name
- load
bins:
- dir: checker
  position: before
  files:
    fake-checker: '#!/bin/sh

      printf ''{"outcome": "patched", "version": "1.0.0", "count": 1}'' > "$LA_PYRIGHT_PATCH_RESULT"

      echo "fake checker: no project configuration" >&2

      exit 2

      '
git:
- commit: init
expect:
  exit: 1
  git_status: true
golden: manual
note: 'the configured checker exits 2 at the probe: baseline-failed with its exit code and stderr in checks, nothing searched
  or written'
