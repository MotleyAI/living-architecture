kind: adapter
languages:
- typescript
command: trmv-refactor
args:
- rename
- --file
- src/m.ts
- --symbol
- old
- --new-name
- next
git:
- commit: init
expect:
  exit: 1
golden: manual
note: 'a module re-exports `next` through `export *` and declares `old`; an importer takes `next as n` from it: renaming
  `old` to `next` would rebind `n`, name-conflict naming the import'
