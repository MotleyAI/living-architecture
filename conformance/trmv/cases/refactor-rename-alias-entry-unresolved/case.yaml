kind: adapter
languages:
- python
command: trmv-refactor
args:
- rename
- --file
- pkg/compat.py
- --symbol
- AcmeModel
- --new-name
- LegacyModel
git:
- commit: init
expect:
  exit: 0
note: 'an entry on an import alias, with importers the checker cannot resolve (scripts/ is off its search path): the
  one importing through that alias is renamed, the one importing a same-named alias of another module is not'
golden: manual
