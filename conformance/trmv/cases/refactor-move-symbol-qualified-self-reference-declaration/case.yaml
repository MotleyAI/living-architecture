kind: adapter
languages:
- python
command: trmv-refactor
args:
- --apply
- move-symbol
- --file
- pkg/a.py
- --symbol
- f
- --dest
- pkg/b.py
git:
- commit: init
expect:
  exit: 1
  files:
  - pkg/a.py
  - pkg/b.py
golden: manual
note: a dotted self-use evaluated while the declaration is defined (a default) would no longer resolve once the symbol
  has left its module; refused, nothing written
