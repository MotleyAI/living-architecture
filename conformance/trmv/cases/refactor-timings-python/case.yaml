kind: adapter
languages:
- python
command: trmv-refactor
args:
- --timings
- rename
- --file
- pkg/a.py
- --symbol
- foo
- --new-name
- bar
fixture: refactor-pkg
git:
- commit: init
normalize:
- {pattern: '\d+\.\d\ds', replace: '<S>s'}
expect:
  exit: 0
  files:
  - pkg/a.py
  - pkg/b.py
  - .ropeproject/history.json
golden: manual
note: '--timings on a Python rename: its stdout and stderr unchanged, then the phases that ran in list order and total'
