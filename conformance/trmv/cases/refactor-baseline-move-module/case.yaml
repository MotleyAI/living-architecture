kind: adapter
languages:
- python
command: trmv-refactor
args:
- --apply
- move-module
- --module
- pkg/a.py
- --dest
- pkg/sub
git:
- commit: init
expect:
  exit: 0
  files:
  - .basedpyright/baseline.json
  - pkg/a.py
  - pkg/b.py
  - pkg/sub/a.py
golden: manual
note: 'move-module of a file with baseline entries: they are listed under ./pkg/sub/a.py'
