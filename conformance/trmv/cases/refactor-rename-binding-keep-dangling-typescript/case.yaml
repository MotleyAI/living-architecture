kind: adapter
languages:
- typescript
command: trmv-refactor
args:
- rename
- --file
- src/m.ts
- --line
- '2'
- --col
- '9'
- --new-name
- fresh
- --keep
- src/m.ts:3
git:
- commit: init
expect:
  exit: 0
note: '--keep leaves a reference that resolves to nothing afterwards: allowed, the reference unchanged'
