kind: neutral
command: trmv-config
args:
- show
git:
- common_dir:
    living-architecture/living-architecture.yaml: |
      format: <FORMAT>
      architecture: true
expect:
  exit: 1
  stdout: ''
  stderr:
    contains:
    - architecture
    - <ROOT>/repo/.git/living-architecture/living-architecture.yaml
    - 'trmv-config: <ROOT>/repo/.git/living-architecture/living-architecture.yaml: architecture: true is refused in a stealth config, since the model would show in the repo'
note: 'trmv reading la''s stealth config refuses architecture: true too'
golden: manual
