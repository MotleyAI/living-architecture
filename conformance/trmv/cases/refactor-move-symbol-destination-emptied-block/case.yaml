kind: adapter
languages:
- python
command: trmv-refactor
args:
- --apply
- move-symbol
- --file
- pkg/a.py
- --symbol
- f
- --dest
- pkg/b.py
git:
- commit: init
expect:
  exit: 0
  stdout: ignore
  files:
  - pkg/b.py
golden: manual
note: a destination block left empty by removing the import of the moved symbol gets `pass` (block form)
