kind: adapter
languages:
- python
command: trmv-refactor
args:
- rename
- --file
- pkg/k.py
- --symbol
- K.__init__(field)
- --new-name
- column
git:
- commit: init
expect:
  exit: 1
  files:
  - pkg/k.py
golden: manual
note: 'one constructor parameter of a class declaring both __init__ and __new__ with it: the class call keyword, which
  Python passes to both, is an unlinked keyword and the rename refuses'
