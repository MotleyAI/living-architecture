kind: neutral
command: la-config
args:
- show
git:
- common_dir:
    living-architecture/living-architecture.yaml: |
      format: <FORMAT>
      architecture: true
expect:
  exit: 1
  stdout: ''
  stderr:
    contains:
    - architecture
    - <ROOT>/repo/.git/living-architecture/living-architecture.yaml
    - 'la-config: <ROOT>/repo/.git/living-architecture/living-architecture.yaml: architecture: true is refused in a stealth config, since the model would show in the repo'
note: 'a stealth config refuses architecture: true, naming the key and the file'
golden: manual
