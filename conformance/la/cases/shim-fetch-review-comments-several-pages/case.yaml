kind: neutral
command: la-fetch-review-comments
args:
- '7'
- --repo
- o/r
gh:
- match:
  - api
  - user
  stdout:
    login: me
- match:
  - graphql
  - threadId=T_a.py
  - cursor=c1
  stdout:
    data:
      node:
        comments:
          pageInfo:
            hasNextPage: false
            endCursor: null
          nodes:
          - author:
              login: alice
            body: a-2
            url: https://x/a2
            createdAt: '2026-01-02T00:00:00Z'
- match:
  - graphql
  responses:
  - stdout:
      data:
        repository:
          pullRequest:
            reviewThreads:
              pageInfo:
                hasNextPage: true
                endCursor: p1
              nodes:
              - id: T_a.py
                isResolved: false
                isOutdated: false
                path: a.py
                line: 10
                originalLine: 10
                comments:
                  pageInfo:
                    hasNextPage: true
                    endCursor: c1
                  nodes:
                  - author:
                      login: alice
                    body: a-1
                    url: https://x/a1
                    createdAt: '2026-01-01T00:00:00Z'
  - stdout:
      data:
        repository:
          pullRequest:
            reviewThreads:
              pageInfo:
                hasNextPage: false
                endCursor: null
              nodes:
              - id: T_b.py
                isResolved: false
                isOutdated: false
                path: b.py
                line: 10
                originalLine: 10
                comments:
                  pageInfo:
                    hasNextPage: false
                    endCursor: null
                  nodes:
                  - author:
                      login: bob
                    body: b-1
                    url: https://x/b1
                    createdAt: '2026-01-01T00:00:00Z'
- match:
  - repos/o/r/pulls/7/reviews
  stdout: |
    [{"id": 51, "user": {"login": "alice"}, "body": "r-1", "html_url": "https://github.com/o/r/pull/7#pullrequestreview-51", "submitted_at": "2026-01-01T00:00:00Z"}]
    [{"id": 52, "user": {"login": "bob"}, "body": "r-2", "html_url": "https://github.com/o/r/pull/7#pullrequestreview-52", "submitted_at": "2026-01-01T00:00:00Z"}]
- match:
  - repos/o/r/issues/7/comments
  stdout: |
    [{"id": 41, "user": {"login": "alice"}, "body": "c-1", "html_url": "https://github.com/o/r/pull/7#issuecomment-41", "created_at": "2026-01-01T00:00:00Z"}]
    [{"id": 42, "user": {"login": "bob"}, "body": "c-2", "html_url": "https://github.com/o/r/pull/7#issuecomment-42", "created_at": "2026-01-01T00:00:00Z"}]
normalize:
- pattern: -[0-9]{8}-[0-9]{6}\.json
  replace: -<TS>.json
expect:
  exit: 0
golden: manual
note: threads, a thread's comments, reviews and conversation comments each span two pages
