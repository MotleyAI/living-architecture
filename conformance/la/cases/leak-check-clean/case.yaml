kind: neutral
command: la-leak-check
args:
- --base
- main
git:
- common_dir:
    living-architecture/living-architecture.yaml: |
      format: <FORMAT>
      tracker: none
      openspec: false
- write:
    README.md: |
      demo
- commit: init
- origin:
  - main
- branch: feat
- write:
    src/a.py: |
      X = 1
- commit: Add a
expect:
  exit: 0
note: branch name, commit messages and added lines without a token
golden: manual
