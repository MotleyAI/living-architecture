kind: adapter
languages:
- python
command: la-check-conventions
args:
- --base
- main
git:
- common_dir:
    living-architecture/living-architecture.yaml: |
      format: <FORMAT>
      tracker: none
- write:
    src/a.py: |
      def f() -> str:
          return 'x'
- commit: init
- origin:
  - main
- branch: feat
- write:
    src/a.py: |
      def f() -> str:
          import os
          return 'x'
- commit: work
- common_dir:
    living-architecture/waivers.yaml: |
      - {path: src/a.py, rule: import-not-top, line: import os}
expect:
  exit: 2
  stdout: ''
  stderr:
    contains:
    - <ROOT>/repo/.git/living-architecture/waivers.yaml
golden: manual
note: 'stealth: a ledger entry without reason fails the schema: exit 2 naming the ledger'
