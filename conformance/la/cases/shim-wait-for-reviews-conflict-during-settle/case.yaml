kind: neutral
command: la-wait-for-reviews
args:
- '7'
- --repo
- o/r
env:
  LA_WAIT_POLL_SECONDS: '0'
gh:
- match:
  - pr
  - view
  - headRefOid,mergeable,statusCheckRollup
  responses:
  - stdout:
      headRefOid: abcdef0123
      mergeable: MERGEABLE
      statusCheckRollup:
      - __typename: CheckRun
        name: tests
        status: COMPLETED
        conclusion: SUCCESS
        detailsUrl: https://github.com/o/r/actions/runs/1/job/2
      - __typename: StatusContext
        context: CodeRabbit
        state: SUCCESS
  - stdout:
      headRefOid: abcdef0123
      mergeable: CONFLICTING
      statusCheckRollup:
      - __typename: CheckRun
        name: tests
        status: COMPLETED
        conclusion: SUCCESS
        detailsUrl: https://github.com/o/r/actions/runs/1/job/2
      - __typename: StatusContext
        context: CodeRabbit
        state: SUCCESS
- match:
  - api
  - user
  stdout:
    login: me
- match:
  - repos/o/r/commits/abcdef0123/check-suites
  stdout:
    check_suites: []
- match:
  - repos/o/r/commits/abcdef0123/statuses
  stdout: []
- match:
  - repos/o/r/issues/7/comments
  stdout: []
- match:
  - repos/o/r/pulls/7/reviews
  stdout: []
- match:
  - repos/o/r/pulls/7/comments
  stdout: []
expect:
  exit: 4
  stderr: ignore
golden: manual
note: the gate is clear and CodeRabbit has no evidence for HEAD; the second poll sees the conflict
