kind: neutral
twin: python
command: la-doctor
bins:
- dir: dr
  position: before
  files:
    dr-doctor: |
      #!/bin/sh
      echo "dr-doctor $*" >> <ROOT>/repo/probe.log
      [ "$*" = "--twin" ] || { echo "fake dr-doctor: unexpected $*" >&2; exit 99; }
      echo "python <VERSION> <DR_CONTRACT_HASH>"
normalize: [version]
expect:
  exit: 0
  files: [probe.log]
golden: manual
note: the first dr-doctor on PATH reports the invoking language, la's version and la's dr hash, so no dr finding
