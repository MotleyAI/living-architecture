kind: neutral
command: la-fetch-review-comments
args:
- '7'
- --repo
- o/r
gh:
- match:
  - api
  - user
  stdout:
    login: me
- match:
  - graphql
  stdout:
    data:
      repository:
        pullRequest:
          reviewThreads:
            pageInfo:
              hasNextPage: false
              endCursor: null
            nodes:
            - id: T_a.py
              isResolved: false
              isOutdated: false
              path: a.py
              line: 10
              originalLine: 10
              comments:
                pageInfo:
                  hasNextPage: false
                  endCursor: null
                nodes:
                - author:
                    login: alice
                  body: Rename this
                  url: https://x/a
                  createdAt: '2026-01-01T00:00:00Z'
            - id: T_b.py
              isResolved: true
              isOutdated: false
              path: b.py
              line: 10
              originalLine: 10
              comments:
                pageInfo:
                  hasNextPage: false
                  endCursor: null
                nodes:
                - author:
                    login: bob
                  body: Old news
                  url: https://x/b
                  createdAt: '2026-01-01T00:00:00Z'
            - id: T_c.py
              isResolved: false
              isOutdated: false
              path: c.py
              line: 10
              originalLine: 10
              comments:
                pageInfo:
                  hasNextPage: false
                  endCursor: null
                nodes:
                - author:
                    login: me
                  body: Note to self
                  url: https://x/c
                  createdAt: '2026-01-01T00:00:00Z'
- match:
  - repos/o/r/pulls/7/reviews
  stdout:
  - id: 51
    user:
      login: copilot-pull-request-reviewer[bot]
    body: Consider X
    html_url: https://github.com/o/r/pull/7#pullrequestreview-51
    submitted_at: '2026-01-01T00:00:00Z'
  - id: 52
    user:
      login: coderabbitai[bot]
    body: '**Actionable comments posted: 0**'
    html_url: https://github.com/o/r/pull/7#pullrequestreview-52
    submitted_at: '2026-01-01T00:00:00Z'
  - id: 53
    user:
      login: me
    body: My own review
    html_url: https://github.com/o/r/pull/7#pullrequestreview-53
    submitted_at: '2026-01-01T00:00:00Z'
  - id: 54
    user:
      login: dave
    body: " \n"
    html_url: https://github.com/o/r/pull/7#pullrequestreview-54
    submitted_at: '2026-01-01T00:00:00Z'
- match:
  - repos/o/r/issues/7/comments
  stdout:
  - id: 41
    user:
      login: bob
    body: Why this?
    html_url: https://github.com/o/r/pull/7#issuecomment-41
    created_at: '2026-01-01T00:00:00Z'
  - id: 42
    user:
      login: sonarqubecloud[bot]
    body: Quality Gate passed
    html_url: https://github.com/o/r/pull/7#issuecomment-42
    created_at: '2026-01-01T00:00:00Z'
  - id: 43
    user:
      login: me
    body: Pushed a fix
    html_url: https://github.com/o/r/pull/7#issuecomment-43
    created_at: '2026-01-01T00:00:00Z'
normalize:
- pattern: -[0-9]{8}-[0-9]{6}\.json
  replace: -<TS>.json
expect:
  exit: 0
golden: manual
note: every author but the logged-in user; CodeRabbit's review body and whitespace-only bodies are left out
