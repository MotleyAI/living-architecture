kind: neutral
command: la-wait-for-reviews
args:
- '7'
- --repo
- o/r
env:
  LA_WAIT_POLL_SECONDS: '0'
gh:
- match:
  - pr
  - view
  - headRefOid,mergeable,statusCheckRollup
  responses:
  - stdout:
      headRefOid: abcdef0123
      mergeable: MERGEABLE
      statusCheckRollup:
      - &id002
        __typename: CheckRun
        name: lint
        status: COMPLETED
        conclusion: SUCCESS
        detailsUrl: https://github.com/o/r/actions/runs/1/job/9
      - &id001
        __typename: StatusContext
        context: CodeRabbit
        state: SUCCESS
  - stdout:
      headRefOid: abcdef0123
      mergeable: MERGEABLE
      statusCheckRollup:
      - __typename: CheckRun
        name: lint
        status: IN_PROGRESS
        detailsUrl: https://github.com/o/r/actions/runs/1/job/9
      - *id001
  - stdout:
      headRefOid: abcdef0123
      mergeable: MERGEABLE
      statusCheckRollup:
      - *id002
      - *id001
- match:
  - api
  - user
  stdout:
    login: me
- match:
  - repos/o/r/commits/abcdef0123/check-suites
  stdout:
    check_suites: []
- match:
  - repos/o/r/commits/abcdef0123/statuses
  responses:
  - stdout: []
  - stdout: []
  - stdout:
    - context: CodeRabbit
      state: success
      description: Review completed
- match:
  - repos/o/r/issues/7/comments
  stdout:
  - id: 31
    user:
      login: coderabbitai[bot]
    html_url: https://github.com/o/r/pull/7#issuecomment-31
    updated_at: '2026-01-02T00:00:00Z'
    body: |-
      <!-- This is an auto-generated comment: summarize by coderabbit.ai -->
      ## Summary
- match:
  - repos/o/r/pulls/7/reviews
  stdout: []
- match:
  - repos/o/r/pulls/7/comments
  stdout: []
expect:
  exit: 0
golden: manual
note: a check pending again on the same HEAD reopens the gate, so the settle cap counts from the later clearance
