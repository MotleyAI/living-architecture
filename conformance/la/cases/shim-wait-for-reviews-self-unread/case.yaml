kind: neutral
command: la-wait-for-reviews
args:
- '7'
- --repo
- o/r
env:
  LA_WAIT_POLL_SECONDS: '0'
gh:
- match:
  - pr
  - view
  - headRefOid,mergeable,statusCheckRollup
  responses:
  - stdout:
      headRefOid: abcdef0123
      mergeable: MERGEABLE
      statusCheckRollup:
      - __typename: CheckRun
        name: lint
        status: IN_PROGRESS
        detailsUrl: https://github.com/o/r/actions/runs/1/job/9
  - stdout:
      headRefOid: abcdef0123
      mergeable: MERGEABLE
      statusCheckRollup:
      - __typename: CheckRun
        name: lint
        status: COMPLETED
        detailsUrl: https://github.com/o/r/actions/runs/1/job/9
        conclusion: FAILURE
- match:
  - api
  - user
  responses:
  - stdout: ''
    exit: 1
  - stdout:
      login: me
- match:
  - repos/o/r/commits/abcdef0123/check-suites
  stdout:
    check_suites: []
- match:
  - repos/o/r/commits/abcdef0123/statuses
  stdout: []
- match:
  - repos/o/r/issues/7/comments
  stdout: []
- match:
  - repos/o/r/pulls/7/reviews
  stdout: []
- match:
  - repos/o/r/pulls/7/comments
  stdout:
  - id: 13
    user:
      login: alice
    html_url: https://github.com/o/r/pull/7#discussion_r13
    updated_at: '2026-01-02T00:00:00Z'
    body: comment 13
expect:
  exit: 0
  stderr: ignore
golden: manual
note: 'no comment item until the logged-in user is read: the comment follows poll 2''s ci-failed line'
