kind: neutral
command: la-wait-for-reviews
args:
- '7'
- --repo
- o/r
gh:
- match:
  - pr
  - view
  - headRefOid,mergeable,statusCheckRollup
  stdout:
    headRefOid: abc
    mergeable: MERGEABLE
    statusCheckRollup:
    - __typename: CheckRun
      name: tests
      status: COMPLETED
      conclusion: SUCCESS
      detailsUrl: https://github.com/o/r/actions/runs/1/job/2
    - __typename: StatusContext
      context: CodeRabbit
      state: SUCCESS
- match:
  - api
  - user
  stdout:
    login: me
- match:
  - repos/o/r/commits/abc/check-suites
  stdout:
    check_suites: []
- match:
  - repos/o/r/issues/7/comments
  stdout:
  - id: 31
    user:
      login: coderabbitai[bot]
    html_url: https://github.com/o/r/pull/7#issuecomment-31
    updated_at: '2026-01-02T00:00:00Z'
    body: |-
      <!-- This is an auto-generated comment: summarize by coderabbit.ai -->
      ## Summary
- match:
  - repos/o/r/commits/abc/statuses
  stdout:
  - context: CodeRabbit
    state: success
    description: Incremental review skipped
  - context: CodeRabbit
    state: success
    description: Review rate limited
- match:
  - repos/o/r/pulls/7/reviews
  stdout: []
- match:
  - repos/o/r/pulls/7/comments
  stdout: []
expect:
  exit: 3
note: the newest CodeRabbit status (first in API order) decides between skipped and rate limited
