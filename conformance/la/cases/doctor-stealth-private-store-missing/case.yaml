kind: neutral
command: la-doctor
bins:
- dir: fake-openspec
  position: before
  files:
    openspec: |
      #!/bin/sh
      [ "$*" = "store list --json" ] || { echo "fake openspec: unexpected $*" >&2; exit 99; }
      c=$(git rev-parse --path-format=absolute --git-common-dir) || exit 99
      id=la-$(printf %s "$c/living-architecture" | sha256sum | cut -c1-12)
      printf '{"stores": [{"id": "%s", "root": "%s"}], "status": []}\n' "$id" "$c/living-architecture/openspec"
git:
- write:
    README.md: |
      demo
- commit: init
- common_dir:
    living-architecture/living-architecture.yaml: |
      format: <FORMAT>
      openspec: true
normalize:
- version
- pattern: la-[0-9a-f]{12}
  replace: la-<ID>
expect:
  exit: 1
note: 'the private store directory is missing: one finding naming /la:openspec-init, not the openspec/ finding'
golden: manual
