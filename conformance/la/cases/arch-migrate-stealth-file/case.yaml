kind: neutral
command: la-arch-migrate
symlinks:
  stealth.yaml: .git/living-architecture/living-architecture.yaml
git:
- exclude:
  - stealth.yaml
- write:
    README.md: |
      demo
- commit: init
- common_dir:
    living-architecture/living-architecture.yaml: |
      format: 0.4.0
      tracker: linear
normalize:
- pattern: '(format"?: "?)[0-9]+\.[0-9]+\.[0-9]+'
  replace: \1<FORMAT>
expect:
  exit: 0
  files:
  - stealth.yaml
  git_status: true
note: la-arch-migrate stamps the stealth file in place (read through the excluded symlink stealth.yaml) and changes nothing
  in the working tree
golden: manual
