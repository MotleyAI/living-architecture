kind: neutral
twin: python
command: la-doctor
bins:
- dir: old-dr
  position: before
  files:
    dr-doctor: |
      #!/bin/sh
      [ "$*" = "--twin" ] || { echo "fake dr-doctor: unexpected $*" >&2; exit 99; }
      echo "python 0.11.0 <DR_CONTRACT_HASH>"
normalize:
- version
- dr_contract_hash
expect:
  exit: 1
note: 'the first dr-doctor on PATH reports dr 0.11.0: one finding naming both versions and the la install command'
golden: manual
