kind: neutral
command: la-fetch-review-comments
args:
- '7'
- --repo
- o/r
gh:
- match:
  - api
  - user
  stdout:
    login: me
- match:
  - graphql
  stdout:
    data:
      repository:
        pullRequest:
          reviewThreads:
            pageInfo:
              hasNextPage: false
              endCursor: null
            nodes: []
- match:
  - repos/o/r/pulls/7/reviews
  stdout:
  - id: 51
    user:
      login: copilot-pull-request-reviewer[bot]
    body: Consider X
    html_url: https://github.com/o/r/pull/7#pullrequestreview-51
    submitted_at: '2026-01-01T00:00:00Z'
- match:
  - repos/o/r/issues/7/comments
  stdout:
  - id: 41
    user:
      login: bob
    body: Why this?
    html_url: https://github.com/o/r/pull/7#issuecomment-41
    created_at: '2026-01-01T00:00:00Z'
  - id: 42
    user:
      login: carol
    body: And this?
    html_url: https://github.com/o/r/pull/7#issuecomment-42
    created_at: '2026-01-01T00:00:00Z'
  - id: 61
    user:
      login: me
    body: |-
      Re: https://github.com/o/r/pull/7#issuecomment-41

      Because.
    html_url: https://github.com/o/r/pull/7#issuecomment-61
    created_at: '2026-01-02T00:00:00Z'
  - id: 62
    user:
      login: me
    body: |-
      Thanks.
      Re: https://github.com/o/r/pull/7#pullrequestreview-51
    html_url: https://github.com/o/r/pull/7#issuecomment-62
    created_at: '2026-01-02T00:00:00Z'
  - id: 63
    user:
      login: me
    body: 'Re: https://github.com/o/r/pull/7#issuecomment-42 too'
    html_url: https://github.com/o/r/pull/7#issuecomment-63
    created_at: '2026-01-02T00:00:00Z'
normalize:
- pattern: -[0-9]{8}-[0-9]{6}\.json
  replace: -<TS>.json
expect:
  exit: 0
golden: manual
note: 'answered needs a later comment of the logged-in user whose first line is exactly `Re: <url>`'
