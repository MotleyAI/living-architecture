kind: neutral
command: la-wait-for-reviews
args:
- '7'
- --repo
- o/r
fixture: config-invalid
gh:
- match:
  - pr
  - view
  - headRefOid,mergeable,statusCheckRollup
  stdout:
    headRefOid: abc
    mergeable: MERGEABLE
    statusCheckRollup:
    - __typename: CheckRun
      name: tests
      status: COMPLETED
      conclusion: SUCCESS
      detailsUrl: https://github.com/o/r/actions/runs/1/job/2
- match:
  - api
  - user
  stdout:
    login: me
- match:
  - repos/o/r/commits/abc/check-suites
  stdout:
    check_suites: []
- match:
  - repos/o/r/issues/7/comments
  stdout:
  - id: 31
    user:
      login: me
    html_url: https://github.com/o/r/pull/7#issuecomment-31
    updated_at: '2026-01-02T00:00:00Z'
    body: LGTM
- match:
  - repos/o/r/pulls/7/reviews
  stdout: []
- match:
  - repos/o/r/pulls/7/comments
  stdout: []
expect:
  exit: 0
golden: manual
note: the repo config is never read, so an invalid one changes nothing
