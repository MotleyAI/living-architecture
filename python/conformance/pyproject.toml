# The dev-only conformance runner both packages' suites use; never published.
[project]
name = "conformance-runner"
version = "0.0.0"
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["type-rename-move", "living-architecture", "pyyaml>=6"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "conformance_runner"

[tool.uv.sources]
type-rename-move = { workspace = true }
living-architecture = { workspace = true }
