# Manifest parser vectors: `argv` given to `command` either parses to `args` (every dest, defaults included, plus
# `subcommand` for a command with subcommands; a passthrough command's handler receives `{argv: [...]}` verbatim)
# or is a usage error (`exit: 2`). Parser error wording and --help text are not pinned.
cases:
- name: rename with defaults
  command: trmv-refactor
  argv: [rename, --file, a.py, --symbol, f, --new-name, g]
  args: {project: ., apply: false, timings: false, subcommand: rename, file: a.py, offset: null, line: null, col: null, symbol: f, new_name: g,
    in_hierarchy: true, unsure: skip, allow_blindspots: false, with_stand_ins: [], without_stand_ins: [], keep: [],
    docs: false, docs_pick: [], keep_literal: [], words: null, fail_fast: false, stub: null}
- name: store-false flag and choice
  command: trmv-refactor
  argv: [--apply, --project, p, rename, --file, a.py, --line, '3', --col, '7', --new-name, g, --no-in-hierarchy, --unsure,
    include]
  args: {project: p, apply: true, timings: false, subcommand: rename, file: a.py, offset: null, line: 3, col: 7, symbol: null, new_name: g,
    in_hierarchy: false, unsure: include, allow_blindspots: false, with_stand_ins: [], without_stand_ins: [], keep: [],
    docs: false, docs_pick: [], keep_literal: [], words: null, fail_fast: false, stub: null}
- name: rename guard options repeat and keep order
  command: trmv-refactor
  argv: [rename, --file, a.py, --symbol, f, --new-name, g, --with, b.py:3, --without, c.py:7, --with, d.py:1, --keep,
    tests/compat, --keep, e.py:12, --allow-blindspots, --docs]
  args: {project: ., apply: false, timings: false, subcommand: rename, file: a.py, offset: null, line: null, col: null, symbol: f, new_name: g,
    in_hierarchy: true, unsure: skip, allow_blindspots: true, with_stand_ins: [b.py:3, d.py:1], without_stand_ins: [c.py:7],
    keep: [tests/compat, e.py:12], docs: true, docs_pick: [], keep_literal: [], words: null, fail_fast: false, stub: null}
- name: timings flag before the subcommand
  command: trmv-refactor
  argv: [--timings, rename-map, map.yaml]
  args: {project: ., apply: false, timings: true, subcommand: rename-map, map: map.yaml, in_hierarchy: true, unsure: skip,
    allow_blindspots: false, with_stand_ins: [], without_stand_ins: [], keep: [], docs: false, docs_pick: [], keep_literal: [], words: null, fail_fast: false, stub: null}
- name: timings flag after the subcommand rejected
  command: trmv-refactor
  argv: [rename-map, map.yaml, --timings]
  exit: 2
- name: rename guard option needs a value
  command: trmv-refactor
  argv: [rename, --file, a.py, --symbol, f, --new-name, g, --keep]
  exit: 2
- name: rename guard flag takes no value
  command: trmv-refactor
  argv: [rename, --file, a.py, --symbol, f, --new-name, g, --docs=yes]
  exit: 2
- name: choice rejected
  command: trmv-refactor
  argv: [rename, --file, a.py, --new-name, g, --unsure, maybe]
  exit: 2
- name: int option
  command: trmv-refactor
  argv: [rename, --file, a.py, --offset, '-5', --new-name, g]
  args: {project: ., apply: false, timings: false, subcommand: rename, file: a.py, offset: -5, line: null, col: null, symbol: null, new_name: g,
    in_hierarchy: true, unsure: skip, allow_blindspots: false, with_stand_ins: [], without_stand_ins: [], keep: [],
    docs: false, docs_pick: [], keep_literal: [], words: null, fail_fast: false, stub: null}
- name: int option type error
  command: trmv-refactor
  argv: [rename, --file, a.py, --offset, '1.5', --new-name, g]
  exit: 2
- name: required option missing
  command: trmv-refactor
  argv: [rename, --file, a.py]
  exit: 2
- name: move-symbol
  command: trmv-refactor
  argv: [move-symbol, --file, a.py, --symbol, f, --dest, b.py]
  args: {project: ., apply: false, timings: false, subcommand: move-symbol, file: a.py, offset: null, line: null, col: null, symbol: f, dest: b.py}
- name: removed --name rejected
  command: trmv-refactor
  argv: [rename, --file, a.py, --name, f, --new-name, g]
  exit: 2
- name: symbol and line are exclusive
  command: trmv-refactor
  argv: [rename, --file, a.py, --line, '1', --symbol, foo, --new-name, bar]
  exit: 2
- name: offset and line are exclusive
  command: trmv-refactor
  argv: [rename, --file, a.py, --offset, '0', --line, '1', --new-name, bar]
  exit: 2
- name: exclusive options rejected in move-symbol
  command: trmv-refactor
  argv: [move-symbol, --file, a.py, --offset, '0', --symbol, f, --dest, b.py]
  exit: 2
- name: one locator of a group is accepted with --col
  command: trmv-refactor
  argv: [move-symbol, --file, a.py, --line, '2', --col, '5', --dest, b.py]
  args: {project: ., apply: false, timings: false, subcommand: move-symbol, file: a.py, offset: null, line: 2, col: 5, symbol: null, dest: b.py}
- name: rename-map with defaults
  command: trmv-refactor
  argv: [rename-map, map.yaml]
  args: {project: ., apply: false, timings: false, subcommand: rename-map, map: map.yaml, in_hierarchy: true, unsure: skip,
    allow_blindspots: false, with_stand_ins: [], without_stand_ins: [], keep: [], docs: false, docs_pick: [], keep_literal: [], words: null, fail_fast: false, stub: null}
- name: rename-map options apply to every entry
  command: trmv-refactor
  argv: [--apply, rename-map, maps/m.yaml, --no-in-hierarchy, --keep, tests/compat, --with, b.py:3, --docs,
    --allow-blindspots, --fail-fast]
  args: {project: ., apply: true, timings: false, subcommand: rename-map, map: maps/m.yaml, in_hierarchy: false, unsure: skip,
    allow_blindspots: true, with_stand_ins: [b.py:3], without_stand_ins: [], keep: [tests/compat], docs: true, docs_pick: [], keep_literal: [], words: null,
    fail_fast: true, stub: null}
- name: rename-map takes no locator
  command: trmv-refactor
  argv: [rename-map, map.yaml, --symbol, f]
  exit: 2
- name: rename-map takes no new name
  command: trmv-refactor
  argv: [rename-map, map.yaml, --new-name, g]
  exit: 2
- name: rename-map needs the map
  command: trmv-refactor
  argv: [rename-map]
  exit: 2
- name: retarget
  command: trmv-refactor
  argv: [retarget, --file, a.py, --symbol, Engine.save, --target, Engine.save_model, --keep, tests/compat, --docs]
  args: {project: ., apply: false, timings: false, subcommand: retarget, file: a.py, offset: null, line: null, col: null,
    symbol: Engine.save, target: Engine.save_model, allow_blindspots: false, with_stand_ins: [], without_stand_ins: [],
    keep: [tests/compat], docs: true, words: null, fail_fast: false}
- name: a word table on rename
  command: trmv-refactor
  argv: [rename, --file, a.py, --symbol, f, --new-name, g, --docs, --words, words.yaml]
  args: {project: ., apply: false, timings: false, subcommand: rename, file: a.py, offset: null, line: null, col: null, symbol: f, new_name: g,
    in_hierarchy: true, unsure: skip, allow_blindspots: false, with_stand_ins: [], without_stand_ins: [], keep: [],
    docs: true, docs_pick: [], keep_literal: [], words: words.yaml, fail_fast: false, stub: null}
- name: a word table on rename-map
  command: trmv-refactor
  argv: [rename-map, map.yaml, --words, tables/words.yaml]
  args: {project: ., apply: false, timings: false, subcommand: rename-map, map: map.yaml, in_hierarchy: true, unsure: skip,
    allow_blindspots: false, with_stand_ins: [], without_stand_ins: [], keep: [], docs: false, docs_pick: [], keep_literal: [],
    words: tables/words.yaml, fail_fast: false, stub: null}
- name: a word table on retarget
  command: trmv-refactor
  argv: [retarget, --file, a.py, --symbol, Old, --target, New, --words, words.yaml]
  args: {project: ., apply: false, timings: false, subcommand: retarget, file: a.py, offset: null, line: null, col: null,
    symbol: Old, target: New, allow_blindspots: false, with_stand_ins: [], without_stand_ins: [], keep: [], docs: false,
    words: words.yaml, fail_fast: false}
- name: a word table needs a value
  command: trmv-refactor
  argv: [rename-map, map.yaml, --words]
  exit: 2
- name: move-symbol takes no word table
  command: trmv-refactor
  argv: [move-symbol, --file, a.py, --symbol, f, --dest, b.py, --words, words.yaml]
  exit: 2
- name: generate-map
  command: trmv-refactor
  argv: [generate-map, words.yaml]
  args: {project: ., apply: false, timings: false, subcommand: generate-map, table: words.yaml, language: null}
- name: generate-map with a language
  command: trmv-refactor
  argv: [--project, p, --apply, generate-map, words.yaml, --language, typescript]
  args: {project: p, apply: true, timings: false, subcommand: generate-map, table: words.yaml, language: typescript}
- name: generate-map needs the table
  command: trmv-refactor
  argv: [generate-map]
  exit: 2
- name: generate-map language choice rejected
  command: trmv-refactor
  argv: [generate-map, words.yaml, --language, ruby]
  exit: 2
- name: generate-map takes no word-table option
  command: trmv-refactor
  argv: [generate-map, words.yaml, --words, other.yaml]
  exit: 2
- name: retarget needs the target
  command: trmv-refactor
  argv: [retarget, --file, a.py, --symbol, Old]
  exit: 2
- name: retarget locators are exclusive
  command: trmv-refactor
  argv: [retarget, --file, a.py, --line, '3', --symbol, Old, --target, New]
  exit: 2
- name: retarget takes no new name
  command: trmv-refactor
  argv: [retarget, --file, a.py, --symbol, Old, --target, New, --new-name, x]
  exit: 2
- name: move-module
  command: trmv-refactor
  argv: [move-module, --module, a.py, --dest, pkg]
  args: {project: ., apply: false, timings: false, subcommand: move-module, module: a.py, dest: pkg}
- name: nargs plus
  command: trmv-compliance
  argv: [a.py, b, --select, mock, --attr, x]
  args:
    paths: [a.py, b]
    select: mock
    attr: [x]
- name: attr repeats and keeps order
  command: trmv-compliance
  argv: [--attr, save_model, tests, --attr, get_model]
  args:
    paths: [tests]
    select: null
    attr: [save_model, get_model]
- name: nargs plus needs one
  command: trmv-compliance
  argv: [--select, mock]
  exit: 2
- name: double dash before positionals
  command: trmv-compliance
  argv: [--, -a.py, b.py]
  args:
    paths: [-a.py, b.py]
    select: null
    attr: []
- name: mock-lint paths
  command: trmv-mock-lint
  argv: [tests/test_a.py, web]
  args: {paths: [tests/test_a.py, web], base: null}
- name: mock-lint against a base
  command: trmv-mock-lint
  argv: [--base, main, tests]
  args: {paths: [tests], base: main}
- name: mock-lint rejects abbreviations
  command: trmv-mock-lint
  argv: [--bas, main, tests]
  exit: 2
- name: mock-lint needs a path
  command: trmv-mock-lint
  argv: [--base, main]
  exit: 2
