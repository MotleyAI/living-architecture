# Every command's surface. Each twin builds its parser from this file: no abbreviated long options, `--`
# ends options, a usage error exits 2, and a `passthrough` command hands its raw argv to its handler.
#
# option:      name, type (string | int | float | path | flag), help; optional: dest, metavar, choices,
#              default, required, repeatable, store (a flag's stored value; default true), internal
#              (accepted but omitted from help: the twins' own protocol)
# positional:  name, help; optional: nargs ('?' | '*' | '+'; default exactly one)
# command:     help, exit (code -> meaning), options, positionals, subcommands, passthrough, usage,
#              require_one_of (dests; none given is a usage error), exclusive (lists of dests, at most one of
#              each list given; more is a usage error), script (the bundled review script it
#              runs), native (the languages whose twin implements the command; absent: neutral, every twin runs it),
#              format (exempt: the command skips the repo format check; absent: it checks the format declared in
#              living-architecture.yaml after parsing its arguments, and a format refusal exits 2)
# trmv-refactor's prose_extensions are the non-source files `rename --docs` scans for mentions.
# language_keys: the public `lang.<language>.<key>` keys; source_globs (one `**/*<ext>` glob per source extension) and
#              waiver (the language's waiver comment) are derived, the rest come from languages.yaml.
# base_fetch_timeout_seconds: the best-effort `git fetch <remote> <branch>` before a command compares with a base ref
#              is killed after this many seconds; the command then uses the ref as it stands.
# literal_value_forbidden: the substrings a Literal member's new value may not hold (`refactor.literal-value`).
# timing_phases: the phases `trmv-refactor --timings` reports (`refactor.timing`), in print order; `total` follows them.
# package, plugin, doctor: the package these commands ship in, its plugin's name (how messages name the tools), and
#              the command that reports a twin's identity (`--twin`).

package: type-rename-move
plugin: trmv
doctor: trmv-doctor
base_fetch_timeout_seconds: 30
literal_value_forbidden: ["'", '"', '`', "\\", '${', "\0", "\r", "\n", "\u2028", "\u2029"]
timing_phases: [load, resolve, references, rules, conflicts, blindspot-scan, literal-scan, literal-probe, baseline, write]
language_keys: [source_extensions, source_globs, test_globs, declaration_globs, comment_prefix, suppression, waiver, baseline_file, markers]

commands:
  trmv-config:
    help: Print trmv's resolved config values for skills and scripts.
    exit: {0: ok, 1: invalid config, 2: 'usage error, unknown key, more than one config file or format refusal'}
    options:
      - {name: --root, type: path, help: 'repo root (default: nearest git root of cwd)'}
    subcommands:
      get:
        help: >-
          print one value by dotted key, e.g. commands.typecheck.python; `languages` prints the repo languages,
          lang.<language>.<key> a language fact and `stealth` whether a stealth config file is read
        positionals:
          - {name: key, help: dotted config key}
      show:
        help: print trmv's whole resolved config as JSON

  trmv-doctor:
    help: Check the installed trmv tools match the plugin and the config trmv reads is valid.
    exit: {0: healthy, 1: problems found, 2: usage error}
    format: exempt
    options:
      - {name: --plugin, type: path, metavar: DIR,
         help: "directory inside the calling plugin (e.g. a skill's base directory); check the tools against its plugin.json version"}
      - {name: --root, type: path, help: 'repo root (default: nearest git root of cwd)'}
      - {name: --contract-hash, type: flag, help: print the bundled contract hash and exit}
      - {name: --require-config, type: flag,
         help: 'report that no config file trmv reads exists, at the repo root or in the stealth directory'}
      - {name: --twin, type: flag, internal: true, help: 'print this twin''s language, version and contract hash'}

  trmv-typecheck:
    help: >-
      Run each applicable language's type checker against its committed baseline, which only ever shrinks.
      A language applies when commands.typecheck sets it, or when the repo has its files and a root marker.
    exit: {0: no errors outside the baseline, 1: new errors, 2: 'usage, config or checker error, or format refusal'}
    options:
      - {name: --write-baseline, type: flag,
         help: 'write the baseline of each applicable language that has none (once, when adopting the gate)'}
      - {name: --realign-from, type: string, metavar: REF,
         help: 'move each Python baseline entry to where its error is now, given a commit where the baseline matched,
           then check'}
      - {name: --base, type: string, metavar: BRANCH,
         help: 'in stealth mode, the branch whose merge base with HEAD gives the baseline of each language the repo
           tracks none for (default: the target of origin/HEAD)'}
      - {name: --language, type: string, choices: [python, typescript], internal: true,
         help: check only this language}
    exclusive: [[write_baseline, realign_from]]

  trmv-refactor:
    native: [python, typescript]
    help: >-
      IDE-grade refactors (Python via la's own renames and rope's moves, TypeScript via its language service): rename,
      rename-map, generate-map, retarget, move-symbol, move-module. Rewrites every import and reference across the project and keeps the type-check
      baseline aligned. Dry-run by default; pass --apply to write. Symbol location comes from --symbol (the
      declaration's path inside --file, e.g. Class.method), --offset, or --line/--col (1-based, as an editor/LSP
      reports).
    exit: {0: ok, 1: refactor error, 2: 'usage error, locator or map error, or format refusal'}
    prose_extensions: [.md, .rst, .txt]
    options:
      - {name: --project, type: path, default: ., help: 'project root (default: cwd)'}
      - {name: --apply, type: flag, help: 'write changes (default: dry-run)'}
      - {name: --timings, type: flag, help: "print each phase's wall time on stderr after all other output"}
    subcommands:
      rename:
        help: >-
          rename the symbol at a location, or with no locator the module --file names (its file moves and every import
          follows); Python: also on an import that names a module
        exclusive: [[offset, line, symbol]]
        options:
          - {name: --file, type: path, required: true,
             help: 'file holding the symbol (with no locator: the module to rename)'}
          - {name: --offset, type: int, help: 0-based character offset}
          - {name: --line, type: int, help: 1-based line}
          - {name: --col, type: int, help: 1-based column}
          - {name: --symbol, type: string, metavar: PATH,
             help: "the declaration's path in --file: Class.method, func.<locals>.inner, func(param), Alias['value'],
               '*.<locals>.name' (every local of that name)"}
          - {name: --new-name, type: string, required: true, help: the new name}
          - {name: --no-in-hierarchy, type: flag, dest: in_hierarchy, store: false,
             help: 'disable hierarchy rename (on by default: also renames overrides in sub/superclasses; Python only)'}
          - {name: --unsure, type: string, choices: [skip, include], default: skip,
             help: 'occurrences the checker cannot resolve: skip (default) or include (risky; Python only)'}
          - {name: --allow-blindspots, type: flag,
             help: 'list the blind spots of the old name (untyped receivers, unlinked keywords) and rename anyway (default: refuse)'}
          - {name: --with, type: string, dest: with_stand_ins, metavar: PATH:LINE, repeatable: true,
             help: 'rename the stand-ins declared on this line too, with their hierarchies; PATH relative to --project (repeatable)'}
          - {name: --without, type: string, dest: without_stand_ins, metavar: PATH:LINE, repeatable: true,
             help: 'leave the stand-ins declared on this line, with their hierarchies; PATH relative to --project (repeatable)'}
          - {name: --keep, type: string, metavar: 'PATH[:LINE]', repeatable: true,
             help: 'leave every edit on this line, in this file or under this directory; PATH relative to --project (repeatable)'}
          - {name: --docs, type: flag,
             help: 'also rewrite mentions in comments, docstrings, strings and prose files; list the rest'}
          - {name: --docs-pick, type: string, metavar: 'PATH:LINE[=ENTRY]', repeatable: true,
             help: 'with --docs: rewrite the mentions listed on this line, with =ENTRY only those of that entry''s old
               name (repeatable)'}
          - {name: --keep-literal, type: string, metavar: KEY, repeatable: true,
             help: 'leave every edit inside a dict or object literal that holds the key KEY (repeatable)'}
          - {name: --words, type: path, metavar: TABLE,
             help: "a word table whose carve-outs leave matching stand-ins and list matching --docs mentions"}
          - {name: --fail-fast, type: flag,
             help: 'stop at the first entry with a refusal (default: compute every entry and report every refusal)'}
          - {name: --stub, type: string, metavar: REMOVAL,
             help: 'Python module rename: leave a stub at the old path, refactor.python.moved_module_stub with {removal}
               set to REMOVAL'}
      rename-map:
        help: >-
          apply a YAML list of rename and retarget entries as one refactor: every entry resolved against the code
          before the map, one diff, one refusal report, written all or nothing
        positionals:
          - {name: map, help: 'the map file: entries {file, symbol | line [col] | offset, new_name | retarget} or {module, new_name}'}
        options:
          - {name: --no-in-hierarchy, type: flag, dest: in_hierarchy, store: false,
             help: 'disable hierarchy rename (on by default: also renames overrides in sub/superclasses; Python only)'}
          - {name: --unsure, type: string, choices: [skip, include], default: skip,
             help: 'occurrences the checker cannot resolve: skip (default) or include (risky; Python only)'}
          - {name: --allow-blindspots, type: flag,
             help: 'list the blind spots of the old name (untyped receivers, unlinked keywords) and rename anyway (default: refuse)'}
          - {name: --with, type: string, dest: with_stand_ins, metavar: PATH:LINE, repeatable: true,
             help: 'rename the stand-ins declared on this line too, with their hierarchies; PATH relative to --project (repeatable)'}
          - {name: --without, type: string, dest: without_stand_ins, metavar: PATH:LINE, repeatable: true,
             help: 'leave the stand-ins declared on this line, with their hierarchies; PATH relative to --project (repeatable)'}
          - {name: --keep, type: string, metavar: 'PATH[:LINE]', repeatable: true,
             help: 'leave every edit on this line, in this file or under this directory; PATH relative to --project (repeatable)'}
          - {name: --docs, type: flag,
             help: 'also rewrite mentions in comments, docstrings, strings and prose files; list the rest'}
          - {name: --docs-pick, type: string, metavar: 'PATH:LINE[=ENTRY]', repeatable: true,
             help: 'with --docs: rewrite the mentions listed on this line, with =ENTRY only those of that entry''s old
               name (repeatable)'}
          - {name: --keep-literal, type: string, metavar: KEY, repeatable: true,
             help: 'leave every edit inside a dict or object literal that holds the key KEY (repeatable)'}
          - {name: --words, type: path, metavar: TABLE,
             help: "a word table whose carve-outs leave matching stand-ins and list matching --docs mentions"}
          - {name: --fail-fast, type: flag,
             help: 'stop at the first entry with a refusal (default: compute every entry and report every refusal)'}
          - {name: --stub, type: string, metavar: REMOVAL,
             help: 'Python module renames: leave a stub at each moved module file''s old path, refactor.python.moved_module_stub
               with {removal} set to REMOVAL'}
      generate-map:
        help: >-
          write a rename map for a word table: one entry per declaration and module whose name holds a word,
          leaving out and listing what a carve-out matches
        positionals:
          - {name: table, help: 'the word table: words {from, to}, carve_outs {words, annotated | paths | symbols} and entries'}
        options:
          - {name: --language, type: string, choices: [python, typescript],
             help: 'the language to generate for (required when the project holds both)'}
      retarget:
        help: rewrite the references to an alias to name its target, declared or imported in the same class or module
        exclusive: [[offset, line, symbol]]
        options:
          - {name: --file, type: path, required: true, help: file holding the alias}
          - {name: --offset, type: int, help: 0-based character offset}
          - {name: --line, type: int, help: 1-based line}
          - {name: --col, type: int, help: 1-based column}
          - {name: --symbol, type: string, metavar: PATH, help: "the alias's path in --file"}
          - {name: --target, type: string, metavar: PATH, required: true, help: "the target's path in --file"}
          - {name: --allow-blindspots, type: flag,
             help: 'list the blind spots of the old name (untyped receivers, unlinked keywords) and rename anyway (default: refuse)'}
          - {name: --with, type: string, dest: with_stand_ins, metavar: PATH:LINE, repeatable: true,
             help: 'rewrite the stand-ins declared on this line too, with their hierarchies; PATH relative to --project (repeatable)'}
          - {name: --without, type: string, dest: without_stand_ins, metavar: PATH:LINE, repeatable: true,
             help: 'leave the stand-ins declared on this line, with their hierarchies; PATH relative to --project (repeatable)'}
          - {name: --keep, type: string, metavar: 'PATH[:LINE]', repeatable: true,
             help: 'leave every edit on this line, in this file or under this directory; PATH relative to --project (repeatable)'}
          - {name: --docs, type: flag,
             help: 'also rewrite mentions in comments, docstrings, strings and prose files; list the rest'}
          - {name: --words, type: path, metavar: TABLE,
             help: "a word table whose carve-outs leave matching stand-ins and list matching --docs mentions"}
          - {name: --fail-fast, type: flag,
             help: 'stop at the first entry with a refusal (default: compute every entry and report every refusal)'}
      move-symbol:
        help: move a top-level declaration to another module
        exclusive: [[offset, line, symbol]]
        options:
          - {name: --file, type: path, required: true, help: file holding the symbol}
          - {name: --offset, type: int, help: 0-based character offset}
          - {name: --line, type: int, help: 1-based line}
          - {name: --col, type: int, help: 1-based column}
          - {name: --symbol, type: string, metavar: PATH, help: "the top-level declaration's name in --file"}
          - {name: --dest, type: path, required: true, help: destination module of the same language (must exist)}
      move-module:
        help: move a module file or directory into a package/dir
        options:
          - {name: --module, type: path, required: true, help: source module file or directory}
          - {name: --dest, type: path, required: true, help: destination package directory (must exist)}

  trmv-compliance:
    native: [python, typescript]
    help: >-
      Report constructs that make a rename un-verifiable, with each file's language's checks (Python:
      untyped-def, unannotated-attr, explicit-any, mock, rope-walk, attr-blindspot, string-blindspot; TypeScript:
      tsconfig, explicit-any, untyped-def, mock, attr-blindspot, string-blindspot). attr-blindspot and string-blindspot
      need --attr NAME: x.NAME accesses, and accesses naming NAME by a string, whose receiver is untyped.
    exit: {0: clean, 1: violations, 2: usage error or format refusal}
    positionals:
      - {name: paths, nargs: '+', help: files or directories}
    options:
      - {name: --select, type: string, help: 'comma-separated checks (default: every check of each file''s language)'}
      - {name: --attr, type: string, repeatable: true,
         help: 'a member name attr-blindspot and string-blindspot check (repeatable; requires either selected)'}

  trmv-mock-lint:
    native: [python, typescript]
    help: >-
      Every test double must be bound to the real type: a unittest.mock double to a spec; a Vitest/Jest fn() or
      module factory to a type.
    exit: {0: clean, 1: violations, 2: 'usage error, unresolvable base or format refusal'}
    positionals:
      - {name: paths, nargs: '+', help: files or directories}
    options:
      - {name: --base, type: string,
         help: 'base branch (compared as origin/BRANCH): print only the findings the base lacks'}
