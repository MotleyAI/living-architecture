[project]
name = "deterministic-refactor"
version = "0.13.0"
description = "Verified renames and moves for Python and TypeScript code: every import and reference rewritten, checked by a type-check gate against a committed baseline."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MotleyAI" }]
maintainers = [{ name = "Egor Kraev" }]
keywords = [
    "claude-code",
    "claude-code-plugin",
    "agent-skills",
    "coding-agents",
    "ai-coding",
    "refactoring",
    "rename",
    "type-checking",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: JavaScript",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "rope>=1.15",
    "pydantic>=2.6",
    "pyyaml>=6",
    "jsonschema>=4.18",
    "referencing>=0.28.4",
    "typing-extensions>=4.4",
    "basedpyright==1.40.2",
]

[project.urls]
Homepage = "https://github.com/MotleyAI/living-architecture"
Documentation = "https://github.com/MotleyAI/living-architecture/blob/main/docs/deterministic-refactoring.md"
Repository = "https://github.com/MotleyAI/living-architecture"
Issues = "https://github.com/MotleyAI/living-architecture/issues"
Changelog = "https://github.com/MotleyAI/living-architecture/releases"

# Must equal dr's command set in the shared CLI manifest.
[project.scripts]
dr-refactor = "deterministic_refactor.cli.dr_refactor:dr_refactor"
dr-mock-lint = "deterministic_refactor.cli.dr_mock_lint:dr_mock_lint"
dr-compliance = "deterministic_refactor.cli.dr_compliance:dr_compliance"
dr-config = "deterministic_refactor.cli.dr_config:dr_config"
dr-doctor = "deterministic_refactor.cli.dr_doctor:dr_doctor"
dr-typecheck = "deterministic_refactor.cli.dr_typecheck:dr_typecheck"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "deterministic_refactor"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --dist worksteal -m 'not integration'"
markers = ["integration: runs a real external checker; select with -m integration"]
