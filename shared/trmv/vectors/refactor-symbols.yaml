# The primitives of `trmv-refactor`'s symbol paths, compound names and baseline ranges, run by both twins. Offsets
# count code points.

# A `--symbol` path parsed: its segments, trailing `(param)` and trailing `['value']`; `invalid` when it is no path.
paths:
- name: one segment
  path: foo
  segments: [foo]
- name: member
  path: StorageBackend.get_model
  segments: [StorageBackend, get_model]
- name: nested function
  path: build.<locals>.inner
  segments: [build, <locals>, inner]
- name: local of a method
  path: C.run.<locals>.step
  segments: [C, run, <locals>, step]
- name: parameter
  path: StorageBackend.get_model(model_name)
  segments: [StorageBackend, get_model]
  param: model_name
- name: literal member, single quotes
  path: "DriftKind['edit_model']"
  segments: [DriftKind]
  value: edit_model
- name: literal member, double quotes
  path: 'DriftKind["edit_model"]'
  segments: [DriftKind]
  value: edit_model
- name: literal member of a parameter annotation
  path: "g(mode)['fast']"
  segments: [g]
  param: mode
  value: fast
- name: a value holds any text between its quotes
  path: "Kind['a.b (c) [d]']"
  segments: [Kind]
  value: a.b (c) [d]
- name: an empty value
  path: "Kind['']"
  segments: [Kind]
  value: ''
- name: surrounding and inner spaces are dropped
  path: '  A . b ( p ) '
  segments: [A, b]
  param: p
- name: empty path
  path: ''
  invalid: true
- name: empty segment
  path: A..b
  invalid: true
- name: trailing dot
  path: A.
  invalid: true
- name: locals first
  path: <locals>.inner
  invalid: true
- name: locals last
  path: build.<locals>
  invalid: true
- name: empty parameter
  path: f()
  invalid: true
- name: mismatched quotes
  path: "Kind['a\"]"
  invalid: true
- name: unquoted value
  path: Kind[a]
  invalid: true
- name: text after the parameter
  path: f(p).x
  invalid: true
- name: value before the parameter
  path: "f['a'](p)"
  invalid: true

# A name split into words: at `_`, before a capital that follows a non-capital, and before the last capital of a
# run that a letter other than a capital follows. A digit never starts a word.
words:
- name: ModelMeasures
  words: [Model, Measures]
- name: model_name
  words: [model, name]
- name: TestModelMeasurePosition
  words: [Test, Model, Measure, Position]
- name: HTTPServer
  words: [HTTP, Server]
- name: getHTTPResponse
  words: [get, HTTP, Response]
- name: HTTP
  words: [HTTP]
- name: __private_name__
  words: [private, name]
- name: _
  words: []
- name: Model2Vec
  words: [Model2, Vec]
- name: ABC1
  words: [ABC1]
- name: MAX_RETRY_COUNT
  words: [MAX, RETRY, COUNT]
- name: camelCase
  words: [camel, Case]
- name: x
  words: [x]
- name: $scope
  words: [$scope]

# Whether `name` contains `old` as a word sequence: words compared without case, the last word of `old` also with
# an `s` or `es` suffix; `old` itself is no compound.
compounds:
- {old: Model, name: ModelMeasures, match: true}
- {old: Model, name: AcmeModels, match: true}
- {old: Model, name: TestModelMeasurePosition, match: true}
- {old: Model, name: model_name, match: true}
- {old: Model, name: Modelling, match: false}
- {old: Model, name: Model, match: false}
- {old: Model, name: model, match: true}
- {old: Model, name: MODEL, match: true}
- {old: Model, name: Models, match: true}
- {old: column, name: get_columns, match: true}
- {old: column, name: ColumnCycleError, match: true}
- {old: Box, name: boxes, match: true}
- {old: Box, name: boxer, match: false}
- {old: Http, name: HTTPServer, match: true}
- {old: Http, name: Httpx, match: false}
- {old: get_model, name: get_model_sync, match: true}
- {old: get_model, name: getModels, match: true}
- {old: get_model, name: get_the_model, match: false}
- {old: get_model, name: model_get, match: false}
- {old: get_model, name: get_models_sync, match: true}
- {old: get_model, name: get_modelss, match: false}
- {old: getModel, name: forget_model, match: false}
- {old: _, name: a_b, match: false}

# A range mapped through edits (`[start, end, length of the new text]`, sorted, disjoint): a position past an edit
# shifts by its length change; a range start inside a replaced span (from its first character) maps to the
# replacement's start, a range end inside one (through its last character) to the replacement's end.
ranges:
- name: no edits
  edits: []
  range: [3, 7]
  mapped: [3, 7]
- name: before the edit
  edits: [[10, 19, 4]]
  range: [2, 6]
  mapped: [2, 6]
- name: after a shrinking edit
  edits: [[10, 19, 4]]
  range: [25, 26]
  mapped: [20, 21]
- name: after a growing edit
  edits: [[10, 14, 9]]
  range: [25, 26]
  mapped: [30, 31]
- name: the replaced span itself
  edits: [[10, 19, 4]]
  range: [10, 19]
  mapped: [10, 14]
- name: around the replaced span
  edits: [[10, 19, 4]]
  range: [4, 21]
  mapped: [4, 16]
- name: starting at the replaced span, ending after it
  edits: [[10, 19, 4]]
  range: [10, 21]
  mapped: [10, 16]
- name: ending at the replaced span's start
  edits: [[10, 19, 4]]
  range: [4, 10]
  mapped: [4, 10]
- name: starting at the replaced span's end
  edits: [[10, 19, 4]]
  range: [19, 22]
  mapped: [14, 17]
- name: starting inside the replaced span
  edits: [[10, 19, 4]]
  range: [13, 22]
  mapped: [10, 17]
- name: ending inside the replaced span
  edits: [[10, 19, 4]]
  range: [4, 13]
  mapped: [4, 14]
- name: inside the replaced span
  edits: [[10, 19, 4]]
  range: [12, 15]
  mapped: [10, 14]
- name: between two edits
  edits: [[2, 5, 1], [20, 22, 6]]
  range: [8, 12]
  mapped: [6, 10]
- name: across two edits
  edits: [[2, 5, 1], [20, 22, 6]]
  range: [3, 21]
  mapped: [2, 24]
- name: after two edits
  edits: [[2, 5, 1], [20, 22, 6]]
  range: [30, 31]
  mapped: [32, 33]
- name: an insertion before the range
  edits: [[4, 4, 3]]
  range: [4, 8]
  mapped: [7, 11]
- name: an insertion at the range's end
  edits: [[8, 8, 3]]
  range: [4, 8]
  mapped: [4, 8]
- name: a deletion inside the range
  edits: [[5, 7, 0]]
  range: [4, 9]
  mapped: [4, 7]
- name: an empty range at an insertion point
  edits: [[4, 4, 3]]
  range: [4, 4]
  mapped: [7, 7]
- name: an empty range after an edit
  edits: [[1, 3, 5]]
  range: [6, 6]
  mapped: [9, 9]
