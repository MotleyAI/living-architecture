# The shared YAML profile: YAML 1.1 as PyYAML's safe loader reads it, within a closed tag set, refusing a repeated
# mapping key. Each case has exactly one of: `json`, the expected value of `text` serialized as JSON (compared by
# value, so mapping key order is not pinned); `repr`, the canonical repr of the normalized value, for values JSON
# cannot hold (non-string keys, timestamps, inf, nan); `error: true`, an input the safe loader cannot load, which must
# be a YAML error; `error: refused`, an input the safe loader constructs but the profile refuses, which must be a YAML
# error; or `error: duplicate` with `message`, an input the safe loader constructs but that repeats a mapping key,
# which must be the profile's duplicate-key error worded exactly `message`.
cases:
- name: YAML 1.1 booleans
  text: '[yes, no, on, off, true, false, True, FALSE, Yes, NO, On, OFF]'
  json: '[true, false, true, false, true, false, true, false, true, false, true, false]'
- name: y and n stay strings
  text: '[y, n, Y, N]'
  json: '["y", "n", "Y", "N"]'
- name: nulls
  text: '[~, null, Null, NULL, '''']'
  json: '[null, null, null, null, ""]'
- name: integers
  text: '[0, -7, +12, 1_000, 0x1A, 010, 0b101]'
  json: '[0, -7, 12, 1000, 26, 8, 5]'
- name: sexagesimal
  text: '[1:30, 190:20:30]'
  json: '[90, 685230]'
- name: strings that look numeric
  text: '[1e3, 0o10, 1.2.3, 0x, ''010'']'
  json: '["1e3", "0o10", "1.2.3", "0x", "010"]'
- name: floats
  text: '[1.0, -0.5, 1.0e+3, .5, 6.8523015e+5]'
  json: '[1.0, -0.5, 1000.0, 0.5, 685230.15]'
- name: duplicate key
  text: |
    a: 1
    b: 2
    a: 3
  error: duplicate
  message: duplicate key 'a' at lines 1 and 3
- name: duplicate nested key
  text: |
    r: {c: true, c: false}
  error: duplicate
  message: duplicate key 'c' at lines 1 and 1
- name: merge key
  text: |
    base: &b {x: 1, y: 2}
    derived:
      <<: *b
      y: 3
  json: '{"base": {"x": 1, "y": 2}, "derived": {"x": 1, "y": 3}}'
- name: quoted scalars
  text: '["tab\there", ''it''''s'', plain text]'
  json: '["tab\there", "it''s", "plain text"]'
- name: empty document
  text: ''
  json: 'null'
- name: booleans are case-sensitive beyond three spellings
  text: '[yEs, YES, nO, oN, ON, oFF, Off, tRUE, TRUE, fALSE]'
  json: '["yEs", true, "nO", "oN", true, "oFF", false, "tRUE", true, "fALSE"]'
- name: null spellings beyond three stay strings
  text: '[nULL, NuLL, "~", "null"]'
  json: '["nULL", "NuLL", "~", "null"]'
- name: empty mapping values are null
  text: '{a: , b: ~}'
  json: '{"a": null, "b": null}'
- name: sexagesimal integers and floats
  text: '[1:30, -1:30, +1:30, 1:30.5, 190:20:30.15, 1:2:3, 1:60, 0:30]'
  json: '[90, -90, 90, 90.5, 685230.15, 3723, "1:60", "0:30"]'
- name: octal hex and binary
  text: '[017, -017, 0_17, 09, 0o17, 0x_1A, +0x1A, -0x1a, 0b1_01, -0b11, 1__0]'
  json: '[15, -15, 15, "09", "0o17", 26, 26, -26, 5, -3, 10]'
- name: float formats
  text: '[1.0e3, 1.0e+3, 1E+3, 1e+3, 5., -.5, +1.5, 1_0.0_1, 1_000.5]'
  json: '["1.0e3", 1000.0, "1E+3", "1e+3", 5.0, "-.5", 1.5, 10.01, 1000.5]'
- name: infinities and nan
  text: '[.inf, -.Inf, +.INF, .nan, .NaN, .NAN]'
  repr: '[inf, -inf, inf, nan, nan, nan]'
- name: mixed-case inf and nan stay strings
  text: '[.Inf, .iNF, .nAN]'
  repr: '[inf, ''.iNF'', ''.nAN'']'
- name: timestamps normalize to ISO text
  text: '[2026-01-02, 2026-01-02T03:04:05Z, 2026-01-02 03:04:05, 2026-01-02T03:04:05.5+05:30, 2026-01-02t03:04:05.123456789-01:00,
    2026-1-2T3:04:05]'
  repr: '[''2026-01-02'', ''2026-01-02T03:04:05+00:00'', ''2026-01-02T03:04:05'', ''2026-01-02T03:04:05.500000+05:30'',
    ''2026-01-02T03:04:05.123456-01:00'', ''2026-01-02T03:04:05'']'
- name: near-timestamps stay strings
  text: '[2026-1-2, 2026-01-02x, "2026-01-02", 26-01-02]'
  json: '["2026-1-2", "2026-01-02x", "2026-01-02", "26-01-02"]'
- name: merge key list, earlier merges win, explicit keys override
  text: |
    a: &a {x: 1, y: 1}
    b: &b {y: 2, z: 2}
    c:
      <<: [*a, *b]
      z: 3
  json: '{"a": {"x": 1, "y": 1}, "b": {"y": 2, "z": 2}, "c": {"x": 1, "y": 1, "z": 3}}'
- name: explicit key overrides a merge wherever it appears
  text: |
    a: &a {x: 1, w: 1}
    c:
      x: 9
      <<: *a
  json: '{"a": {"x": 1, "w": 1}, "c": {"x": 9, "w": 1}}'
- name: chained merges
  text: |
    a: &a {x: 1}
    b: &b
      <<: *a
      y: 2
    c:
      <<: *b
      z: 3
  json: '{"a": {"x": 1}, "b": {"x": 1, "y": 2}, "c": {"x": 1, "y": 2, "z": 3}}'
- name: duplicate keys at depth
  text: |
    r:
      s:
        t: 1
        t: 2
      s2: {u: [1, {v: a, v: b}]}
  error: duplicate
  message: duplicate key 't' at lines 3 and 4
- name: duplicate key with mapping values
  text: |
    a: {x: 1}
    a: {y: 2}
  error: duplicate
  message: duplicate key 'a' at lines 1 and 2
- name: duplicate key in a one-line flow mapping
  text: |
    {a: 1, b: 2, a: 3}
  error: duplicate
  message: duplicate key 'a' at lines 1 and 1
- name: duplicate key, plain and quoted
  text: |
    a: 1
    "a": 2
  error: duplicate
  message: duplicate key 'a' at lines 1 and 2
- name: duplicate key, hex and decimal
  text: |
    0x1: a
    1: b
  error: duplicate
  message: duplicate key 1 at lines 1 and 2
- name: duplicate key, integer and float
  text: |
    1: a
    1.0: b
  error: duplicate
  message: duplicate key 1 at lines 1 and 2
- name: duplicate key, integer and true
  text: |
    1: a
    true: b
  error: duplicate
  message: duplicate key 1 at lines 1 and 2
- name: duplicate key, true and integer
  text: |
    true: a
    1: b
  error: duplicate
  message: duplicate key True at lines 1 and 2
- name: duplicate key, false and zero
  text: |
    false: a
    0: b
  error: duplicate
  message: duplicate key False at lines 1 and 2
- name: duplicate key, false and float zero
  text: |
    false: a
    0.0: b
  error: duplicate
  message: duplicate key False at lines 1 and 2
- name: duplicate key, null spellings
  text: |
    ~: a
    null: b
  error: duplicate
  message: duplicate key None at lines 1 and 2
- name: duplicate key, zero and negative zero
  text: |
    0: a
    -0.0: b
  error: duplicate
  message: duplicate key 0 at lines 1 and 2
- name: duplicate key, sexagesimal and decimal
  text: |
    1:30: a
    90: b
  error: duplicate
  message: duplicate key 90 at lines 1 and 2
- name: duplicate key, integer at 2^53 and its float
  text: |
    9007199254740992: a
    9007199254740992.0: b
  error: duplicate
  message: duplicate key 9007199254740992 at lines 1 and 2
- name: duplicate key, explicit int tag on a quoted scalar
  text: |
    !!int "1": a
    1: b
  error: duplicate
  message: duplicate key 1 at lines 1 and 2
- name: duplicate key, non-specific tag
  text: |
    ! 1: a
    1: b
  error: duplicate
  message: duplicate key 1 at lines 1 and 2
- name: duplicate key, timestamp and its ISO string
  text: |
    2026-01-02T03:04:05Z: a
    "2026-01-02T03:04:05+00:00": b
  error: duplicate
  message: duplicate key '2026-01-02T03:04:05+00:00' at lines 1 and 2
- name: duplicate key, date and its string
  text: |
    "2026-01-02": a
    2026-01-02: b
  error: duplicate
  message: duplicate key '2026-01-02' at lines 1 and 2
- name: duplicate key, infinities
  text: |
    .inf: a
    +.INF: b
  error: duplicate
  message: duplicate key inf at lines 1 and 2
- name: duplicate key, two nan
  text: |
    .nan: a
    .NaN: b
  error: duplicate
  message: duplicate key nan at lines 1 and 2
- name: keys that differ by type or value
  text: '{!!str 1: a, 1: b, 9007199254740993: c, 9007199254740992.0: d, .inf: e, -.inf: f, 1e400: g, "null": h, ~: i}'
  repr: '{''1'': ''a'', 1: ''b'', 9007199254740993: ''c'', 9007199254740992.0: ''d'', inf: ''e'', -inf: ''f'', ''1e400'': ''g'', ''null'': ''h'', None: ''i''}'
- name: infinity and a large integer differ
  text: |
    .inf: a
    : b
  repr: '{inf: ''a'', : ''b''}'
- name: repeated merge key
  text: |
    x: &x {k: 1}
    y: &y {j: 2}
    z:
      <<: *x
      <<: *y
  error: duplicate
  message: duplicate key '<<' at lines 4 and 5
- name: repeated merge key, plain and merge-tagged
  text: |
    x: &x {k: 1}
    y: &y {j: 2}
    z:
      <<: *x
      !!merge <<: *y
  error: duplicate
  message: duplicate key '<<' at lines 4 and 5
- name: quoted merge spelling beside a merge key is no repeat
  text: |
    x: &x {k: 1}
    z:
      '<<': {a: 1}
      <<: *x
  json: '{"x": {"k": 1}, "z": {"<<": {"a": 1}, "k": 1}}'
- name: duplicate key in an anchored mapping
  text: |
    base: &b {x: 1, x: 2}
    d:
      <<: *b
  error: duplicate
  message: duplicate key 'x' at lines 1 and 1
- name: duplicate key, alias second
  text: |
    a: &k s
    m:
      s: 1
      *k : 2
  error: duplicate
  message: duplicate key 's' at lines 3 and 4
- name: duplicate key, alias first
  text: |
    a: &k s
    m:
      *k : 1
      s: 2
  error: duplicate
  message: duplicate key 's' at lines 3 and 4
- name: duplicate key, explicit key indicator
  text: |
    ?
      a
    : 1
    a: 2
  error: duplicate
  message: duplicate key 'a' at lines 2 and 4
- name: duplicate key, anchored and tagged keys
  text: |
    &p !!str a: 1
    b: 2
    !!str a: 3
  error: duplicate
  message: duplicate key 'a' at lines 1 and 3
- name: several repeats name the first two occurrences
  text: |
    a: 1
    a: 2
    a: 3
  error: duplicate
  message: duplicate key 'a' at lines 1 and 2
- name: several repeated nan keys name the first two
  text: |
    .nan: a
    .nan: b
    .nan: c
  error: duplicate
  message: duplicate key nan at lines 1 and 2
- name: the first repeat in the document is reported
  text: |
    a: 1
    b: 1
    b: 2
    a: 2
  error: duplicate
  message: duplicate key 'b' at lines 2 and 3
- name: a nested repeat before an outer one is reported first
  text: |
    a:
      b: 1
      b: 2
    a: 3
  error: duplicate
  message: duplicate key 'b' at lines 2 and 3
- name: an outer repeat before a nested one is reported first
  text: |
    x: 1
    x:
      y: 1
      y: 2
  error: duplicate
  message: duplicate key 'x' at lines 1 and 2
- name: the same key in sibling mappings is no repeat
  text: |
    a: {k: 1}
    b: {k: 2}
    c: [{k: 3}, {k: 4}]
  json: '{"a": {"k": 1}, "b": {"k": 2}, "c": [{"k": 3}, {"k": 4}]}'
- name: non-string keys
  text: '{1: a, 2.5: b, ~: c, false: d, -3: e, 0x10: f}'
  repr: '{1: ''a'', 2.5: ''b'', None: ''c'', False: ''d'', -3: ''e'', 16: ''f''}'
- name: timestamp key
  text: '{2026-01-02: a}'
  repr: '{''2026-01-02'': ''a''}'
- name: explicit tags construct as PyYAML does
  text: '[!!int 12, !!int "12", !!int 0x1f, !!int 017, !!int 1:30, !!float 1, !!float 1e3, !!float inf, !!float 1:30.5,
    !!bool yes, !!bool OFF, !!null abc, !!timestamp 2024-01-02]'
  repr: '[12, 12, 31, 15, 90, 1.0, 1000.0, inf, 90.5, True, False, None, ''2024-01-02'']'
- name: explicit int reads its text as Python's int() does
  text: |
    - !!int ' 12 '
    - !!int |
      12
    - !!int ١٢
    - !!int '--5'
    - !!int 0o17
    - !!int '1:-2'
    - !!int '0x 1f'
  repr: '[12, 12, 12, 5, 15, 58, 31]'
- name: explicit float reads its text as Python's float() does
  text: |
    - !!float ' 1.5 '
    - !!float 1.
    - !!float INFINITY
    - !!float '--1'
    - !!float ١.٥
    - !!float '1:-2'
  repr: '[1.5, 1.0, inf, 1.0, 1.5, 58.0]'
- name: explicit timestamp in a block scalar
  text: |
    x: !!timestamp |
      2024-01-02
  repr: '{''x'': ''2024-01-02''}'
- name: leap day and offsets normalize
  text: '[2024-02-29, 2024-01-01 10:00:00 -00:00, 2024-01-01 10:00:00 +05:75]'
  repr: '[''2024-02-29'', ''2024-01-01T10:00:00+00:00'', ''2024-01-01T10:00:00+06:15'']'
- name: impossible month
  text: 'x: 2024-13-01'
  error: true
- name: impossible day
  text: 'x: 2023-02-29'
  error: true
- name: year zero
  text: 'x: 0000-01-01'
  error: true
- name: impossible hour
  text: 'x: 2024-01-01 25:00:00'
  error: true
- name: impossible minute
  text: 'x: 2024-01-01 10:61:00'
  error: true
- name: leap second
  text: 'x: 2024-01-01 10:00:60'
  error: true
- name: offset of a day or more
  text: 'x: 2024-01-01 10:00:00 +24:00'
  error: true
- name: explicit int that is not a number
  text: 'x: !!int abc'
  error: true
- name: explicit int with a fraction
  text: 'x: !!int 1.5'
  error: true
- name: empty explicit int
  text: 'x: !!int'
  error: true
- name: explicit float that is not a number
  text: 'x: !!float abc'
  error: true
- name: explicit float in hex
  text: 'x: !!float 0x10'
  error: true
- name: explicit bool that is not a boolean
  text: 'x: !!bool 1'
  error: true
- name: explicit timestamp that is not a date
  text: 'x: !!timestamp abc'
  error: true
- name: unknown tag
  text: 'x: !foo bar'
  error: true
- name: scalar tag on a sequence
  text: 'x: !!int [1]'
  error: true
- name: explicit int with an uppercase hex prefix
  text: 'x: !!int 0X1F'
  error: true
- name: explicit int with a digit beyond its base
  text: 'x: !!int 0b102'
  error: true
- name: explicit float without exponent digits
  text: 'x: !!float 1e'
  error: true
- name: explicit bool with surrounding space
  text: "x: !!bool ' yes'"
  error: true
- name: binary tag is refused
  text: 'x: !!binary aGk='
  error: refused
- name: set tag is refused
  text: 'x: !!set {a, b}'
  error: refused
- name: omap tag is refused
  text: 'x: !!omap [{a: 1}]'
  error: refused
- name: pairs tag is refused
  text: 'x: !!pairs [{a: 1}]'
  error: refused
- name: pairs tag with a repeated key is refused
  text: 'x: !!pairs [{a: 1}, {a: 2}]'
  error: refused
- name: verbatim set tag is refused
  text: 'x: !<tag:yaml.org,2002:set> {a}'
  error: refused
- name: omap tag through a TAG handle is refused
  text: |
    %TAG !y! tag:yaml.org,2002:
    ---
    x: !y!omap [{a: 1}]
  error: refused
- name: binary that is not base64
  text: 'x: !!binary aGk'
  error: true
- name: binary tag on a sequence
  text: 'x: !!binary [1]'
  error: true
- name: set tag on a sequence
  text: 'x: !!set [a]'
  error: true
- name: plain equals sign is a value key
  text: 'x: ='
  error: true
- name: merge tag on a value
  text: 'x: !!merge a'
  error: true
- name: merge key as a value
  text: 'x: <<'
  error: true
- name: merge key as a sequence item
  text: 'x: [<<]'
  error: true
- name: timestamp tag on a sequence
  text: 'x: !!timestamp [1]'
  error: true
- name: flow sequence as a key
  text: '{[1]: a}'
  error: true
- name: flow mapping as a key
  text: '{{a: 1}: b}'
  error: true
- name: explicit flow sequence key
  text: '{? [1]}'
  error: true
- name: explicit block sequence key
  text: |
    ? [1]
    : a
  error: true
- name: aliased sequence as a flow key
  text: |
    a: &k [1]
    b: {*k : a}
  error: true
- name: aliased sequence as a block key
  text: |
    a: &k [1]
    b:
      *k : a
  error: true
- name: aliased mapping as a flow key
  text: |
    a: &k {p: 1}
    b: {*k : a}
  error: true
- name: aliased mapping as a block key
  text: |
    a: &k {p: 1}
    b:
      *k : a
  error: true
- name: anchor name with a dot
  text: 'x: &a.b s'
  error: true
- name: anchor name with a slash
  text: 'x: &a/b s'
  error: true
- name: anchor name with a non-ASCII letter
  text: 'x: &é s'
  error: true
- name: anchor name ends at a colon
  text: 'a: &k: s'
  error: true
- name: non-specific tag on a scalar resolves as untagged
  text: 'x: ! 12'
  json: '{"x": 12}'
- name: non-specific tag on a sequence
  text: 'x: ! [1]'
  json: '{"x": [1]}'
- name: non-specific tag on a mapping
  text: 'x: ! {a: 1}'
  json: '{"x": {"a": 1}}'
- name: string-tagged merge spelling as a value
  text: 'x: !!str <<'
  json: '{"x": "<<"}'
- name: string-tagged merge spelling is a plain key
  text: '{!!str <<: {p: 1}}'
  json: '{"<<": {"p": 1}}'
- name: quoted merge spelling is a plain key
  text: '{''<<'': {p: 1}}'
  json: '{"<<": {"p": 1}}'
- name: merge tag on any key merges
  text: |
    a: &a {p: 1}
    b:
      !!merge y: *a
  json: '{"a": {"p": 1}, "b": {"p": 1}}'
- name: string tag through a TAG handle
  text: |
    %TAG !y! tag:yaml.org,2002:
    ---
    x: !y!str 12
  json: '{"x": "12"}'
- name: verbatim string tag
  text: 'x: !<tag:yaml.org,2002:str> 12'
  json: '{"x": "12"}'
- name: aliased scalar as a flow key before a colon
  text: |
    a: &k s
    b: {*k: a}
  json: '{"a": "s", "b": {"s": "a"}}'
- name: aliased scalar as a block key
  text: |
    a: &k s
    b:
      *k : a
  json: '{"a": "s", "b": {"s": "a"}}'
- name: anchor name with digits, hyphen and underscore
  text: |
    a: &k-1_x s
    b: *k-1_x
  json: '{"a": "s", "b": "s"}'
- name: verbatim merge tag on a key merges
  text: |
    a: &a {p: 1}
    b:
      !<tag:yaml.org,2002:merge> y: *a
  json: '{"a": {"p": 1}, "b": {"p": 1}}'
- name: merge tag through a TAG handle merges
  text: |
    %TAG !y! tag:yaml.org,2002:
    ---
    a: &a {p: 1}
    b:
      !y!merge y: *a
  json: '{"a": {"p": 1}, "b": {"p": 1}}'
- name: aliased recursive sequence as a key
  text: |
    a: &k [*k]
    b: {*k : a}
  error: true
- name: aliased recursive mapping as a key
  text: |
    a: &k {p: *k}
    b:
      *k : a
  error: true
- name: alias names end at flow indicators
  text: |
    a: &k s
    b: [*k, *k]
    c: {x: *k}
  json: '{"a": "s", "b": ["s", "s"], "c": {"x": "s"}}'
- name: anchor names end at flow indicators
  text: '[&k, *k, {a: &j}, [&i]]'
  json: '[null, null, {"a": null}, [null]]'
- name: anchor name ends at an at sign
  text: 'x: &k@ s'
  error: true
- name: anchor name ends at a percent sign
  text: 'x: &k% s'
  error: true
- name: anchor name ends at a backtick
  text: 'x: &k` s'
  error: true
- name: anchor name ends at a question mark
  text: 'x: &k? s'
  error: true
- name: alias name ends at an at sign
  text: |
    x: &k s
    y: *k@
  error: true
- name: non-specific tag on a quoted scalar resolves its text
  text: "x: [! '12', ! \"yes\"]"
  json: '{"x": [12, true]}'
- name: non-specific tag on a block scalar resolves its text
  text: |
    x: ! |
      12
  json: '{"x": 12}'
- name: non-specific tag on a block scalar keeps its final newline for the constructor
  text: |
    x: ! |
      yes
  error: true
- name: non-specific tag on a block scalar float keeps its final newline
  text: |
    x: ! |
      .inf
  error: true
- name: non-specific tag on a quoted merge spelling as a value
  text: "x: ! '<<'"
  error: true
- name: non-specific tag on a quoted merge spelling merges as a key
  text: |
    a: &a {p: 1}
    b:
      ! '<<': *a
  json: '{"a": {"p": 1}, "b": {"p": 1}}'
- name: non-specific tag on an equals sign
  text: 'x: ! ='
  error: true
- name: value tag
  text: 'x: !!value ='
  error: true
- name: string tag on a sequence
  text: 'x: !!str [1]'
  error: true
- name: sequence tag on a scalar
  text: 'x: !!seq a'
  error: true
- name: mapping tag on a sequence
  text: 'x: !!map [1]'
  error: true
- name: merge tag on a quoted key merges
  text: |
    a: &a {p: 1}
    b:
      !!merge 'y': *a
  json: '{"a": {"p": 1}, "b": {"p": 1}}'
- name: merge tag on a collection key merges
  text: '{? !!merge [1] : {p: 1}}'
  json: '{"p": 1}'
- name: aliased merge key merges
  text: |
    a: &a {p: 1}
    b: {&m <<: *a, *m : {q: 1}}
  json: '{"a": {"p": 1}, "b": {"p": 1, "q": 1}}'
- name: aliased merge key as a value
  text: |
    a: &a {p: 1}
    b: {&m <<: *a}
    c: *m
  error: true
- name: alias name ends at a colon in a flow mapping
  text: |
    a: &k s
    b: [{*k:x}, {*k:}]
  json: '{"a": "s", "b": [{"s": "x"}, {"s": null}]}'
- name: alias name ends at a colon in a flow sequence
  text: |
    a: &k s
    b: [*k:x]
  json: '{"a": "s", "b": [{"s": "x"}]}'
- name: anchor name ends at a colon in a flow sequence
  text: 'x: [&k:x]'
  repr: '{''x'': [{None: ''x''}]}'
- name: anchor name ends at a colon before a block plain scalar
  text: 'x: &k:x'
  json: '{"x": ":x"}'
- name: anchor name ends at a question mark before a block plain scalar
  text: 'x: &k?x'
  json: '{"x": "?x"}'
- name: anchor name ends at a question mark in a flow sequence
  text: 'x: [&k?x]'
  error: true
- name: anchor name followed by a flow sequence
  text: 'x: &k[1]'
  error: true
- name: anchor name followed by a flow mapping
  text: 'x: &k{a: 1}'
  error: true
- name: alias name followed by a flow sequence
  text: |
    a: &k s
    b: *k[
  error: true
- name: anchor name starting with a dot
  text: 'x: &.b s'
  error: true
- name: NEL ending an anchor name is refused
  text: "x: {a: &k\x85s, b: *k}"
  error: refused
- name: NEL as a line break is refused
  text: "a: b\x85c: d"
  error: refused
- name: line separator in a quoted scalar is refused
  text: "a: \"x\u2028y\""
  error: refused
- name: paragraph separator in a block literal is refused
  text: "a: |\n  x\u2029  y\n"
  error: refused
- name: NEL inside a plain scalar
  text: "a: x\x85y"
  error: true
- name: line-break escapes in a double-quoted scalar
  text: 'a: "\N\L\P"'
  json: '{"a": "\u0085\u2028\u2029"}'
