name: Publish

on:
  release:
    types: [published]

jobs:
  # Every twin publishes only if every version equals the tag, la pins dr to its minor, each snapshot records its
  # contract's hash and the release rule holds.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the release rule diffs against the previous release tag
      - name: Check the tag, versions, pins, contract hashes and release rule
        run: scripts/release-check "${{ github.event.release.tag_name }}"
      - name: Check the vendored contract snapshots are current
        run: scripts/sync-shared --check

  # deterministic-refactor first: living-architecture depends on it.
  pypi:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # trusted publishing (OIDC)
      contents: read
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build --package deterministic-refactor --out-dir dist/dr
      - run: uv build --package living-architecture --out-dir dist/la
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/dist/dr/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/dist/la/

  # dr first, as on PyPI; a package marked private is skipped.
  npm:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # trusted publishing (OIDC)
      contents: read
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest  # trusted publishing needs npm >= 11.5
      - run: npm ci
      - run: npm run build
      - name: Publish dr, then la
        run: |
          for package in dr la; do
            if [ "$(jq -r '.private // false' "$package/package.json")" = "true" ]; then
              echo "node/$package/package.json is private: skipping its npm publish"
            else
              npm publish -w "$package" --provenance --access public
            fi
          done
