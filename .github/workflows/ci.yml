name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Each PyPI twin's suite, from its workspace member.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        package: [dr, la]
        shard: [1, 2]
    defaults:
      run:
        working-directory: python/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # the release-rule test diffs against the previous release tag
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: ../../scripts/sync-shared --check
        if: matrix.shard == 1
      - run: uv sync --locked --all-packages
      - run: uv run ruff check src tests
        if: matrix.shard == 1
      - run: uv run basedpyright -p .. src tests
        if: matrix.shard == 1
      # Conformance cases run once, in cross-twin.
      - run: >-
          uv run pytest -q --splits 2 --group ${{ matrix.shard }} --durations-path tests/durations/suite.json
          --deselect tests/test_conformance.py::test_case

  # Both packages' wheels and sdists, installed outside the checkout: each carries its contract, dr installs alone,
  # an la install resolves dr, and `uv tool install` exposes both command sets.
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/la
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-packages
      - run: uv run pytest -q tests/test_packaging.py tests/test_packaging_split.py

  # Both npm twins: lint, typecheck, Vitest (incl. the npm pack smoke tests outside the checkout). Their native
  # conformance cases run in the cross-twin typescript leg.
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: ../scripts/sync-shared --check
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Both corpora through one twin's entry points per leg, in three shards.
  cross-twin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        twin: [python, typescript]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-packages
        working-directory: python
      - run: npm ci
        working-directory: node
      - run: >-
          scripts/conformance-cross --twin ${{ matrix.twin }} --splits 3 --group ${{ matrix.shard }}
          --durations-path tests/durations/cross-${{ matrix.twin }}.json

  # The TypeScript flow with only Node: both packed npm twins in a container without python or uv, with a PATH trap
  # that fails the run on any call to python, python3, uv or uvx.
  acceptance-node-only:
    runs-on: ubuntu-latest
    container: node:22-slim
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: scripts/acceptance-node-only

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx -y @anthropic-ai/claude-code plugin validate .
      - run: npx -y @anthropic-ai/claude-code plugin validate plugin/dr
      - run: npx -y @anthropic-ai/claude-code plugin validate plugin/la
