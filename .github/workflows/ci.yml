name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: ../scripts/sync-shared --check
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run basedpyright src tests
      - run: uv run pytest -q

  # The built wheel and sdist, installed outside the checkout, carry the contract and run every command.
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest -q tests/test_packaging.py

  # The npm twin: lint, typecheck, Vitest (incl. the npm pack smoke test outside the checkout). Its native conformance
  # cases run in the cross-twin typescript leg.
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: ../scripts/sync-shared --check
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Every conformance case through one twin's entry points per leg.
  cross-twin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        twin: [python, typescript]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
        working-directory: python
      - run: npm ci
        working-directory: node
      - run: scripts/conformance-cross --twin ${{ matrix.twin }}

  # The TypeScript flow with only Node: the packed npm twin in a container without python or uv, with a PATH trap
  # that fails the run on any call to python, python3, uv or uvx.
  acceptance-node-only:
    runs-on: ubuntu-latest
    container: node:22-slim
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: scripts/acceptance-node-only

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx -y @anthropic-ai/claude-code plugin validate .
      - run: npx -y @anthropic-ai/claude-code plugin validate plugin
