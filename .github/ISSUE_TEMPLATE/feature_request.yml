name: Feature request
description: Something the plugin or the commands should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and where the plugin or the commands got in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
